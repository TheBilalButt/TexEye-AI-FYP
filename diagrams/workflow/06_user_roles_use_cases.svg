<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860" style="background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif"><defs><marker id="arr-black" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><polygon fill="#0f172a" points="0 1 8 4 0 7"/></marker></defs><rect width="1270" height="48" x="25" y="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="6"/><text x="660" y="36" fill="#0f172a" font-size="16" font-weight="bold" text-anchor="middle">TexEye AI — User Roles &amp; System Use Cases</text><text x="660" y="52" fill="#475569" font-size="10.5" text-anchor="middle">Actors, Functional Boundaries, and Use Case Associations for COMSATS FYP Presentation</text><rect width="180" height="90" x="40" y="110" fill="#fff" stroke="#0f172a" stroke-width="1.4" rx="6"/><text x="130" y="135" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">«Actor»</text><text x="130" y="153" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle">Floor Operator</text><text x="130" y="172" fill="#475569" font-size="8.5" text-anchor="middle">(Mobile Floor App)</text><rect width="180" height="90" x="40" y="440" fill="#fff" stroke="#0f172a" stroke-width="1.4" rx="6"/><text x="130" y="465" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">«System Actor»</text><text x="130" y="483" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle">Hardware Stand</text><text x="130" y="502" fill="#475569" font-size="8.5" text-anchor="middle">(Camera &amp; Encoder)</text><rect width="180" height="85" x="1100" y="100" fill="#fff" stroke="#0f172a" stroke-width="1.4" rx="6"/><text x="1190" y="125" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">«Actor»</text><text x="1190" y="143" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle">Quality Inspector</text><text x="1190" y="162" fill="#475569" font-size="8.5" text-anchor="middle">(Web Dashboard)</text><rect width="180" height="85" x="1100" y="270" fill="#fff" stroke="#0f172a" stroke-width="1.4" rx="6"/><text x="1190" y="295" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">«Actor»</text><text x="1190" y="313" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle">Quality Manager</text><text x="1190" y="332" fill="#475569" font-size="8.5" text-anchor="middle">(Web Dashboard)</text><rect width="180" height="85" x="1100" y="440" fill="#fff" stroke="#0f172a" stroke-width="1.4" rx="6"/><text x="1190" y="465" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">«Actor»</text><text x="1190" y="483" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle">System Admin</text><text x="1190" y="502" fill="#475569" font-size="8.5" text-anchor="middle">(Admin Portal)</text><rect width="800" height="660" x="260" y="75" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" rx="8"/><text x="660" y="100" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">TexEye AI Quality Management System Boundary</text><rect width="220" height="42" x="290" y="120" fill="#fff" stroke="#0f172a" stroke-width="1.2" rx="21"/><text x="400" y="145" fill="#0f172a" font-size="9" font-weight="bold" text-anchor="middle">UC-01: Scan Roll QR Tag</text><rect width="220" height="42" x="290" y="180" fill="#fff" stroke="#0f172a" stroke-width="1.2" rx="21"/><text x="400" y="205" fill="#0f172a" font-size="9" font-weight="bold" text-anchor="middle">UC-02: Start / Pause Run</text><rect width="220" height="42" x="290" y="240" fill="#fff" stroke="#0f172a" stroke-width="1.2" rx="21"/><text x="400" y="265" fill="#0f172a" font-size="9" font-weight="bold" text-anchor="middle">UC-03: Live Defect Alerts</text><rect width="220" height="42" x="290" y="300" fill="#fff" stroke="#0f172a" stroke-width="1.2" rx="21"/><text x="400" y="325" fill="#0f172a" font-size="9" font-weight="bold" text-anchor="middle">UC-04: Tag Manual Flaw</text><rect width="220" height="42" x="290" y="390" fill="#fff" stroke="#0f172a" stroke-width="1.2" rx="21"/><text x="400" y="415" fill="#0f172a" font-size="9" font-weight="bold" text-anchor="middle">UC-05: Monitor Reliability</text><rect width="220" height="42" x="290" y="450" fill="#fff" stroke="#0f172a" stroke-width="1.2" rx="21"/><text x="400" y="475" fill="#0f172a" font-size="9" font-weight="bold" text-anchor="middle">UC-06: Autonomous Detection</text><rect width="220" height="42" x="290" y="510" fill="#fff" stroke="#0f172a" stroke-width="1.2" rx="21"/><text x="400" y="535" fill="#0f172a" font-size="9" font-weight="bold" text-anchor="middle">UC-07: Offline Sync Outbox</text><rect width="240" height="42" x="560" y="120" fill="#fff" stroke="#0f172a" stroke-width="1.2" rx="21"/><text x="680" y="145" fill="#0f172a" font-size="9" font-weight="bold" text-anchor="middle">UC-08: View 2D Defect Map</text><rect width="240" height="42" x="560" y="180" fill="#fff" stroke="#0f172a" stroke-width="1.2" rx="21"/><text x="680" y="205" fill="#0f172a" font-size="9" font-weight="bold" text-anchor="middle">UC-09: Reclassify Flaw Images</text><rect width="240" height="42" x="560" y="270" fill="#fff" stroke="#0f172a" stroke-width="1.2" rx="21"/><text x="680" y="295" fill="#0f172a" font-size="9" font-weight="bold" text-anchor="middle">UC-10: Compute ASTM Grade</text><rect width="240" height="42" x="560" y="330" fill="#fff" stroke="#0f172a" stroke-width="1.2" rx="21"/><text x="680" y="355" fill="#0f172a" font-size="9" font-weight="bold" text-anchor="middle">UC-11: Export PDF Certificate</text><rect width="240" height="42" x="560" y="440" fill="#fff" stroke="#0f172a" stroke-width="1.2" rx="21"/><text x="680" y="465" fill="#0f172a" font-size="9" font-weight="bold" text-anchor="middle">UC-12: Manage Users &amp; Stand</text><line x1="220" x2="290" y1="140" y2="140" stroke="#0f172a" stroke-width="1.2"/><line x1="220" x2="290" y1="150" y2="200" stroke="#0f172a" stroke-width="1.2"/><line x1="220" x2="290" y1="160" y2="260" stroke="#0f172a" stroke-width="1.2"/><line x1="220" x2="290" y1="170" y2="320" stroke="#0f172a" stroke-width="1.2"/><line x1="220" x2="290" y1="470" y2="410" stroke="#0f172a" stroke-width="1.2"/><line x1="220" x2="290" y1="485" y2="470" stroke="#0f172a" stroke-width="1.2"/><line x1="220" x2="290" y1="500" y2="530" stroke="#0f172a" stroke-width="1.2"/><line x1="1100" x2="800" y1="140" y2="140" stroke="#0f172a" stroke-width="1.2"/><line x1="1100" x2="800" y1="150" y2="200" stroke="#0f172a" stroke-width="1.2"/><line x1="1100" x2="800" y1="290" y2="155" stroke="#0f172a" stroke-width="1.2"/><line x1="1100" x2="800" y1="310" y2="290" stroke="#0f172a" stroke-width="1.2"/><line x1="1100" x2="800" y1="330" y2="350" stroke="#0f172a" stroke-width="1.2"/><line x1="1100" x2="800" y1="480" y2="460" stroke="#0f172a" stroke-width="1.2"/><rect width="1270" height="80" x="25" y="755" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/><text x="40" y="775" fill="#0f172a" font-size="10" font-weight="bold">Paper-Reproduction Guide for Supervisor Presentation (User Roles &amp; Use Cases):</text><text x="40" y="793" fill="#334155" font-size="8.5">• 5 Clean Actors: Floor Operator (mobile floor actions), Hardware Stand (autonomous sensing/lighting), Quality Inspector (review/calipers), Quality Manager (grading/reports), Admin (config).</text><text x="40" y="809" fill="#334155" font-size="8.5">• Strict Role Separation: Floor workers never modify grading formulas; managers never operate hardware cameras directly.</text></svg>