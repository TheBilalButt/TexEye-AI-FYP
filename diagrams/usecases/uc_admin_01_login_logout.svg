  <text x="750" y="85" font-size="8.5" font-weight="bold" fill="#0f172a" text-anchor="middle">:PostgreSQLDB</text>
  <line x1="750" y1="97" x2="750" y2="423" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="110" y1="120" x2="270" y2="120" stroke="#0f172a" stroke-width="1.2"  marker-end="url(#arr-black)"/>
  <rect x="105.0" y="111" width="170.0" height="16" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
  <text x="190.0" y="122" font-size="7.5" font-weight="bold" fill="#0f172a" text-anchor="middle">1. enter_admin_credentials()</text>
  <line x1="270" y1="156" x2="430" y2="156" stroke="#0f172a" stroke-width="1.2"  marker-end="url(#arr-black)"/>
  <rect x="254.0" y="147" width="192.0" height="16" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
  <text x="350.0" y="158" font-size="7.5" font-weight="bold" fill="#0f172a" text-anchor="middle">2. POST /api/v1/auth/admin-login</text>
  <line x1="430" y1="192" x2="590" y2="192" stroke="#0f172a" stroke-width="1.2"  marker-end="url(#arr-black)"/>
  <rect x="425.0" y="183" width="170.0" height="16" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
  <text x="510.0" y="194" font-size="7.5" font-weight="bold" fill="#0f172a" text-anchor="middle">3. verify_superuser_status()</text>
  <line x1="590" y1="228" x2="750" y2="228" stroke="#0f172a" stroke-width="1.2"  marker-end="url(#arr-black)"/>
  <rect x="560.0" y="219" width="220" height="16" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
  <text x="670.0" y="230" font-size="7.5" font-weight="bold" fill="#0f172a" text-anchor="middle">4. SELECT is_superuser=TRUE, mfa_valid</text>
  <line x1="750" y1="264" x2="590" y2="264" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr-ret)"/>
  <rect x="587.75" y="255" width="164.5" height="16" fill="#f0fdf4" stroke="#86efac" rx="3"/>
  <text x="670.0" y="266" font-size="7.5" font-weight="normal" fill="#166534" text-anchor="middle">5. return admin_user_record</text>
  <line x1="590" y1="300" x2="270" y2="300" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr-ret)"/>
  <rect x="320.0" y="291" width="220" height="16" fill="#f0fdf4" stroke="#86efac" rx="3"/>
  <text x="430.0" y="302" font-size="7.5" font-weight="normal" fill="#166534" text-anchor="middle">6. 200 OK (admin_jwt_token, scopes=['*'])</text>
  <line x1="270" y1="336" x2="110" y2="336" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr-ret)"/>
  <rect x="80.0" y="327" width="220" height="16" fill="#f0fdf4" stroke="#86efac" rx="3"/>
  <text x="190.0" y="338" font-size="7.5" font-weight="normal" fill="#166534" text-anchor="middle">7. render_system_administration_console()</text>
