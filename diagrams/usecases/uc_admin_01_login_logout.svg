  <text x="32" y="451" font-size="8" font-weight="bold" fill="#0f172a">Use Case Execution Summary:</text>
  <text x="32" y="464" font-size="7.5" fill="#334155">Superuser administrator authenticates with elevated privileges to configure edge stand hardware, manage users, and adjust thresholds.</text>
