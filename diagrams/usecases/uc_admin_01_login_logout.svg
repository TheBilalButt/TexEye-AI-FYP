<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 488" width="860" height="488" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;">
