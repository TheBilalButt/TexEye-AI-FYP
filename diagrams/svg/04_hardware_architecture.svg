<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
    <marker id="arrowRev" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <polygon points="8 0, 0 4, 8 8" fill="#000000"/>
    </marker>
  </defs>

  <!-- Academic Double Frame (ReDez SRDS Standard) -->
  <rect x="15" y="15" width="1170" height="820" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1160" height="810" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="600" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 4.1: Hardware Architecture and Physical Interconnect Diagram</text>
  <line x1="50" y1="62" x2="1150" y2="62" stroke="#cccccc" stroke-width="1"/>


  <!-- ==================== BLOCK 1: PHYSICAL INSPECTION STAND ==================== -->
  <rect x="50" y="90" width="270" height="700" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="185" y="120" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">Fabric Inspection Stand</text>
  <line x1="60" y1="132" x2="310" y2="132" stroke="#000000" stroke-width="0.8"/>

  <!-- Row 1: Camera (Center Y = 185) -->
  <rect x="70" y="155" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="185" y="190" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Industrial Camera</text>

  <!-- Row 2: Encoder (Center Y = 265) -->
  <rect x="70" y="235" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="185" y="270" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Rotary Optical Encoder</text>

  <!-- Row 3: Stack Light & Buzzer (Center Y = 345) -->
  <rect x="70" y="315" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="185" y="350" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Stack Light &amp; Buzzer</text>

  <!-- Row 4: Lighting Rig (Center Y = 425) -->
  <rect x="70" y="395" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="185" y="430" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">LED Lighting Rig</text>

  <!-- Row 5: Moving Fabric Web (Center Y = 505) -->
  <rect x="70" y="475" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="185" y="510" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Moving Fabric Web</text>

  <!-- Row 6: Power Supply (Center Y = 585) -->
  <rect x="70" y="555" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="185" y="590" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">System Power Supply</text>

  <!-- Row 7: Stand Physical Frame (Center Y = 665) -->
  <rect x="70" y="635" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="185" y="670" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Inspection Frame</text>


  <!-- ==================== BLOCK 2: INDUSTRIAL EDGE UNIT ==================== -->
  <rect x="470" y="90" width="270" height="700" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="605" y="120" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">Industrial Edge Unit</text>
  <line x1="480" y1="132" x2="730" y2="132" stroke="#000000" stroke-width="0.8"/>

  <!-- Row 1: Camera Driver (Center Y = 185) -->
  <rect x="490" y="155" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="605" y="190" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Camera Ingestion Driver</text>

  <!-- Row 2: GPIO Driver (Center Y = 265) -->
  <rect x="490" y="235" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="605" y="270" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Pulse Counter / GPIO Driver</text>

  <!-- Row 3: Relay Driver (Center Y = 345) -->
  <rect x="490" y="315" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="605" y="350" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Relay Actuation Driver</text>

  <!-- Row 4: Reliability Monitor (Center Y = 425) -->
  <rect x="490" y="395" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="605" y="430" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Inspection Reliability Monitor</text>

  <!-- Row 5: AI Inference (Center Y = 505) -->
  <rect x="490" y="475" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="605" y="510" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">AI Defect Detection &amp; Tracker</text>

  <!-- Row 6: Local Buffer (Center Y = 585) -->
  <rect x="490" y="555" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="605" y="590" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Local Storage Buffer</text>

  <!-- Row 7: Sync Daemon (Center Y = 665) -->
  <rect x="490" y="635" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="605" y="670" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Edge Sync Daemon</text>


  <!-- ==================== BLOCK 3: CENTRAL CLOUD / ENTERPRISE ==================== -->
  <rect x="880" y="90" width="270" height="700" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="1015" y="120" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">Central System &amp; Cloud</text>
  <line x1="890" y1="132" x2="1140" y2="132" stroke="#000000" stroke-width="0.8"/>

  <!-- Row 1: Central Server (Center Y = 185) -->
  <rect x="900" y="155" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1015" y="190" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Central Application Server</text>

  <!-- Row 2: Database (Center Y = 265) -->
  <rect x="900" y="235" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1015" y="270" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Relational Database</text>

  <!-- Row 3: Image Store (Center Y = 345) -->
  <rect x="900" y="315" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1015" y="350" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Defect Image Store</text>

  <!-- Row 4: Web Dashboard Workstation (Center Y = 450) -->
  <rect x="900" y="420" width="230" height="65" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1015" y="457" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Web Dashboard</text>

  <!-- Row 5: Floor Mobile Device (Center Y = 560) -->
  <rect x="900" y="530" width="230" height="65" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1015" y="567" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Floor Mobile Application</text>


  <!-- ==================== INTERCONNECT CONNECTORS (CLEAN SPACING & WHITE BACKING) ==================== -->

  <!-- Interconnect 1: Industrial Camera to Camera Ingestion Driver -->
  <line x1="300" y1="185" x2="490" y2="185" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="330" y="162" width="130" height="18" fill="#ffffff" stroke="#cccccc" stroke-width="0.8" rx="3"/>
  <text x="395" y="175" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">USB 3.0 / GigE</text>

  <!-- Interconnect 2: Rotary Encoder to GPIO Driver -->
  <line x1="300" y1="265" x2="490" y2="265" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="325" y="242" width="140" height="18" fill="#ffffff" stroke="#cccccc" stroke-width="0.8" rx="3"/>
  <text x="395" y="255" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">Quadrature Pulses</text>

  <!-- Interconnect 3: Relay Actuation Driver to Stack Light & Buzzer -->
  <line x1="490" y1="345" x2="300" y2="345" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="330" y="322" width="130" height="18" fill="#ffffff" stroke="#cccccc" stroke-width="0.8" rx="3"/>
  <text x="395" y="335" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">Relay Trigger</text>

  <!-- Interconnect 4: Lighting Rig to Reliability Monitor -->
  <line x1="300" y1="425" x2="490" y2="425" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
  <rect x="335" y="402" width="120" height="18" fill="#ffffff" stroke="#cccccc" stroke-width="0.8" rx="3"/>
  <text x="395" y="415" fill="#000000" font-size="10" text-anchor="middle">Sensor Feedback</text>


  <!-- ==================== EDGE-TO-CLOUD UPLINK ==================== -->
  <path d="M 720 665 L 810 665 L 810 185 L 900 185" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="745" y="642" width="130" height="18" fill="#ffffff" stroke="#cccccc" stroke-width="0.8" rx="3"/>
  <text x="810" y="655" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">HTTPS Data Sync</text>


  <!-- ==================== INTERNAL CLOUD CONNECTORS ==================== -->
  <!-- Server <-> Database -->
  <line x1="1015" y1="215" x2="1015" y2="235" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrowRev)"/>

  <!-- Database <-> Store -->
  <line x1="1015" y1="295" x2="1015" y2="315" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrowRev)"/>

  <!-- Store <-> Dashboard -->
  <line x1="1015" y1="375" x2="1015" y2="420" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrowRev)"/>
  <text x="1030" y="402" fill="#000000" font-size="10" text-anchor="start">HTTPS</text>

  <!-- Dashboard <-> Mobile -->
  <line x1="1015" y1="485" x2="1015" y2="530" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrowRev)"/>
  <text x="1030" y="512" fill="#000000" font-size="10" text-anchor="start">WebSocket / Push</text>

</svg>