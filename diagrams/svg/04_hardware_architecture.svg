<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
    <marker id="arrowRev" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <polygon points="8 0, 0 4, 8 8" fill="#000000"/>
    </marker>
  </defs>

  <!-- Academic Double Frame (ReDez SRDS Standard) -->
  <rect x="15" y="15" width="1170" height="820" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1160" height="810" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="600" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 4.1: Hardware Architecture and Physical Interconnect Diagram</text>
  <line x1="50" y1="62" x2="1150" y2="62" stroke="#cccccc" stroke-width="1"/>


  <!-- ==================== BLOCK 1: PHYSICAL INSPECTION STAND ==================== -->
  <rect x="50" y="90" width="280" height="700" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="190" y="120" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">Fabric Inspection Stand</text>
  <line x1="60" y1="132" x2="320" y2="132" stroke="#000000" stroke-width="0.8"/>

  <!-- Row 1: Camera (Center Y = 185) -->
  <rect x="75" y="155" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="190" y="180" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Industrial Camera</text>
  <text x="190" y="198" fill="#444444" font-size="10" text-anchor="middle">Area-Scan Sensor &amp; Lens</text>

  <!-- Row 2: Encoder (Center Y = 265) -->
  <rect x="75" y="235" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="190" y="260" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Rotary Optical Encoder</text>
  <text x="190" y="278" fill="#444444" font-size="10" text-anchor="middle">Quadrature Pulses (Roller-Coupled)</text>

  <!-- Row 3: Stack Light & Buzzer (Center Y = 345) -->
  <rect x="75" y="315" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="190" y="340" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Stack Light &amp; Buzzer</text>
  <text x="190" y="358" fill="#444444" font-size="10" text-anchor="middle">Audio-Visual Floor Warning</text>

  <!-- Row 4: Lighting Rig (Center Y = 425) -->
  <rect x="75" y="395" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="190" y="420" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">High-CRI LED Lighting Rig</text>
  <text x="190" y="438" fill="#444444" font-size="10" text-anchor="middle">Constant-Current DC Illumination</text>

  <!-- Row 5: Moving Fabric Web (Center Y = 505) -->
  <rect x="75" y="475" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="190" y="500" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Moving Fabric Web</text>
  <text x="190" y="518" fill="#444444" font-size="10" text-anchor="middle">Linear Speed ~0.2 to 0.5 m/s</text>

  <!-- Row 6: Constant-Current Power (Center Y = 585) -->
  <rect x="75" y="555" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="190" y="580" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">DIN-Rail Power Supply</text>
  <text x="190" y="598" fill="#444444" font-size="10" text-anchor="middle">24V DC Industrial Regulated Bus</text>

  <!-- Row 7: Stand Physical Frame (Center Y = 665) -->
  <rect x="75" y="635" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="190" y="660" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Extruded Aluminum Frame</text>
  <text x="190" y="678" fill="#444444" font-size="10" text-anchor="middle">Vibration-Damped Optical Mount</text>


  <!-- ==================== BLOCK 2: INDUSTRIAL EDGE UNIT ==================== -->
  <rect x="460" y="90" width="280" height="700" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="120" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">Industrial Edge Unit (Linux)</text>
  <line x1="470" y1="132" x2="730" y2="132" stroke="#000000" stroke-width="0.8"/>

  <!-- Row 1: Camera Driver (Center Y = 185) -->
  <rect x="485" y="155" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="600" y="180" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Camera Ingestion Driver</text>
  <text x="600" y="198" fill="#444444" font-size="10" text-anchor="middle">V4L2 Ring Buffer &amp; Frame Gate</text>

  <!-- Row 2: GPIO Driver (Center Y = 265) -->
  <rect x="485" y="235" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="600" y="260" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Pulse Counter / GPIO Driver</text>
  <text x="600" y="278" fill="#444444" font-size="10" text-anchor="middle">Hardware Interrupt Counter</text>

  <!-- Row 3: Relay Actuation Driver (Center Y = 345) -->
  <rect x="485" y="315" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="600" y="340" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Relay Actuation Driver</text>
  <text x="600" y="358" fill="#444444" font-size="10" text-anchor="middle">Opto-Isolated GPIO Trigger</text>

  <!-- Row 4: Reliability Monitor (Center Y = 425) -->
  <rect x="485" y="395" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="600" y="420" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Inspection Reliability Monitor</text>
  <text x="600" y="438" fill="#444444" font-size="10" text-anchor="middle">Speed &amp; Lighting Invariant Guard</text>

  <!-- Row 5: AI Inference (Center Y = 505) -->
  <rect x="485" y="475" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="600" y="500" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">AI Inference &amp; Tracker (YOLO)</text>
  <text x="600" y="518" fill="#444444" font-size="10" text-anchor="middle">TensorRT FP16 &amp; ByteTrack</text>

  <!-- Row 6: SQLite Buffer (Center Y = 585) -->
  <rect x="485" y="555" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="600" y="580" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Local SQLite Buffer (WAL)</text>
  <text x="600" y="598" fill="#444444" font-size="10" text-anchor="middle">Transactional Outbox Queue</text>

  <!-- Row 7: Sync Daemon (Center Y = 665) -->
  <rect x="485" y="635" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="600" y="660" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Edge Sync Daemon (HTTPS)</text>
  <text x="600" y="678" fill="#444444" font-size="10" text-anchor="middle">Outbox Dispatcher &amp; Image Sync</text>


  <!-- ==================== BLOCK 3: CENTRAL CLOUD / ENTERPRISE ==================== -->
  <rect x="870" y="90" width="280" height="700" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="1010" y="120" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">Central Cloud / Enterprise</text>
  <line x1="880" y1="132" x2="1140" y2="132" stroke="#000000" stroke-width="0.8"/>

  <!-- Row 1: Central FastAPI Server (Center Y = 185) -->
  <rect x="895" y="155" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1010" y="180" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Central FastAPI Application</text>
  <text x="1010" y="198" fill="#444444" font-size="10" text-anchor="middle">REST Ingestion &amp; WebSocket Hub</text>

  <!-- Row 2: PostgreSQL (Center Y = 265) -->
  <rect x="895" y="235" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1010" y="260" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">PostgreSQL Database</text>
  <text x="1010" y="278" fill="#444444" font-size="10" text-anchor="middle">Roll, Defect &amp; Audit Records</text>

  <!-- Row 3: MinIO / S3 (Center Y = 345) -->
  <rect x="895" y="315" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1010" y="340" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Image Object Store (MinIO / S3)</text>
  <text x="1010" y="358" fill="#444444" font-size="10" text-anchor="middle">Defect Image Crops Archive</text>

  <!-- Row 4: Web Dashboard Workstation (Center Y = 450) -->
  <rect x="895" y="420" width="230" height="65" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1010" y="447" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Web Dashboard Workstation</text>
  <text x="1010" y="467" fill="#444444" font-size="10" text-anchor="middle">Quality &amp; Production Management</text>

  <!-- Row 5: Floor Mobile Device (Center Y = 560) -->
  <rect x="895" y="530" width="230" height="65" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1010" y="557" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Floor Mobile Device</text>
  <text x="1010" y="577" fill="#444444" font-size="10" text-anchor="middle">Operator QR Scanner &amp; Alerts</text>


  <!-- ==================== FULLY SYNCHRONIZED PARALLEL CONNECTORS (ZERO CUTS) ==================== -->

  <!-- Interconnect 1: Industrial Camera to Camera Ingestion Driver (Parallel Horizontal at Y=185) -->
  <line x1="305" y1="185" x2="485" y2="185" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="395" y="175" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">USB 3.0 / GigE</text>

  <!-- Interconnect 2: Rotary Encoder to GPIO Driver (Parallel Horizontal at Y=265) -->
  <line x1="305" y1="265" x2="485" y2="265" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="395" y="255" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">Quadrature Pulses (GPIO)</text>

  <!-- Interconnect 3: Relay Actuation Driver to Stack Light & Buzzer (Parallel Horizontal at Y=345) -->
  <line x1="485" y1="345" x2="305" y2="345" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="395" y="335" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">Relay Trigger (24V DC)</text>

  <!-- Interconnect 4: Lighting Rig to Reliability Monitor (Parallel Horizontal at Y=425) -->
  <line x1="305" y1="425" x2="485" y2="425" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
  <text x="395" y="415" fill="#000000" font-size="10" text-anchor="middle">Sensor Feedback</text>


  <!-- ==================== CLEAN ORTHOGONAL EDGE-TO-CLOUD UPLINK (ZERO CUTS) ==================== -->
  <!-- Leaves Edge Sync Daemon at Y=665, runs orthogonally via open channel at X=805, and enters FastAPI at Y=185 -->
  <path d="M 715 665 L 805 665 L 805 185 L 895 185" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="655" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">HTTPS REST Batches</text>


  <!-- ==================== INTERNAL CLOUD SPINE CONNECTORS ==================== -->
  <!-- FastAPI <-> PostgreSQL -->
  <line x1="1010" y1="215" x2="1010" y2="235" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrowRev)"/>

  <!-- PostgreSQL <-> S3 -->
  <line x1="1010" y1="295" x2="1010" y2="315" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrowRev)"/>

  <!-- S3 <-> Web Dashboard Workstation -->
  <line x1="1010" y1="375" x2="1010" y2="420" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrowRev)"/>
  <text x="1025" y="402" fill="#000000" font-size="9.5" text-anchor="start">HTTPS</text>

  <!-- Web Workstation <-> Floor Mobile Device -->
  <line x1="1010" y1="485" x2="1010" y2="530" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrowRev)"/>
  <text x="1025" y="512" fill="#000000" font-size="9.5" text-anchor="start">WSS / Push</text>

</svg>