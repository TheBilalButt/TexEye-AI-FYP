ading • PDF Reports</text></g><g filter="url(#shadow4)" transform="translate(200, 935)"><rect width="1050" height="90" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" rx="8"/><text x="25" y="25" fill="#f59e0b" font-size="12" font-weight="bold">CRITICAL SCOPE BOUNDARY NOTICE &amp; ENGINEERING CONSTRAINTS:</text><text x="25" y="48" fill="#fff" font-size="11">• Confirmed Components: Industrial Camera, Rotary Encoder, Uniform Lighting, Edge Computer, Central Backend, Mobile App, Web Portal.</text><text x="25" y="66" fill="#fde68a" font-size="11">• Proposed Alternatives: USB 3.0 / GigE Vision / MIPI; GPIO counter / Opto DAQ; Constant Current Driver; Tower Light Relay.</text><text x="25" y="82" fill="#f87171" font-size="11">• Out of Scope (Do Not Implement): Automatic cutting, machine stopping, remote machine control, automatic fabric marking actuator.</text></g></svg>