<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
    <marker id="arrowRev" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <polygon points="8 0, 0 4, 8 8" fill="#000000"/>
    </marker>
  </defs>

  <!-- Academic Double Frame -->
  <rect x="15" y="15" width="1170" height="820" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1160" height="810" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="600" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 4.1: Hardware Architecture and Physical Interconnect Diagram</text>
  <line x1="50" y1="62" x2="1150" y2="62" stroke="#cccccc" stroke-width="1"/>

  <!-- BLOCK 1: Physical Inspection Stand -->
  <rect x="50" y="90" width="280" height="690" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="190" y="120" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">Fabric Inspection Stand</text>
  <line x1="60" y1="132" x2="320" y2="132" stroke="#000000" stroke-width="0.8"/>

  <!-- Sub-devices inside Stand -->
  <rect x="75" y="160" width="230" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="190" y="195" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Industrial Camera</text>
  <text x="190" y="215" fill="#444444" font-size="10.5" text-anchor="middle">Area-Scan Sensor &amp; Lens</text>

  <rect x="75" y="280" width="230" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="190" y="315" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Rotary Encoder</text>
  <text x="190" y="335" fill="#444444" font-size="10.5" text-anchor="middle">Quadrature Pulses (Roller-Coupled)</text>

  <rect x="75" y="400" width="230" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="190" y="435" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">High-CRI LED Lighting Rig</text>
  <text x="190" y="455" fill="#444444" font-size="10.5" text-anchor="middle">Regulated DC Illumination</text>

  <rect x="75" y="520" width="230" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="190" y="555" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Stack Light &amp; Buzzer</text>
  <text x="190" y="575" fill="#444444" font-size="10.5" text-anchor="middle">Audio-Visual Floor Warning</text>

  <rect x="75" y="640" width="230" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="190" y="675" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Moving Fabric Web</text>
  <text x="190" y="695" fill="#444444" font-size="10.5" text-anchor="middle">Linear Speed ~0.2 to 0.5 m/s</text>


  <!-- BLOCK 2: Industrial Edge Processing Unit -->
  <rect x="460" y="90" width="280" height="690" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="120" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">Industrial Edge Unit</text>
  <line x1="470" y1="132" x2="730" y2="132" stroke="#000000" stroke-width="0.8"/>

  <!-- Modules inside Edge -->
  <rect x="485" y="160" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="600" y="195" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Camera Ingestion Driver</text>

  <rect x="485" y="240" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="600" y="275" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Pulse Counter / GPIO Interface</text>

  <rect x="485" y="320" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="600" y="355" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Inspection Reliability Monitor</text>

  <rect x="485" y="400" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="600" y="435" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">AI Inference &amp; Tracker (YOLO)</text>

  <rect x="485" y="480" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="600" y="515" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Relay Actuation Driver</text>

  <rect x="485" y="560" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="600" y="595" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Local SQLite Buffer (WAL)</text>

  <rect x="485" y="640" width="230" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="600" y="675" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Edge Sync Daemon (HTTPS)</text>


  <!-- BLOCK 3: Central Server & User Terminals -->
  <rect x="870" y="90" width="280" height="690" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="1010" y="120" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">Central Cloud / Enterprise</text>
  <line x1="880" y1="132" x2="1140" y2="132" stroke="#000000" stroke-width="0.8"/>

  <!-- Sub-blocks inside Central -->
  <rect x="895" y="160" width="230" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1010" y="195" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Central FastAPI Application</text>
  <text x="1010" y="215" fill="#444444" font-size="10.5" text-anchor="middle">REST API &amp; WebSocket Server</text>

  <rect x="895" y="280" width="230" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1010" y="315" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">PostgreSQL Database</text>
  <text x="1010" y="335" fill="#444444" font-size="10.5" text-anchor="middle">Roll, Defect &amp; Grading Records</text>

  <rect x="895" y="400" width="230" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1010" y="435" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Image Object Store (MinIO / S3)</text>
  <text x="1010" y="455" fill="#444444" font-size="10.5" text-anchor="middle">Defect Image Crops Archive</text>

  <rect x="895" y="520" width="230" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1010" y="555" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Web Dashboard Workstation</text>
  <text x="1010" y="575" fill="#444444" font-size="10.5" text-anchor="middle">Quality &amp; Production Management</text>

  <rect x="895" y="640" width="230" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1010" y="675" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Floor Mobile Device</text>
  <text x="1010" y="695" fill="#444444" font-size="10.5" text-anchor="middle">Operator QR Scanner &amp; Alerts</text>


  <!-- ==================== CONNECTORS ==================== -->

  <!-- Stand to Edge: Camera -->
  <line x1="305" y1="195" x2="485" y2="190" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="335" y="172" width="120" height="20" fill="#ffffff" stroke="none"/>
  <text x="395" y="186" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">USB 3.0 / GigE</text>

  <!-- Stand to Edge: Encoder -->
  <line x1="305" y1="315" x2="485" y2="270" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="315" y="278" width="160" height="20" fill="#ffffff" stroke="none"/>
  <text x="395" y="292" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">Quadrature Pulses (GPIO)</text>

  <!-- Stand to Edge: Lighting Monitoring -->
  <line x1="305" y1="435" x2="485" y2="350" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
  <rect x="335" y="378" width="120" height="20" fill="#ffffff" stroke="none"/>
  <text x="395" y="392" fill="#000000" font-size="10" text-anchor="middle">Sensor Feedback</text>

  <!-- Edge to Stand: Relay Alarm -->
  <line x1="485" y1="510" x2="305" y2="555" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="320" y="522" width="150" height="20" fill="#ffffff" stroke="none"/>
  <text x="395" y="536" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">Relay Trigger (24V DC)</text>

  <!-- Edge to Central: Sync Uplink -->
  <line x1="715" y1="670" x2="895" y2="195" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="735" y="415" width="140" height="22" fill="#ffffff" stroke="none"/>
  <text x="805" y="430" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">HTTPS REST Batches</text>

  <!-- Central Server to PostgreSQL -->
  <line x1="1010" y1="230" x2="1010" y2="280" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrowRev)"/>

  <!-- Central Server to S3 -->
  <line x1="1010" y1="350" x2="1010" y2="400" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrowRev)"/>

  <!-- Central Server to Web Workstation -->
  <line x1="1010" y1="470" x2="1010" y2="520" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrowRev)"/>
  <rect x="1030" y="485" width="50" height="18" fill="#ffffff" stroke="none"/>
  <text x="1055" y="498" fill="#000000" font-size="9" text-anchor="middle">HTTPS</text>

  <!-- Central Server to Floor Mobile -->
  <line x1="1010" y1="590" x2="1010" y2="640" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrowRev)"/>
  <rect x="1025" y="605" width="60" height="18" fill="#ffffff" stroke="none"/>
  <text x="1055" y="618" fill="#000000" font-size="9" text-anchor="middle">WSS / Push</text>

</svg>
