<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1450 910" style="background-color:#0b1120;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="hdr13" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><filter id="sh13" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".5" stdDeviation="6"/></filter><marker id="mB13" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#38bdf8" d="M0,0 L0,6 L9,3 z"/></marker><marker id="mG13" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#4ade80" d="M0,0 L0,6 L9,3 z"/></marker><marker id="mR13" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#f87171" d="M0,0 L0,6 L9,3 z"/></marker><marker id="mY13" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#fbbf24" d="M0,0 L0,6 L9,3 z"/></marker></defs><g filter="url(#sh13)" transform="translate(100, 30)"><rect width="1250" height="70" fill="url(#hdr13)" stroke="#334155" stroke-width="1.5" rx="12"/><text x="625" y="32" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">TexEye AI — Sequence Diagram: Offline / Online Data Synchronization Flow</text><text x="625" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Local ACID Caching • Periodic Connectivity Watchdog • Atomic Central Ingestion with UUID Idempotency</text></g><g transform="translate(80, 120)"><rect width="160" height="50" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" rx="8"/><text x="80" y="27" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">Inspection Engine</text><text x="80" y="42" fill="#e9d5ff" font-size="10" text-anchor="middle">Edge Core Process</text><line x1="80" x2="80" y1="50" y2="920" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/></g><g transform="translate(300, 120)"><rect width="160" height="50" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" rx="8"/><text x="80" y="27" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Local SQLite DB</text><text x="80" y="42" fill="#fde68a" font-size="10" text-anchor="middle">WAL Mode (Zero Wait)</text><line x1="80" x2="80" y1="50" y2="920" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/></g><g transform="translate(520, 120)"><rect width="160" height="50" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" rx="8"/><text x="80" y="27" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Local Flash Cache</text><text x="80" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">JPEG Snippet Disk</text><line x1="80" x2="80" y1="50" y2="920" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/></g><g transform="translate(740, 120)"><rect width="160" height="50" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2" rx="8"/><text x="80" y="27" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Edge Sync Daemon</text><text x="80" y="42" fill="#93c5fd" font-size="10" text-anchor="middle">Background Worker</text><line x1="80" x2="80" y1="50" y2="920" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/></g><g transform="translate(960, 120)"><rect width="160" height="50" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" rx="8"/><text x="80" y="27" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">Central FastAPI</text><text x="80" y="42" fill="#86efac" font-size="10" text-anchor="middle">REST Gateway</text><line x1="80" x2="80" y1="50" y2="920" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/></g><g transform="translate(1180, 120)"><rect width="170" height="50" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" rx="8"/><text x="85" y="27" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">PostgreSQL &amp; MinIO</text><text x="85" y="42" fill="#86efac" font-size="10" text-anchor="middle">Cloud Enterprise Storage</text><line x1="85" x2="85" y1="50" y2="920" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/></g><g transform="translate(60, 185)"><rect width="1310" height="85" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="20" y="20" fill="#fbbf24" font-size="11" font-weight="bold">Phase 1: Local Autonomous Execution (Zero Latency on Factory Floor)</text></g><path stroke="#fbbf24" stroke-width="2" marker-end="url(#mY13)" d="M 160 220 L 380 220"/><text x="210" y="212" fill="#fbbf24" font-size="10" font-weight="bold">1. INSERT Record (sync_status = &apos;PENDING&apos;)</text><path stroke="#fbbf24" stroke-width="2" marker-end="url(#mY13)" d="M 160 250 L 600 250"/><text x="210" y="242" fill="#fbbf24" font-size="10" font-weight="bold">2. Save Defect Snippet Image (local_path)</text><g transform="translate(60, 290)"><rect width="1310" height="580" fill="#0f172a" stroke="#64748b" stroke-dasharray="4 2" stroke-width="1.5" rx="10"/><text x="20" y="25" fill="#f8fafc" font-size="12" font-weight="bold">[loop: Health Check &amp; Sync Daemon (Every 5s)]</text><rect width="1280" height="150" x="15" y="35" fill="#450a0a" opacity=".3"/><text x="30" y="55" fill="#fca5a5" font-size="11" font-weight="bold">[Network Outage / Factory Wi-Fi Disconnected]</text><rect width="1280" height="350" x="15" y="210" fill="#052e16" opacity=".3"/><text x="30" y="230" fill="#86efac" font-size="11" font-weight="bold">[Network Link Restored / Backend Reachable]</text></g><path stroke="#f87171" stroke-width="2" marker-end="url(#mR13)" d="M 820 370 L 1040 370"/><text x="860" y="362" fill="#f87171" font-size="10" font-weight="bold">3. HTTPS GET /health (Heartbeat)</text><text x="1045" y="375" fill="#ef4444" font-size="16" font-weight="bold">× (Timeout / Connection Refused)</text><rect width="450" height="40" x="760" y="405" fill="#1e293b" stroke="#ef4444" stroke-width="1" rx="6"/><text x="985" y="425" fill="#fca5a5" font-size="10" text-anchor="middle">Internet Offline: Buffer records locally. Zero stoppage.</text><text x="985" y="438" fill="#fca5a5" font-size="9" text-anchor="middle">Retry heartbeat probe with exponential backoff &amp; jitter.</text><path stroke="#4ade80" stroke-width="2" marker-end="url(#mG13)" d="M 820 540 L 1040 540"/><text x="860" y="532" fill="#4ade80" font-size="10" font-weight="bold">4. HTTPS GET /health → 200 OK</text><path stroke="#38bdf8" stroke-width="2" marker-end="url(#mB13)" d="M 820 575 L 380 575"/><text x="500" y="568" fill="#38bdf8" font-size="10" font-weight="bold">5. Fetch Oldest Pending Batch (LIMIT 50)</text><path stroke="#94a3b8" stroke-dasharray="4 2" stroke-width="1.5" marker-end="url(#mB13)" d="M 380 605 L 820 605"/><text x="500" y="600" fill="#94a3b8" font-size="10">6. Return JSON payload batch</text><path stroke="#38bdf8" stroke-width="1.5" marker-end="url(#mB13)" d="M 820 635 L 600 635"/><text x="640" y="628" fill="#38bdf8" font-size="10">7. Read Associated Image Byte Streams</text><path stroke="#4ade80" stroke-width="3" marker-end="url(#mG13)" d="M 820 675 L 1040 675"/><text x="840" y="668" fill="#4ade80" font-size="11" font-weight="bold">8. HTTPS POST /api/v1/sync/batch (Multipart / Gzipped JSON + Images)</text><path stroke="#4ade80" stroke-width="2" marker-end="url(#mG13)" d="M 1040 710 L 1265 710"/><text x="1070" y="702" fill="#4ade80" font-size="10" font-weight="bold">9. Upsert PostgreSQL (UUIDv4 Idempotent Deduplication)</text><path stroke="#4ade80" stroke-width="2" marker-end="url(#mG13)" d="M 1040 740 L 1265 740"/><text x="1070" y="732" fill="#4ade80" font-size="10" font-weight="bold">10. MinIO PutObject (Store JPEG Crop &amp; Return Cloud URL)</text><path stroke="#4ade80" stroke-width="2" marker-end="url(#mG13)" d="M 1040 785 L 820 785"/><text x="850" y="778" fill="#4ade80" font-size="10" font-weight="bold">11. HTTP 200 OK (Batch Acknowledged: {synced_ids: [...]})</text><path stroke="#38bdf8" stroke-width="2" marker-end="url(#mB13)" d="M 820 815 L 380 815"/><text x="500" y="808" fill="#38bdf8" font-size="10" font-weight="bold">12. UPDATE sync_queue SET status = &apos;SYNCED&apos;</text><path stroke="#94a3b8" stroke-width="1.5" marker-end="url(#mB13)" d="M 820 845 L 600 845"/><text x="640" y="838" fill="#94a3b8" font-size="10">13. Evict / Purge Uploaded Images as per Retention Quota</text></svg>