<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
    <marker id="openArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#000000" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Academic Double Frame -->
  <rect x="15" y="15" width="1070" height="820" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1060" height="810" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="550" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 5.5: Sequence Diagram: Offline Buffering &amp; Cloud Synchronization</text>
  <line x1="50" y1="62" x2="1050" y2="62" stroke="#cccccc" stroke-width="1"/>

  <!-- PARTICIPANTS -->
  <!-- 1. Sync Daemon -->
  <rect x="50" y="85" width="150" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="125" y="111" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Edge Sync Daemon</text>
  <line x1="125" y1="127" x2="125" y2="760" stroke="#000000" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 2. Local SQLite Outbox -->
  <rect x="240" y="85" width="150" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="315" y="111" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Local SQLite DB</text>
  <line x1="315" y1="127" x2="315" y2="760" stroke="#000000" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 3. Local Image Cache -->
  <rect x="430" y="85" width="150" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="505" y="111" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Local Image Cache</text>
  <line x1="505" y1="127" x2="505" y2="760" stroke="#000000" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 4. Central Ingestion API -->
  <rect x="620" y="85" width="160" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="700" y="111" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Central FastAPI Server</text>
  <line x1="700" y1="127" x2="700" y2="760" stroke="#000000" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 5. PostgreSQL Central DB -->
  <rect x="815" y="85" width="120" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="875" y="111" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">PostgreSQL</text>
  <line x1="875" y1="127" x2="875" y2="760" stroke="#000000" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 6. MinIO / S3 Storage -->
  <rect x="965" y="85" width="105" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1017" y="111" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">MinIO S3</text>
  <line x1="1017" y1="127" x2="1017" y2="760" stroke="#000000" stroke-width="1" stroke-dasharray="4 4"/>


  <!-- ACTIVATION BARS -->
  <rect x="119" y="145" width="12" height="580" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="309" y="155" width="12" height="50" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="499" y="320" width="12" height="50" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="694" y="235" width="12" height="395" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="869" y="445" width="12" height="60" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="1011" y="525" width="12" height="60" fill="#ffffff" stroke="#000000" stroke-width="1"/>


  <!-- ==================== MESSAGES WITH ZERO-OVERLAP CORRIDOR PLACEMENT & WHITE MASKS ==================== -->

  <!-- Step 1: Query Pending Batches (Edge Sync Daemon <-> Local SQLite DB) -->
  <line x1="131" y1="160" x2="309" y2="160" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="140" y="142" width="160" height="16" fill="#ffffff"/>
  <text x="220" y="154" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">SelectPendingBatches(limit=50)</text>

  <line x1="309" y1="195" x2="131" y2="195" stroke="#000000" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <rect x="160" y="177" width="120" height="16" fill="#ffffff"/>
  <text x="220" y="189" fill="#000000" font-size="10" text-anchor="middle">PendingRecordsList</text>


  <!-- Step 2: Heartbeat Probe (Edge Sync Daemon <-> Central FastAPI Server) -->
  <line x1="131" y1="240" x2="694" y2="240" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="365" y="222" width="90" height="16" fill="#ffffff"/>
  <text x="410" y="234" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">GET /health</text>

  <line x1="694" y1="275" x2="131" y2="275" stroke="#000000" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <rect x="330" y="257" width="160" height="16" fill="#ffffff"/>
  <text x="410" y="269" fill="#000000" font-size="10.5" text-anchor="middle">HTTP_200_OK(ready=true)</text>


  <!-- Step 3: Fetch JPEG Crops from Cache (Edge Sync Daemon <-> Local Image Cache) -->
  <!-- Positioned in Span 1 (x=220) completely clear of SQLite lifeline -->
  <line x1="131" y1="325" x2="499" y2="325" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="135" y="307" width="170" height="16" fill="#ffffff"/>
  <text x="220" y="319" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">ReadImageCrops(file_keys)</text>

  <line x1="499" y1="360" x2="131" y2="360" stroke="#000000" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <rect x="155" y="342" width="130" height="16" fill="#ffffff"/>
  <text x="220" y="354" fill="#000000" font-size="10" text-anchor="middle">BinaryJPEGPayload</text>


  <!-- Step 4: Transmit Multipart Batch (Edge Sync Daemon -> Central FastAPI Server) -->
  <line x1="131" y1="410" x2="694" y2="410" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="275" y="392" width="270" height="17" fill="#ffffff"/>
  <text x="410" y="404" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">POST /api/v1/sync/batch (JSON + Crops)</text>


  <!-- Step 5: Server commits to Postgres (Central FastAPI Server <-> PostgreSQL) -->
  <line x1="706" y1="450" x2="869" y2="450" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="720" y="432" width="135" height="16" fill="#ffffff"/>
  <text x="787" y="444" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">UpsertDefectRecords()</text>

  <line x1="869" y1="485" x2="706" y2="485" stroke="#000000" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <rect x="732" y="467" width="110" height="16" fill="#ffffff"/>
  <text x="787" y="479" fill="#000000" font-size="10" text-anchor="middle">RecordsCommitted</text>


  <!-- Step 6: Server uploads images to S3 (Central FastAPI Server <-> MinIO S3) -->
  <!-- Positioned in Span 1 (x=787) completely clear of PostgreSQL lifeline -->
  <line x1="706" y1="530" x2="1011" y2="530" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="735" y="512" width="105" height="16" fill="#ffffff"/>
  <text x="787" y="524" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">PutObject(crops)</text>

  <line x1="1011" y1="565" x2="706" y2="565" stroke="#000000" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <rect x="730" y="547" width="115" height="16" fill="#ffffff"/>
  <text x="787" y="559" fill="#000000" font-size="10" text-anchor="middle">UploadConfirmed</text>


  <!-- Step 7: Ingestion Confirmation to Edge (Central FastAPI Server -> Edge Sync Daemon) -->
  <line x1="694" y1="615" x2="131" y2="615" stroke="#000000" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <rect x="310" y="597" width="200" height="16" fill="#ffffff"/>
  <text x="410" y="609" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">HTTP_200_OK(synced_batch_ids)</text>


  <!-- Step 8: Local Outbox Status Update (Edge Sync Daemon -> Local SQLite DB) -->
  <line x1="131" y1="665" x2="309" y2="665" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="155" y="647" width="130" height="16" fill="#ffffff"/>
  <text x="220" y="659" fill="#000000" font-size="10" text-anchor="middle">MarkOutboxSynced()</text>

  <!-- Step 9: Local Image Cache Eviction (Edge Sync Daemon -> Local Image Cache) -->
  <!-- Positioned in Span 1 (x=220) completely clear of SQLite lifeline and away from bottom frame -->
  <line x1="131" y1="705" x2="499" y2="705" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="155" y="687" width="130" height="16" fill="#ffffff"/>
  <text x="220" y="699" fill="#000000" font-size="10" text-anchor="middle">EvictSyncedImages()</text>

</svg>