<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1150" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="hdr13" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <filter id="sh13" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/></filter>
    <marker id="mB13" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="mG13" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4ade80"/></marker>
    <marker id="mR13" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f87171"/></marker>
    <marker id="mY13" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker>
  </defs>

  <!-- Title -->
  <g transform="translate(100, 30)" filter="url(#sh13)">
    <rect width="1250" height="70" rx="12" fill="url(#hdr13)" stroke="#334155" stroke-width="1.5"/>
    <text x="625" y="32" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">TexEye AI &mdash; Sequence Diagram: Offline / Online Data Synchronization Flow</text>
    <text x="625" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Local ACID Caching &bull; Periodic Connectivity Watchdog &bull; Atomic Central Ingestion with UUID Idempotency</text>
  </g>

  <!-- Lifeline Headers -->
  <!-- 1. AI Engine -->
  <g transform="translate(80, 120)">
    <rect width="160" height="50" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="80" y="27" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">Inspection Engine</text>
    <text x="80" y="42" fill="#e9d5ff" font-size="10" text-anchor="middle">Edge Core Process</text>
    <line x1="80" y1="50" x2="80" y2="920" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 2. SQLite DB -->
  <g transform="translate(300, 120)">
    <rect width="160" height="50" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="80" y="27" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Local SQLite DB</text>
    <text x="80" y="42" fill="#fde68a" font-size="10" text-anchor="middle">WAL Mode (Zero Wait)</text>
    <line x1="80" y1="50" x2="80" y2="920" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 3. Local Flash Disk -->
  <g transform="translate(520, 120)">
    <rect width="160" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="80" y="27" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Local Flash Cache</text>
    <text x="80" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">JPEG Snippet Disk</text>
    <line x1="80" y1="50" x2="80" y2="920" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 4. Sync Agent -->
  <g transform="translate(740, 120)">
    <rect width="160" height="50" rx="8" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="27" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Edge Sync Daemon</text>
    <text x="80" y="42" fill="#93c5fd" font-size="10" text-anchor="middle">Background Worker</text>
    <line x1="80" y1="50" x2="80" y2="920" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 5. Central API -->
  <g transform="translate(960, 120)">
    <rect width="160" height="50" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="80" y="27" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">Central FastAPI</text>
    <text x="80" y="42" fill="#86efac" font-size="10" text-anchor="middle">REST Gateway</text>
    <line x1="80" y1="50" x2="80" y2="920" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 6. Cloud DB & S3 -->
  <g transform="translate(1180, 120)">
    <rect width="170" height="50" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="85" y="27" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">PostgreSQL &amp; MinIO</text>
    <text x="85" y="42" fill="#86efac" font-size="10" text-anchor="middle">Cloud Enterprise Storage</text>
    <line x1="85" y1="50" x2="85" y2="920" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Section 1: Normal Local Operation -->
  <g transform="translate(60, 185)">
    <rect width="1310" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="20" fill="#fbbf24" font-size="11" font-weight="bold">Phase 1: Local Autonomous Execution (Zero Latency on Factory Floor)</text>
  </g>

  <path d="M 160 220 L 380 220" stroke="#fbbf24" stroke-width="2" marker-end="url(#mY13)"/>
  <text x="210" y="212" fill="#fbbf24" font-size="10" font-weight="bold">1. INSERT Record (sync_status = 'PENDING')</text>

  <path d="M 160 250 L 600 250" stroke="#fbbf24" stroke-width="2" marker-end="url(#mY13)"/>
  <text x="210" y="242" fill="#fbbf24" font-size="10" font-weight="bold">2. Save Defect Snippet Image (local_path)</text>

  <!-- Loop: Connectivity Check -->
  <g transform="translate(60, 290)">
    <rect width="1310" height="580" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="20" y="25" fill="#f8fafc" font-size="12" font-weight="bold">[loop: Health Check &amp; Sync Daemon (Every 5s)]</text>

    <!-- Sub-block 1: Offline -->
    <rect x="15" y="35" width="1280" height="150" fill="#450a0a" opacity="0.3"/>
    <text x="30" y="55" fill="#fca5a5" font-size="11" font-weight="bold">[Network Outage / Factory Wi-Fi Disconnected]</text>

    <!-- Sub-block 2: Online -->
    <rect x="15" y="210" width="1280" height="350" fill="#052e16" opacity="0.3"/>
    <text x="30" y="230" fill="#86efac" font-size="11" font-weight="bold">[Network Link Restored / Backend Reachable]</text>
  </g>

  <!-- Messages in Offline -->
  <path d="M 820 370 L 1040 370" stroke="#f87171" stroke-width="2" marker-end="url(#mR13)"/>
  <text x="860" y="362" fill="#f87171" font-size="10" font-weight="bold">3. HTTPS GET /health (Heartbeat)</text>

  <!-- X mark -->
  <text x="1045" y="375" fill="#ef4444" font-size="16" font-weight="bold">&times; (Timeout / Connection Refused)</text>

  <rect x="760" y="405" width="450" height="40" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="985" y="425" fill="#fca5a5" font-size="10" text-anchor="middle">Internet Offline: Buffer records locally. Zero stoppage.</text>
  <text x="985" y="438" fill="#fca5a5" font-size="9" text-anchor="middle">Retry heartbeat probe with exponential backoff &amp; jitter.</text>

  <!-- Messages in Online -->
  <path d="M 820 540 L 1040 540" stroke="#4ade80" stroke-width="2" marker-end="url(#mG13)"/>
  <text x="860" y="532" fill="#4ade80" font-size="10" font-weight="bold">4. HTTPS GET /health &rarr; 200 OK</text>

  <path d="M 820 575 L 380 575" stroke="#38bdf8" stroke-width="2" marker-end="url(#mB13)"/>
  <text x="500" y="568" fill="#38bdf8" font-size="10" font-weight="bold">5. Fetch Oldest Pending Batch (LIMIT 50)</text>

  <path d="M 380 605 L 820 605" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#mB13)"/>
  <text x="500" y="600" fill="#94a3b8" font-size="10">6. Return JSON payload batch</text>

  <path d="M 820 635 L 600 635" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#mB13)"/>
  <text x="640" y="628" fill="#38bdf8" font-size="10">7. Read Associated Image Byte Streams</text>

  <path d="M 820 675 L 1040 675" stroke="#4ade80" stroke-width="3" marker-end="url(#mG13)"/>
  <text x="840" y="668" fill="#4ade80" font-size="11" font-weight="bold">8. HTTPS POST /api/v1/sync/batch (Multipart / Gzipped JSON + Images)</text>

  <!-- Central Cloud Ingestion -->
  <path d="M 1040 710 L 1265 710" stroke="#4ade80" stroke-width="2" marker-end="url(#mG13)"/>
  <text x="1070" y="702" fill="#4ade80" font-size="10" font-weight="bold">9. Upsert PostgreSQL (UUIDv4 Idempotent Deduplication)</text>

  <path d="M 1040 740 L 1265 740" stroke="#4ade80" stroke-width="2" marker-end="url(#mG13)"/>
  <text x="1070" y="732" fill="#4ade80" font-size="10" font-weight="bold">10. MinIO PutObject (Store JPEG Crop &amp; Return Cloud URL)</text>

  <path d="M 1040 785 L 820 785" stroke="#4ade80" stroke-width="2" marker-end="url(#mG13)"/>
  <text x="850" y="778" fill="#4ade80" font-size="10" font-weight="bold">11. HTTP 200 OK (Batch Acknowledged: {synced_ids: [...]})</text>

  <path d="M 820 815 L 380 815" stroke="#38bdf8" stroke-width="2" marker-end="url(#mB13)"/>
  <text x="500" y="808" fill="#38bdf8" font-size="10" font-weight="bold">12. UPDATE sync_queue SET status = 'SYNCED'</text>

  <path d="M 820 845 L 600 845" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#mB13)"/>
  <text x="640" y="838" fill="#94a3b8" font-size="10">13. Evict / Purge Uploaded Images as per Retention Quota</text>

</svg>
