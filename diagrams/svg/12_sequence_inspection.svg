<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
    <marker id="openArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#000000" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Academic Double Frame -->
  <rect x="15" y="15" width="1070" height="820" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1060" height="810" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="550" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 5.4: Sequence Diagram: Inspection &amp; Reliability Gating</text>
  <line x1="50" y1="62" x2="1050" y2="62" stroke="#cccccc" stroke-width="1"/>

  <!-- PARTICIPANTS (LIFELINE BOXES) -->
  <!-- 1. Operator -->
  <rect x="50" y="85" width="140" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="120" y="111" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Floor Operator</text>
  <line x1="120" y1="127" x2="120" y2="760" stroke="#000000" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 2. Sensors / Stand -->
  <rect x="250" y="85" width="160" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="330" y="111" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Camera &amp; Encoder</text>
  <line x1="330" y1="127" x2="330" y2="760" stroke="#000000" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 3. Edge Inspection Engine -->
  <rect x="470" y="85" width="170" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="555" y="111" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Edge Engine</text>
  <line x1="555" y1="127" x2="555" y2="760" stroke="#000000" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 4. Local SQLite Buffer -->
  <rect x="700" y="85" width="150" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="775" y="111" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Local Storage</text>
  <line x1="775" y1="127" x2="775" y2="760" stroke="#000000" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 5. Central Backend API -->
  <rect x="900" y="85" width="150" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="975" y="111" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Central Server</text>
  <line x1="975" y1="127" x2="975" y2="760" stroke="#000000" stroke-width="1" stroke-dasharray="4 4"/>


  <!-- ACTIVATION BARS -->
  <rect x="114" y="150" width="12" height="60" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="549" y="150" width="12" height="595" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="324" y="210" width="12" height="90" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="769" y="470" width="12" height="210" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="969" y="660" width="12" height="75" fill="#ffffff" stroke="#000000" stroke-width="1"/>


  <!-- MESSAGE 1: Start Roll Session (Floor Operator -> Edge Engine) -->
  <line x1="126" y1="160" x2="549" y2="160" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="135" y="142" width="180" height="16" fill="#ffffff"/>
  <text x="225" y="154" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">StartRollSession(roll_qr_code)</text>

  <!-- Response 1 -->
  <line x1="549" y1="195" x2="126" y2="195" stroke="#000000" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <rect x="165" y="177" width="120" height="16" fill="#ffffff"/>
  <text x="225" y="189" fill="#000000" font-size="10" text-anchor="middle">SessionInitialized</text>

  <!-- MESSAGE 2: Read Sensor Stream (Camera & Encoder -> Edge Engine) -->
  <line x1="336" y1="225" x2="549" y2="225" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="350" y="207" width="180" height="16" fill="#ffffff"/>
  <text x="440" y="219" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">CaptureFrame(frame_id, pulses)</text>

  <!-- Internal Call: Check Reliability -->
  <line x1="561" y1="250" x2="600" y2="250" stroke="#000000" stroke-width="1.2"/>
  <line x1="600" y1="250" x2="600" y2="275" stroke="#000000" stroke-width="1.2"/>
  <line x1="600" y1="275" x2="561" y2="275" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="605" y="267" fill="#000000" font-size="10">EvaluateReliability()</text>


  <!-- ALT FRAGMENT: Reliability Branching -->
  <rect x="70" y="300" width="970" height="330" fill="none" stroke="#000000" stroke-width="1.2"/>
  <rect x="70" y="300" width="50" height="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="95" y="315" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">alt</text>

  <!-- Condition 1: [Reliable == False] -->
  <text x="135" y="335" fill="#000000" font-size="10.5" font-weight="bold">[Reliable == False]</text>

  <!-- Trigger Alarm Relay -->
  <line x1="549" y1="355" x2="336" y2="355" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="337" width="160" height="16" fill="#ffffff"/>
  <text x="440" y="349" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">TriggerStackLight(Warning)</text>

  <!-- Mark Uninspected Section -->
  <line x1="561" y1="385" x2="769" y2="385" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="575" y="367" width="180" height="16" fill="#ffffff"/>
  <text x="665" y="379" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">RecordUninspectedSpan(start, end)</text>


  <!-- Divider line -->
  <line x1="70" y1="415" x2="1040" y2="415" stroke="#000000" stroke-width="1" stroke-dasharray="6 3"/>

  <!-- Condition 2: [Reliable == True] -->
  <text x="135" y="435" fill="#000000" font-size="10.5" font-weight="bold">[Reliable == True]</text>

  <!-- Detect Defects -->
  <line x1="561" y1="455" x2="630" y2="455" stroke="#000000" stroke-width="1.2"/>
  <line x1="630" y1="455" x2="630" y2="480" stroke="#000000" stroke-width="1.2"/>
  <line x1="630" y1="480" x2="561" y2="480" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="635" y="472" fill="#000000" font-size="10">RunInference(YOLO)</text>

  <!-- Track & Deduplicate -->
  <line x1="561" y1="500" x2="630" y2="500" stroke="#000000" stroke-width="1.2"/>
  <line x1="630" y1="500" x2="630" y2="525" stroke="#000000" stroke-width="1.2"/>
  <line x1="630" y1="525" x2="561" y2="525" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="635" y="517" fill="#000000" font-size="10">TrackAndDeduplicate()</text>

  <!-- Save Defect Record -->
  <line x1="561" y1="555" x2="769" y2="555" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="580" y="537" width="170" height="16" fill="#ffffff"/>
  <text x="665" y="549" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">InsertDefectRecord(defect_id, X, Y)</text>

  <!-- Push Mobile Alert -->
  <line x1="549" y1="595" x2="126" y2="595" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="135" y="577" width="180" height="16" fill="#ffffff"/>
  <text x="225" y="589" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">PushVibrationAlert(flaw, Y_m)</text>


  <!-- Post-Inspection: Sync to Central -->
  <line x1="561" y1="675" x2="969" y2="675" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="575" y="657" width="180" height="16" fill="#ffffff"/>
  <text x="665" y="669" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">SynchronizeBatch(roll_id, records)</text>

  <line x1="969" y1="705" x2="561" y2="705" stroke="#000000" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <rect x="590" y="687" width="150" height="16" fill="#ffffff"/>
  <text x="665" y="699" fill="#000000" font-size="10" text-anchor="middle">HTTP_200_OK(synced_ids)</text>

  <line x1="561" y1="730" x2="769" y2="730" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="600" y="712" width="130" height="16" fill="#ffffff"/>
  <text x="665" y="724" fill="#000000" font-size="10" text-anchor="middle">MarkOutboxSynced()</text>

</svg>