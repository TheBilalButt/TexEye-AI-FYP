<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1200" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="hdr12" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <filter id="sh12" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/></filter>
    <marker id="mB12" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="mG12" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4ade80"/></marker>
    <marker id="mR12" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f87171"/></marker>
    <marker id="mP12" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c084fc"/></marker>
  </defs>

  <!-- Title -->
  <g transform="translate(100, 30)" filter="url(#sh12)">
    <rect width="1250" height="70" rx="12" fill="url(#hdr12)" stroke="#334155" stroke-width="1.5"/>
    <text x="625" y="32" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">TexEye AI &mdash; Sequence Diagram: Fabric Inspection &amp; Reliability Gating Flow</text>
    <text x="625" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">End-to-End Real-Time Ingestion &bull; Quality Verification &bull; Uninspected Span Isolation</text>
  </g>

  <!-- Lifeline Headers -->
  <!-- 1. Operator -->
  <g transform="translate(60, 120)">
    <rect width="140" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="27" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Floor Operator</text>
    <text x="70" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">Mobile Client</text>
    <line x1="70" y1="50" x2="70" y2="980" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 2. Stand & Encoder -->
  <g transform="translate(250, 120)">
    <rect width="150" height="50" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="75" y="27" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Fabric Line &amp; Enc</text>
    <text x="75" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">Measurement Roller</text>
    <line x1="75" y1="50" x2="75" y2="980" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 3. Industrial Camera -->
  <g transform="translate(450, 120)">
    <rect width="140" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="27" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Industrial Camera</text>
    <text x="70" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">Overhead Mount</text>
    <line x1="70" y1="50" x2="70" y2="980" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 4. Reliability Gate -->
  <g transform="translate(640, 120)">
    <rect width="160" height="50" rx="8" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="27" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Reliability Gate</text>
    <text x="80" y="42" fill="#93c5fd" font-size="10" text-anchor="middle">Edge Health Monitor</text>
    <line x1="80" y1="50" x2="80" y2="980" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 5. AI Vision Engine -->
  <g transform="translate(850, 120)">
    <rect width="150" height="50" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="75" y="27" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">AI Vision Engine</text>
    <text x="75" y="42" fill="#e9d5ff" font-size="10" text-anchor="middle">YOLO &bull; Tracker &bull; Calib</text>
    <line x1="75" y1="50" x2="75" y2="980" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 6. Local SQLite DB -->
  <g transform="translate(1050, 120)">
    <rect width="150" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="75" y="27" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Edge SQLite DB</text>
    <text x="75" y="42" fill="#fde68a" font-size="10" text-anchor="middle">Local Storage &amp; Queue</text>
    <line x1="75" y1="50" x2="75" y2="980" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 7. Central Backend -->
  <g transform="translate(1250, 120)">
    <rect width="140" height="50" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="70" y="27" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">Central Backend</text>
    <text x="70" y="42" fill="#86efac" font-size="10" text-anchor="middle">FastAPI &amp; Web Portal</text>
    <line x1="70" y1="50" x2="70" y2="980" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Step 1: Scan QR -->
  <path d="M 130 210 L 1125 210" stroke="#38bdf8" stroke-width="2" marker-end="url(#mB12)"/>
  <text x="450" y="202" fill="#38bdf8" font-size="11" font-weight="bold">1. Scan Roll QR Code &amp; Start Session</text>

  <path d="M 1125 235 L 130 235" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#mB12)"/>
  <text x="450" y="230" fill="#94a3b8" font-size="10">2. Session Confirmed (Roll ID, Fabric Type)</text>

  <!-- Step 2: Ingestion -->
  <path d="M 325 270 L 720 270" stroke="#fbbf24" stroke-width="2" marker-end="url(#mB12)"/>
  <text x="440" y="262" fill="#fbbf24" font-size="11" font-weight="bold">3. Fabric moves: Quadrature pulse stream (&Delta;L)</text>

  <path d="M 520 295 L 720 295" stroke="#38bdf8" stroke-width="2" marker-end="url(#mB12)"/>
  <text x="540" y="288" fill="#38bdf8" font-size="11" font-weight="bold">4. Continuous Video Frame Ingestion</text>

  <!-- ALT BOX: Reliability Gate -->
  <g transform="translate(90, 325)">
    <rect width="1280" height="580" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="25" y="25" fill="#f8fafc" font-size="12" font-weight="bold">[alt: Inspection Reliability Validation]</text>

    <!-- Branch 1: Reliable -->
    <rect x="15" y="35" width="1250" height="25" fill="#14532d" opacity="0.4"/>
    <text x="30" y="52" fill="#4ade80" font-size="11" font-weight="bold">[RELIABLE: Camera Connected &amp; Uniform Light &amp; Sharp Focus &amp; Zero Dropped Frames]</text>

    <!-- Branch 2 Divider -->
    <line x1="15" y1="320" x2="1265" y2="320" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 3"/>

    <!-- Branch 2: Unreliable -->
    <rect x="15" y="325" width="1250" height="25" fill="#7f1d1d" opacity="0.4"/>
    <text x="30" y="342" fill="#fca5a5" font-size="11" font-weight="bold">[UNRELIABLE: Camera Disconnected OR Light Anomaly OR Blur Occurred OR Dropped Frames Detected]</text>
  </g>

  <!-- Messages inside Branch 1 -->
  <path d="M 720 405 L 925 405" stroke="#4ade80" stroke-width="2" marker-end="url(#mG12)"/>
  <text x="750" y="398" fill="#4ade80" font-size="11" font-weight="bold">5. Forward Clean Frame + Current Encoder Tick</text>

  <!-- Self call AI -->
  <rect x="915" y="425" width="20" height="50" fill="#c084fc"/>
  <path d="M 935 435 L 970 435 L 970 465 L 935 465" stroke="#c084fc" stroke-width="1.5"/>
  <text x="980" y="445" fill="#c084fc" font-size="10">6. YOLO Detection &bull; Multi-frame Kalman Track</text>
  <text x="980" y="460" fill="#c084fc" font-size="10">Spatial-Temporal Deduplication &bull; Metric (X, Y)</text>

  <path d="M 925 495 L 1125 495" stroke="#fbbf24" stroke-width="2" marker-end="url(#mB12)"/>
  <text x="960" y="488" fill="#fbbf24" font-size="11" font-weight="bold">7. INSERT Defect Record (Track_ID, Class, X, Y, Img)</text>

  <path d="M 925 540 L 130 540" stroke="#38bdf8" stroke-width="2" marker-end="url(#mB12)"/>
  <text x="400" y="532" fill="#38bdf8" font-size="11" font-weight="bold">8. Push Real-Time Mobile Vibration &amp; Defect Alert</text>

  <path d="M 925 575 L 1320 575" stroke="#4ade80" stroke-width="2" marker-end="url(#mG12)"/>
  <text x="1000" y="568" fill="#4ade80" font-size="11" font-weight="bold">9. Stream Live Coordinate to Web Defect Map (WSS)</text>

  <!-- Messages inside Branch 2 -->
  <path d="M 720 700 L 1125 700" stroke="#ef4444" stroke-width="2.5" marker-end="url(#mR12)"/>
  <text x="760" y="692" fill="#ef4444" font-size="12" font-weight="bold">10. Compute Span [L_start = Y, L_end = Y + &Delta;L]; Flag as UNINSPECTED</text>

  <path d="M 720 740 L 130 740" stroke="#ef4444" stroke-width="2.5" marker-end="url(#mR12)"/>
  <text x="350" y="732" fill="#ef4444" font-size="12" font-weight="bold">11. Trigger Local Tower Light &amp; Sound 'Inspection Compromised' Warning</text>

  <path d="M 720 780 L 1320 780" stroke="#f87171" stroke-width="2" marker-end="url(#mR12)"/>
  <text x="800" y="772" fill="#f87171" font-size="11" font-weight="bold">12. Broadcast Anomaly Event (Render Yellow Hashed 'Uninspected' Zone on Map)</text>

  <!-- Critical Rule Box -->
  <g transform="translate(500, 815)">
    <rect width="480" height="40" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="240" y="24" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="middle">CRITICAL RULE: Uninspected section is NEVER classified as defect-free!</text>
  </g>

  <!-- Post-Inspection Inspector Correction -->
  <g transform="translate(100, 930)">
    <rect width="1240" height="50" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="620" y="30" fill="#f3e8ff" font-size="12" font-weight="bold" text-anchor="middle">Quality Inspector Review &amp; Correction: Updates Defect Class / BBox &rarr; Re-syncs Certified 4-Point Grade</text>
  </g>

</svg>
