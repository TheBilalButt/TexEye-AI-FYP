<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
    <marker id="openArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#000000" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Academic Double Frame -->
  <rect x="15" y="15" width="1070" height="820" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1060" height="810" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="550" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 5.5: Sequence Diagram: Real-Time Inspection &amp; Reliability Gating</text>
  <line x1="50" y1="62" x2="1050" y2="62" stroke="#cccccc" stroke-width="1"/>

  <!-- PARTICIPANTS (LIFELINE BOXES IN OPTIMAL INTERACTION ORDER) -->
  <!-- 1. Operator -->
  <rect x="50" y="85" width="150" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="125" y="111" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Floor Operator</text>
  <line x1="125" y1="127" x2="125" y2="780" stroke="#000000" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 2. Edge Inspection Engine -->
  <rect x="270" y="85" width="170" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="355" y="111" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Edge Engine</text>
  <line x1="355" y1="127" x2="355" y2="780" stroke="#000000" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 3. Sensors & Hardware Stand -->
  <rect x="505" y="85" width="170" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="590" y="111" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Camera &amp; Encoder</text>
  <line x1="590" y1="127" x2="590" y2="780" stroke="#000000" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 4. Local SQLite Buffer -->
  <rect x="740" y="85" width="150" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="815" y="111" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Local SQLite WAL</text>
  <line x1="815" y1="127" x2="815" y2="780" stroke="#000000" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 5. Central Cloud Server -->
  <rect x="940" y="85" width="130" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1005" y="111" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Central FastAPI</text>
  <line x1="1005" y1="127" x2="1005" y2="780" stroke="#000000" stroke-width="1" stroke-dasharray="4 4"/>


  <!-- ACTIVATION BARS -->
  <rect x="119" y="145" width="12" height="65" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="349" y="145" width="12" height="615" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="584" y="215" width="12" height="75" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="584" y="340" width="12" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="809" y="375" width="12" height="50" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="809" y="540" width="12" height="50" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="809" y="660" width="12" height="100" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="999" y="675" width="12" height="50" fill="#ffffff" stroke="#000000" stroke-width="1"/>


  <!-- MESSAGE 1: Start Roll Session (Direct: Floor Operator -> Edge Engine) -->
  <line x1="131" y1="160" x2="349" y2="160" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="145" y="142" width="190" height="16" fill="#ffffff"/>
  <text x="240" y="154" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">StartRollSession(roll_qr_code)</text>

  <!-- Response 1 (Direct: Edge Engine -> Floor Operator) -->
  <line x1="349" y1="195" x2="131" y2="195" stroke="#000000" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <rect x="180" y="177" width="120" height="16" fill="#ffffff"/>
  <text x="240" y="189" fill="#000000" font-size="10" text-anchor="middle">SessionInitialized</text>

  <!-- MESSAGE 2: Read Sensor Stream (Direct: Camera & Encoder -> Edge Engine) -->
  <line x1="584" y1="230" x2="361" y2="230" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="375" y="212" width="195" height="16" fill="#ffffff"/>
  <text x="472" y="224" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">CaptureFrame(frame_id, pulses)</text>

  <!-- Internal Call: Check Reliability (Edge Engine) -->
  <line x1="361" y1="255" x2="410" y2="255" stroke="#000000" stroke-width="1.2"/>
  <line x1="410" y1="255" x2="410" y2="280" stroke="#000000" stroke-width="1.2"/>
  <line x1="410" y1="280" x2="361" y2="280" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="418" y="272" fill="#000000" font-size="10">EvaluateReliability()</text>


  <!-- ALT FRAGMENT: Reliability Branching -->
  <rect x="60" y="305" width="980" height="320" fill="none" stroke="#000000" stroke-width="1.2"/>
  <rect x="60" y="305" width="50" height="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="85" y="320" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">alt</text>

  <!-- Condition 1: [Reliable == False] -->
  <text x="125" y="335" fill="#000000" font-size="10.5" font-weight="bold">[Reliable == False]</text>

  <!-- Trigger Alarm Relay (Direct: Edge Engine -> Stand Stack Light) -->
  <line x1="361" y1="355" x2="584" y2="355" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="380" y="337" width="185" height="16" fill="#ffffff"/>
  <text x="472" y="349" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">TriggerStackLight(Warning)</text>

  <!-- Mark Uninspected Section in Local DB (Masked across sensors lifeline) -->
  <line x1="361" y1="390" x2="809" y2="390" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="605" y="372" width="190" height="16" fill="#ffffff"/>
  <text x="700" y="384" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">RecordUninspectedSpan(start, end)</text>


  <!-- Divider line -->
  <line x1="60" y1="420" x2="1040" y2="420" stroke="#000000" stroke-width="1" stroke-dasharray="6 3"/>

  <!-- Condition 2: [Reliable == True] -->
  <text x="125" y="440" fill="#000000" font-size="10.5" font-weight="bold">[Reliable == True]</text>

  <!-- Internal Call: Run YOLO Inference -->
  <line x1="361" y1="460" x2="410" y2="460" stroke="#000000" stroke-width="1.2"/>
  <line x1="410" y1="460" x2="410" y2="485" stroke="#000000" stroke-width="1.2"/>
  <line x1="410" y1="485" x2="361" y2="485" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="418" y="477" fill="#000000" font-size="10">InferenceYOLO()</text>

  <!-- Internal Call: Kalman Filter Tracking -->
  <line x1="361" y1="500" x2="410" y2="500" stroke="#000000" stroke-width="1.2"/>
  <line x1="410" y1="500" x2="410" y2="525" stroke="#000000" stroke-width="1.2"/>
  <line x1="410" y1="525" x2="361" y2="525" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="418" y="517" fill="#000000" font-size="10">TrackAndDeduplicate()</text>

  <!-- Save Defect Record to Local SQLite Outbox -->
  <line x1="361" y1="555" x2="809" y2="555" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="605" y="537" width="190" height="16" fill="#ffffff"/>
  <text x="700" y="549" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">InsertDefectRecord(defect_id, X, Y)</text>

  <!-- Push Mobile Alert (Direct: Edge Engine -> Floor Operator) -->
  <line x1="349" y1="595" x2="131" y2="595" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="145" y="577" width="190" height="16" fill="#ffffff"/>
  <text x="240" y="589" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">PushVibrationAlert(flaw, Y_m)</text>


  <!-- Post-Inspection: Sync from Local Outbox to Central Server (Direct Adjacent Lifelines: 815 -> 1005) -->
  <line x1="821" y1="680" x2="999" y2="680" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="830" y="662" width="160" height="16" fill="#ffffff"/>
  <text x="910" y="674" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">SynchronizeBatch(roll_id)</text>

  <line x1="999" y1="710" x2="821" y2="710" stroke="#000000" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <rect x="840" y="692" width="140" height="16" fill="#ffffff"/>
  <text x="910" y="704" fill="#000000" font-size="10" text-anchor="middle">HTTP_200_OK(synced_ids)</text>

  <!-- Internal Call: Mark Outbox Synced -->
  <line x1="821" y1="735" x2="865" y2="735" stroke="#000000" stroke-width="1.2"/>
  <line x1="865" y1="735" x2="865" y2="755" stroke="#000000" stroke-width="1.2"/>
  <line x1="865" y1="755" x2="821" y2="755" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="872" y="749" fill="#000000" font-size="10">MarkOutboxSynced()</text>

</svg>
