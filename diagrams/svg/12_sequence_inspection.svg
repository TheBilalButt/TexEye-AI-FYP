<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1450 1010" style="background-color:#0b1120;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="hdr12" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><filter id="sh12" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".5" stdDeviation="6"/></filter><marker id="mB12" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#38bdf8" d="M0,0 L0,6 L9,3 z"/></marker><marker id="mG12" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#4ade80" d="M0,0 L0,6 L9,3 z"/></marker><marker id="mR12" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#f87171" d="M0,0 L0,6 L9,3 z"/></marker><marker id="mP12" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#c084fc" d="M0,0 L0,6 L9,3 z"/></marker></defs><g filter="url(#sh12)" transform="translate(100, 30)"><rect width="1250" height="70" fill="url(#hdr12)" stroke="#334155" stroke-width="1.5" rx="12"/><text x="625" y="32" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">TexEye AI — Sequence Diagram: Fabric Inspection &amp; Reliability Gating Flow</text><text x="625" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">End-to-End Real-Time Ingestion • Quality Verification • Uninspected Span Isolation</text></g><g transform="translate(60, 120)"><rect width="140" height="50" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8"/><text x="70" y="27" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Floor Operator</text><text x="70" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">Mobile Client</text><line x1="70" x2="70" y1="50" y2="980" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/></g><g transform="translate(250, 120)"><rect width="150" height="50" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" rx="8"/><text x="75" y="27" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Fabric Line &amp; Enc</text><text x="75" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">Measurement Roller</text><line x1="75" x2="75" y1="50" y2="980" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/></g><g transform="translate(450, 120)"><rect width="140" height="50" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8"/><text x="70" y="27" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Industrial Camera</text><text x="70" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">Overhead Mount</text><line x1="70" x2="70" y1="50" y2="980" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/></g><g transform="translate(640, 120)"><rect width="160" height="50" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2" rx="8"/><text x="80" y="27" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Reliability Gate</text><text x="80" y="42" fill="#93c5fd" font-size="10" text-anchor="middle">Edge Health Monitor</text><line x1="80" x2="80" y1="50" y2="980" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/></g><g transform="translate(850, 120)"><rect width="150" height="50" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" rx="8"/><text x="75" y="27" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">AI Vision Engine</text><text x="75" y="42" fill="#e9d5ff" font-size="10" text-anchor="middle">YOLO • Tracker • Calib</text><line x1="75" x2="75" y1="50" y2="980" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/></g><g transform="translate(1050, 120)"><rect width="150" height="50" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" rx="8"/><text x="75" y="27" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Edge SQLite DB</text><text x="75" y="42" fill="#fde68a" font-size="10" text-anchor="middle">Local Storage &amp; Queue</text><line x1="75" x2="75" y1="50" y2="980" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/></g><g transform="translate(1250, 120)"><rect width="140" height="50" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" rx="8"/><text x="70" y="27" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">Central Backend</text><text x="70" y="42" fill="#86efac" font-size="10" text-anchor="middle">FastAPI &amp; Web Portal</text><line x1="70" x2="70" y1="50" y2="980" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/></g><path stroke="#38bdf8" stroke-width="2" marker-end="url(#mB12)" d="M 130 210 L 1125 210"/><text x="450" y="202" fill="#38bdf8" font-size="11" font-weight="bold">1. Scan Roll QR Code &amp; Start Session</text><path stroke="#94a3b8" stroke-dasharray="4 2" stroke-width="1.5" marker-end="url(#mB12)" d="M 1125 235 L 130 235"/><text x="450" y="230" fill="#94a3b8" font-size="10">2. Session Confirmed (Roll ID, Fabric Type)</text><path stroke="#fbbf24" stroke-width="2" marker-end="url(#mB12)" d="M 325 270 L 720 270"/><text x="440" y="262" fill="#fbbf24" font-size="11" font-weight="bold">3. Fabric moves: Quadrature pulse stream (ΔL)</text><path stroke="#38bdf8" stroke-width="2" marker-end="url(#mB12)" d="M 520 295 L 720 295"/><text x="540" y="288" fill="#38bdf8" font-size="11" font-weight="bold">4. Continuous Video Frame Ingestion</text><g transform="translate(90, 325)"><rect width="1280" height="580" fill="#0f172a" stroke="#64748b" stroke-dasharray="4 2" stroke-width="1.5" rx="10"/><text x="25" y="25" fill="#f8fafc" font-size="12" font-weight="bold">[alt: Inspection Reliability Validation]</text><rect width="1250" height="25" x="15" y="35" fill="#14532d" opacity=".4"/><text x="30" y="52" fill="#4ade80" font-size="11" font-weight="bold">[RELIABLE: Camera Connected &amp; Uniform Light &amp; Sharp Focus &amp; Zero Dropped Frames]</text><line x1="15" x2="1265" y1="320" y2="320" stroke="#ef4444" stroke-dasharray="6 3" stroke-width="1.5"/><rect width="1250" height="25" x="15" y="325" fill="#7f1d1d" opacity=".4"/><text x="30" y="342" fill="#fca5a5" font-size="11" font-weight="bold">[UNRELIABLE: Camera Disconnected OR Light Anomaly OR Blur Occurred OR Dropped Frames Detected]</text></g><path stroke="#4ade80" stroke-width="2" marker-end="url(#mG12)" d="M 720 405 L 925 405"/><text x="750" y="398" fill="#4ade80" font-size="11" font-weight="bold">5. Forward Clean Frame + Current Encoder Tick</text><rect width="20" height="50" x="915" y="425" fill="#c084fc"/><path stroke="#c084fc" stroke-width="1.5" d="M 935 435 L 970 435 L 970 465 L 935 465"/><text x="980" y="445" fill="#c084fc" font-size="10">6. YOLO Detection • Multi-frame Kalman Track</text><text x="980" y="460" fill="#c084fc" font-size="10">Spatial-Temporal Deduplication • Metric (X, Y)</text><path stroke="#fbbf24" stroke-width="2" marker-end="url(#mB12)" d="M 925 495 L 1125 495"/><text x="960" y="488" fill="#fbbf24" font-size="11" font-weight="bold">7. INSERT Defect Record (Track_ID, Class, X, Y, Img)</text><path stroke="#38bdf8" stroke-width="2" marker-end="url(#mB12)" d="M 925 540 L 130 540"/><text x="400" y="532" fill="#38bdf8" font-size="11" font-weight="bold">8. Push Real-Time Mobile Vibration &amp; Defect Alert</text><path stroke="#4ade80" stroke-width="2" marker-end="url(#mG12)" d="M 925 575 L 1320 575"/><text x="1000" y="568" fill="#4ade80" font-size="11" font-weight="bold">9. Stream Live Coordinate to Web Defect Map (WSS)</text><path stroke="#ef4444" stroke-width="2.5" marker-end="url(#mR12)" d="M 720 700 L 1125 700"/><text x="760" y="692" fill="#ef4444" font-size="12" font-weight="bold">10. Compute Span [L_start = Y, L_end = Y + ΔL]; Flag as UNINSPECTED</text><path stroke="#ef4444" stroke-width="2.5" marker-end="url(#mR12)" d="M 720 740 L 130 740"/><text x="350" y="732" fill="#ef4444" font-size="12" font-weight="bold">11. Trigger Local Tower Light &amp; Sound &apos;Inspection Compromised&apos; Warning</text><path stroke="#f87171" stroke-width="2" marker-end="url(#mR12)" d="M 720 780 L 1320 780"/><text x="800" y="772" fill="#f87171" font-size="11" font-weight="bold">12. Broadcast Anomaly Event (Render Yellow Hashed &apos;Uninspected&apos; Zone on Map)</text><g transform="translate(500, 815)"><rect width="480" height="40" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" rx="6"/><text x="240" y="24" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="middle">CRITICAL RULE: Uninspected section is NEVER classified as defect-free!</text></g><g transform="translate(100, 930)"><rect width="1240" height="50" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" rx="8"/><text x="620" y="30" fill="#f3e8ff" font-size="12" font-weight="bold" text-anchor="middle">Quality Inspector Review &amp; Correction: Updates Defect Class / BBox → Re-syncs Certified 4-Point Grade</text></g></svg>