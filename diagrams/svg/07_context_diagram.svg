<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
  </defs>

  <!-- Academic Double Frame (ReDez SRDS Standard) -->
  <rect x="15" y="15" width="1070" height="820" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1060" height="810" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="550" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 4.2: System Context Diagram (Level 0 DFD Overview)</text>
  <line x1="50" y1="62" x2="1050" y2="62" stroke="#cccccc" stroke-width="1"/>

  <!-- Central System Circle -->
  <circle cx="550" cy="450" r="105" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="550" y="435" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">TexEye AI</text>
  <text x="550" y="455" fill="#000000" font-size="12" text-anchor="middle">Fabric Defect Detection</text>
  <text x="550" y="472" fill="#000000" font-size="12" text-anchor="middle">&amp; Quality Management</text>

  <!-- External Entity 1: Camera & Sensor Rig (Top Left) -->
  <rect x="50" y="105" width="220" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="160" y="145" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Camera &amp; Sensors</text>

  <!-- External Entity 2: Floor Operator (Bottom Left) -->
  <rect x="50" y="665" width="220" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="160" y="705" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Floor Operator</text>

  <!-- External Entity 3: Quality Inspector (Top Right) -->
  <rect x="830" y="105" width="220" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="940" y="145" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Quality Inspector</text>

  <!-- External Entity 4: Production Manager (Middle Right) -->
  <rect x="830" y="415" width="220" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="940" y="455" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Production Manager</text>

  <!-- External Entity 5: Inventory Manager (Bottom Right) -->
  <rect x="830" y="665" width="220" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="940" y="705" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Inventory Manager</text>


  <!-- ==================== ZERO-OVERLAP ORTHOGONAL FLOWS ==================== -->

  <!-- Flow 1: Camera to System (Top Left) -->
  <path d="M 270 125 L 520 125 L 520 349" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="395" y="116" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">Camera Stream &amp; Speed Pulses</text>

  <!-- Flow 2: System to Stack Light Relay (Top Left) -->
  <path d="M 480 372 L 480 160 L 270 160" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
  <text x="375" y="151" fill="#000000" font-size="9.5" text-anchor="middle">Relay Warning Signal</text>


  <!-- Flow 3: System to Quality Inspector (Top Right) -->
  <path d="M 580 349 L 580 125 L 830 125" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="705" y="116" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">Defect Roll Map &amp; ASTM Grade</text>

  <!-- Flow 4: Quality Inspector to System (Top Right) -->
  <path d="M 830 160 L 620 160 L 620 372" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="725" y="151" fill="#000000" font-size="9.5" text-anchor="middle">Classification Corrections</text>


  <!-- Flow 5: System to Production Manager (Direct Horizontal Link - Middle Right) -->
  <line x1="655" y1="450" x2="830" y2="450" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="742" y="441" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">Production Reports &amp; Defect Logs</text>


  <!-- Flow 6: Floor Operator to System (Bottom Left) -->
  <path d="M 270 685 L 480 685 L 480 528" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="375" y="676" fill="#000000" font-size="9.5" font-weight="bold" text-anchor="middle">Scanned Roll ID &amp; Confirmations</text>

  <!-- Flow 7: System to Floor Operator (Bottom Left) -->
  <path d="M 520 551 L 520 720 L 270 720" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="395" y="711" fill="#000000" font-size="9.5" text-anchor="middle">Audio &amp; Vibration Defect Alerts</text>


  <!-- Flow 8: System to Inventory Manager (Bottom Right) -->
  <path d="M 620 528 L 620 685 L 830 685" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="725" y="676" fill="#000000" font-size="9.5" font-weight="bold" text-anchor="middle">Certified Roll Grade &amp; Length</text>

  <!-- Flow 9: Inventory Manager to System (Bottom Right) -->
  <path d="M 830 720 L 580 720 L 580 551" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="705" y="711" fill="#000000" font-size="9.5" text-anchor="middle">Warehouse Bay &amp; Storage Updates</text>

</svg>