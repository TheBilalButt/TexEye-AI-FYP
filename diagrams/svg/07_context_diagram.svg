<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1100" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="hdr7" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="sysCircle" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <filter id="sh7" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/></filter>
    <marker id="mB7" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="mG7" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4ade80"/></marker>
    <marker id="mR7" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f87171"/></marker>
    <marker id="mY7" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker>
  </defs>

  <!-- Title -->
  <g transform="translate(100, 30)" filter="url(#sh7)">
    <rect width="1250" height="70" rx="12" fill="url(#hdr7)" stroke="#334155" stroke-width="1.5"/>
    <text x="625" y="32" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">TexEye AI &mdash; System Context Diagram (Level 0 Overview)</text>
    <text x="625" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">External Entities, Hardware Signal Ingestion, User Touchpoints &amp; Enterprise Cloud Boundaries</text>
  </g>

  <!-- Central System Circle -->
  <g transform="translate(565, 390)" filter="url(#sh7)">
    <circle cx="160" cy="160" r="160" fill="url(#sysCircle)" stroke="#38bdf8" stroke-width="3"/>
    <text x="160" y="130" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">TexEye AI</text>
    <text x="160" y="155" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Core System Boundary</text>
    <text x="160" y="180" fill="#94a3b8" font-size="11" text-anchor="middle">Fabric Defect Detection &amp;</text>
    <text x="160" y="196" fill="#94a3b8" font-size="11" text-anchor="middle">Quality Management System</text>
    <circle cx="160" cy="160" r="145" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="4 2"/>
  </g>

  <!-- LEFT: Hardware Sensors -->
  <!-- Industrial Camera -->
  <g transform="translate(60, 180)" filter="url(#sh7)">
    <rect width="280" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="140" y="32" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Industrial Camera</text>
    <text x="140" y="52" fill="#94a3b8" font-size="11" text-anchor="middle">Raw Image Frame Stream</text>
  </g>
  <path d="M 340 215 L 590 440" stroke="#38bdf8" stroke-width="2" marker-end="url(#mB7)"/>
  <text x="410" y="300" fill="#38bdf8" font-size="10" font-weight="bold">Video Stream</text>

  <!-- Rotary Encoder -->
  <g transform="translate(60, 320)" filter="url(#sh7)">
    <rect width="280" height="70" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="140" y="32" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">Rotary Encoder</text>
    <text x="140" y="52" fill="#94a3b8" font-size="11" text-anchor="middle">Quadrature Pulse Stream</text>
  </g>
  <path d="M 340 355 L 565 490" stroke="#fbbf24" stroke-width="2" marker-end="url(#mY7)"/>
  <text x="400" y="420" fill="#fbbf24" font-size="10" font-weight="bold">Displacement Pulses</text>

  <!-- Lighting System -->
  <g transform="translate(60, 460)" filter="url(#sh7)">
    <rect width="280" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="140" y="32" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">LED Lighting System</text>
    <text x="140" y="52" fill="#94a3b8" font-size="11" text-anchor="middle">Controlled Illumination Zone</text>
  </g>
  <path d="M 565 550 L 340 495" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="390" y="540" fill="#94a3b8" font-size="10">Strobe / Lux Monitor</text>

  <!-- Stack Light Beacon -->
  <g transform="translate(60, 600)" filter="url(#sh7)">
    <rect width="280" height="70" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <text x="140" y="32" fill="#fca5a5" font-size="13" font-weight="bold" text-anchor="middle">Local Stack Light Beacon</text>
    <text x="140" y="52" fill="#fecaca" font-size="11" text-anchor="middle">Opto-Isolated Relay Alarm</text>
  </g>
  <path d="M 590 640 L 340 640" stroke="#f87171" stroke-width="2" marker-end="url(#mR7)"/>
  <text x="400" y="630" fill="#f87171" font-size="10" font-weight="bold">Warning / Relay Trip</text>

  <!-- RIGHT: Human Actors & User Touchpoints -->
  <!-- Floor Operator -->
  <g transform="translate(1110, 160)" filter="url(#sh7)">
    <rect width="280" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="140" y="30" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Floor Operator</text>
    <text x="140" y="50" fill="#94a3b8" font-size="11" text-anchor="middle">Mobile Client (QR &amp; Alerts)</text>
  </g>
  <path d="M 860 450 L 1110 215" stroke="#38bdf8" stroke-width="2" marker-end="url(#mB7)"/>
  <text x="960" y="310" fill="#38bdf8" font-size="10" font-weight="bold">QR Scan &bull; Real-time Push</text>

  <!-- Quality Inspector -->
  <g transform="translate(1110, 290)" filter="url(#sh7)">
    <rect width="280" height="75" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="140" y="30" fill="#c084fc" font-size="13" font-weight="bold" text-anchor="middle">Quality Inspector</text>
    <text x="140" y="50" fill="#94a3b8" font-size="11" text-anchor="middle">Web / Mobile Defect Map Review</text>
  </g>
  <path d="M 885 500 L 1110 330" stroke="#c084fc" stroke-width="2" marker-end="url(#mB7)"/>
  <text x="960" y="420" fill="#c084fc" font-size="10" font-weight="bold">Review &bull; Correct &bull; Grade</text>

  <!-- Production Manager -->
  <g transform="translate(1110, 430)" filter="url(#sh7)">
    <rect width="280" height="70" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="140" y="30" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle">Production Manager</text>
    <text x="140" y="50" fill="#94a3b8" font-size="11" text-anchor="middle">Executive Web Dashboard</text>
  </g>
  <path d="M 885 550 L 1110 465" stroke="#4ade80" stroke-width="2" marker-end="url(#mG7)"/>
  <text x="970" y="520" fill="#4ade80" font-size="10" font-weight="bold">Quality Reports &amp; Stats</text>

  <!-- Inventory Manager -->
  <g transform="translate(1110, 560)" filter="url(#sh7)">
    <rect width="280" height="70" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="140" y="30" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">Inventory Manager</text>
    <text x="140" y="50" fill="#94a3b8" font-size="11" text-anchor="middle">Stock &amp; Scrap Segregation</text>
  </g>
  <path d="M 860 620 L 1110 595" stroke="#fbbf24" stroke-width="2" marker-end="url(#mY7)"/>
  <text x="960" y="625" fill="#fbbf24" font-size="10" font-weight="bold">Grade Status &bull; Scrap Bay</text>

  <!-- System Administrator -->
  <g transform="translate(1110, 690)" filter="url(#sh7)">
    <rect width="280" height="70" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
    <text x="140" y="30" fill="#f87171" font-size="13" font-weight="bold" text-anchor="middle">System Administrator</text>
    <text x="140" y="50" fill="#94a3b8" font-size="11" text-anchor="middle">User RBAC &amp; Calibration Config</text>
  </g>
  <path d="M 800 680 L 1110 725" stroke="#f87171" stroke-width="2" marker-end="url(#mR7)"/>
  <text x="930" y="720" fill="#f87171" font-size="10" font-weight="bold">User Roles &bull; Audit Logs</text>

  <!-- BOTTOM: Enterprise Cloud -->
  <g transform="translate(525, 840)" filter="url(#sh7)">
    <rect width="400" height="90" rx="12" fill="#0f172a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="200" y="32" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle">Central Enterprise Cloud Backend</text>
    <text x="200" y="54" fill="#ffffff" font-size="11" text-anchor="middle">PostgreSQL Database &bull; MinIO/S3 Image Storage</text>
    <text x="200" y="74" fill="#86efac" font-size="10" text-anchor="middle">Two-Way HTTPS TLS 1.3 Batch Synchronization &bull; Idempotent Ingestion</text>
  </g>
  <path d="M 725 710 L 725 840" stroke="#4ade80" stroke-width="3" marker-end="url(#mG7)"/>
  <text x="735" y="775" fill="#4ade80" font-size="11" font-weight="bold">Idempotent Batch Sync</text>

</svg>
