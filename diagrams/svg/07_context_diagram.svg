<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
  </defs>

  <!-- Academic Double Frame (ReDez SRDS Standard) -->
  <rect x="15" y="15" width="1070" height="820" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1060" height="810" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="550" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 4.2: System Context Diagram (Level 0 DFD Overview)</text>
  <line x1="50" y1="62" x2="1050" y2="62" stroke="#cccccc" stroke-width="1"/>

  <!-- Central System Circle -->
  <circle cx="550" cy="450" r="135" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="550" y="432" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">TexEye AI</text>
  <text x="550" y="454" fill="#000000" font-size="12.5" text-anchor="middle">Fabric Defect Detection</text>
  <text x="550" y="472" fill="#000000" font-size="12.5" text-anchor="middle">&amp; Quality Management</text>

  <!-- External Entity 1: Camera & Sensor Rig (Top Left) -->
  <rect x="70" y="130" width="230" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="185" y="160" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Camera &amp; Sensors</text>
  <text x="185" y="178" fill="#555555" font-size="10.5" text-anchor="middle">(Rig &amp; Rotary Encoder)</text>

  <!-- External Entity 2: Floor Operator (Bottom Left) -->
  <rect x="70" y="650" width="230" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="185" y="680" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Floor Operator</text>
  <text x="185" y="698" fill="#555555" font-size="10.5" text-anchor="middle">(Mobile Application)</text>

  <!-- External Entity 3: Quality Inspector (Top Right) -->
  <rect x="800" y="130" width="230" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="915" y="160" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Quality Inspector</text>
  <text x="915" y="178" fill="#555555" font-size="10.5" text-anchor="middle">(Web Workstation)</text>

  <!-- External Entity 4: Production Manager (Middle Right) -->
  <rect x="800" y="390" width="230" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="915" y="420" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Production Manager</text>
  <text x="915" y="438" fill="#555555" font-size="10.5" text-anchor="middle">(Analytics Dashboard)</text>

  <!-- External Entity 5: Inventory Manager (Bottom Right) -->
  <rect x="800" y="650" width="230" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="915" y="680" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Inventory Manager</text>
  <text x="915" y="698" fill="#555555" font-size="10.5" text-anchor="middle">(ERP / Warehouse Stock)</text>


  <!-- ==================== CLEAN HUMAN FLOWS (NO BORDERED BOXES) ==================== -->

  <!-- Flow 1: Sensor to System -->
  <line x1="300" y1="150" x2="455" y2="355" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="270" y="240" width="215" height="22" fill="#ffffff" stroke="none"/>
  <text x="377" y="256" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Video Stream &amp; Encoder Ticks</text>

  <!-- Flow 2: System to Stack Light Alarm -->
  <line x1="425" y1="390" x2="280" y2="200" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
  <rect x="275" y="285" width="155" height="20" fill="#ffffff" stroke="none"/>
  <text x="352" y="299" fill="#000000" font-size="10.5" text-anchor="middle">Relay Warning Signal</text>

  <!-- Flow 3: Floor Operator to System -->
  <line x1="220" y1="650" x2="445" y2="520" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="215" y="574" width="235" height="22" fill="#ffffff" stroke="none"/>
  <text x="332" y="589" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">QR Code &amp; Defect Confirmations</text>

  <!-- Flow 4: System to Floor Operator -->
  <line x1="475" y1="565" x2="300" y2="695" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="310" y="620" width="155" height="20" fill="#ffffff" stroke="none"/>
  <text x="387" y="634" fill="#000000" font-size="10.5" text-anchor="middle">Vibration &amp; Audio Alerts</text>

  <!-- Flow 5: System to Quality Inspector -->
  <line x1="645" y1="355" x2="800" y2="150" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="605" y="240" width="235" height="22" fill="#ffffff" stroke="none"/>
  <text x="722" y="256" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Digital Defect Map &amp; ASTM Grade</text>

  <!-- Flow 6: Quality Inspector to System -->
  <line x1="820" y1="200" x2="675" y2="390" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="665" y="285" width="165" height="20" fill="#ffffff" stroke="none"/>
  <text x="747" y="299" fill="#000000" font-size="10.5" text-anchor="middle">Classification Corrections</text>

  <!-- Flow 7: System to Production Manager -->
  <line x1="685" y1="422" x2="800" y2="422" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="650" y="408" width="185" height="20" fill="#ffffff" stroke="none"/>
  <text x="742" y="423" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Defect Statistics &amp; Logs</text>

  <!-- Flow 8: System to Inventory Manager -->
  <line x1="655" y1="520" x2="850" y2="650" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="635" y="574" width="235" height="22" fill="#ffffff" stroke="none"/>
  <text x="752" y="589" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Certified Roll Grade &amp; Length</text>

  <!-- Flow 9: Inventory Manager to System -->
  <line x1="800" y1="695" x2="625" y2="565" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="625" y="620" width="175" height="20" fill="#ffffff" stroke="none"/>
  <text x="712" y="634" fill="#000000" font-size="10.5" text-anchor="middle">Bay &amp; Quarantine Updates</text>

</svg>
