<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
  </defs>

  <!-- Academic Double Frame (ReDez SRDS Standard) -->
  <rect x="15" y="15" width="1070" height="820" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1060" height="810" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="550" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 4.2: System Context Diagram (Level 0 DFD Overview)</text>
  <line x1="50" y1="62" x2="1050" y2="62" stroke="#cccccc" stroke-width="1"/>

  <!-- Central System Circle -->
  <circle cx="550" cy="450" r="130" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="550" y="432" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">TexEye AI</text>
  <text x="550" y="454" fill="#000000" font-size="12.5" text-anchor="middle">Fabric Defect Detection</text>
  <text x="550" y="472" fill="#000000" font-size="12.5" text-anchor="middle">&amp; Quality Management</text>

  <!-- External Entity 1: Camera & Sensor Rig (Top Left) -->
  <rect x="70" y="115" width="230" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="185" y="145" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Camera &amp; Sensors</text>
  <text x="185" y="165" fill="#555555" font-size="10.5" text-anchor="middle">(Rig &amp; Rotary Encoder)</text>

  <!-- External Entity 2: Floor Operator (Bottom Left) -->
  <rect x="70" y="660" width="230" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="185" y="692" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Floor Operator</text>
  <text x="185" y="712" fill="#555555" font-size="10.5" text-anchor="middle">(Mobile Application)</text>

  <!-- External Entity 3: Quality Inspector (Top Right) -->
  <rect x="800" y="115" width="230" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="915" y="145" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Quality Inspector</text>
  <text x="915" y="165" fill="#555555" font-size="10.5" text-anchor="middle">(Web Workstation)</text>

  <!-- External Entity 4: Production Manager (Middle Right) -->
  <rect x="800" y="415" width="230" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="915" y="447" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Production Manager</text>
  <text x="915" y="467" fill="#555555" font-size="10.5" text-anchor="middle">(Analytics Dashboard)</text>

  <!-- External Entity 5: Inventory Manager (Bottom Right) -->
  <rect x="800" y="660" width="230" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="915" y="692" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Inventory Manager</text>
  <text x="915" y="712" fill="#555555" font-size="10.5" text-anchor="middle">(ERP / Warehouse Stock)</text>


  <!-- ==================== CLEAN ORTHOGONAL FLOWS WITH NATURAL HUMAN WORDS ==================== -->

  <!-- Flow 1: Camera to System (Camera Stream & Speed Pulses) -->
  <path d="M 300 140 L 480 140 L 480 328" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="390" y="132" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Camera Stream &amp; Speed Pulses</text>

  <!-- Flow 2: System to Stack Light Alarm -->
  <path d="M 420 410 L 350 410 L 350 175 L 300 175" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
  <text x="385" y="402" fill="#000000" font-size="10" text-anchor="middle">Buzzer &amp; Light Alarm Trigger</text>


  <!-- Flow 5: System to Quality Inspector -->
  <path d="M 620 328 L 620 140 L 800 140" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="710" y="132" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Defect Roll Map &amp; ASTM Grade</text>

  <!-- Flow 6: Quality Inspector to System -->
  <path d="M 800 175 L 750 175 L 750 410 L 680 410" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="715" y="402" fill="#000000" font-size="10" text-anchor="middle">Classification Corrections</text>


  <!-- Flow 7: System to Production Manager (Horizontal) -->
  <line x1="680" y1="450" x2="800" y2="450" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="740" y="440" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">Production Reports &amp; Defect Logs</text>


  <!-- Flow 3: Floor Operator to System -->
  <path d="M 300 680 L 350 680 L 350 490 L 420 490" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="385" y="482" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">Scanned Roll ID &amp; Confirmations</text>

  <!-- Flow 4: System to Floor Operator -->
  <path d="M 480 572 L 480 715 L 300 715" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="390" y="707" fill="#000000" font-size="10" text-anchor="middle">Audio &amp; Vibration Defect Alerts</text>


  <!-- Flow 8: System to Inventory Manager -->
  <path d="M 680 490 L 750 490 L 750 680 L 800 680" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="715" y="482" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">Certified Roll Grade &amp; Length</text>

  <!-- Flow 9: Inventory Manager to System -->
  <path d="M 800 715 L 620 715 L 620 572" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="710" y="707" fill="#000000" font-size="10" text-anchor="middle">Warehouse Bay &amp; Storage Updates</text>

</svg>