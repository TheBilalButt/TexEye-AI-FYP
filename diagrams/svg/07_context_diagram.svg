<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
  </defs>

  <!-- Academic Double Frame -->
  <rect x="15" y="15" width="1070" height="820" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1060" height="810" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="550" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 4.2: System Context Diagram (Level 0 DFD Overview)</text>
  <line x1="50" y1="62" x2="1050" y2="62" stroke="#cccccc" stroke-width="1"/>

  <!-- Central System Circle -->
  <circle cx="550" cy="450" r="140" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="550" y="435" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">TexEye AI</text>
  <text x="550" y="455" fill="#000000" font-size="13" text-anchor="middle">Fabric Defect Detection</text>
  <text x="550" y="473" fill="#000000" font-size="13" text-anchor="middle">&amp; Quality Management</text>

  <!-- External Entity 1: Camera & Sensor Rig (Top Left) -->
  <rect x="80" y="140" width="220" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="190" y="177" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Camera &amp; Sensors</text>

  <!-- External Entity 2: Floor Operator (Bottom Left) -->
  <rect x="80" y="650" width="220" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="190" y="687" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Floor Operator</text>

  <!-- External Entity 3: Quality Inspector (Top Right) -->
  <rect x="800" y="140" width="220" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="910" y="177" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Quality Inspector</text>

  <!-- External Entity 4: Production Manager (Middle Right) -->
  <rect x="800" y="390" width="220" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="910" y="427" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Production Manager</text>

  <!-- External Entity 5: Inventory Manager (Bottom Right) -->
  <rect x="800" y="650" width="220" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="910" y="687" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Inventory Manager</text>


  <!-- Flows: Sensor to System -->
  <line x1="300" y1="165" x2="445" y2="350" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="320" y="245" fill="#000000" font-size="10.5" font-weight="bold">Video Stream &amp; Encoder Ticks</text>

  <!-- Flows: System to Stack Light Alarm -->
  <line x1="420" y1="380" x2="300" y2="195" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
  <text x="290" y="295" fill="#000000" font-size="10">Relay Warning Signal</text>

  <!-- Flows: Floor Operator to System -->
  <line x1="300" y1="670" x2="450" y2="540" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="310" y="605" fill="#000000" font-size="10.5" font-weight="bold">QR Code &amp; Defect Confirmations</text>

  <!-- Flows: System to Floor Operator -->
  <line x1="425" y1="565" x2="300" y2="695" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="295" y="640" fill="#000000" font-size="10">Vibration &amp; Audio Alerts</text>

  <!-- Flows: System to Quality Inspector -->
  <line x1="655" y1="350" x2="800" y2="165" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="735" y="245" fill="#000000" font-size="10.5" font-weight="bold">Digital Defect Map &amp; ASTM Grade</text>

  <!-- Flows: Quality Inspector to System -->
  <line x1="800" y1="195" x2="680" y2="380" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="750" y="295" fill="#000000" font-size="10">Classification Corrections</text>

  <!-- Flows: System to Production Manager -->
  <line x1="690" y1="450" x2="800" y2="422" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="715" y="415" fill="#000000" font-size="10.5" font-weight="bold">Defect Statistics &amp; Logs</text>

  <!-- Flows: System to Inventory Manager -->
  <line x1="655" y1="545" x2="800" y2="670" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="740" y="605" fill="#000000" font-size="10.5" font-weight="bold">Certified Roll Grade &amp; Length</text>

  <!-- Flows: Inventory Manager to System -->
  <line x1="800" y1="695" x2="680" y2="565" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="750" y="645" fill="#000000" font-size="10">Bay &amp; Quarantine Updates</text>

</svg>
