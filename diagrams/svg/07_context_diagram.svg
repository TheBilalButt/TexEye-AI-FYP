<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
  </defs>

  <!-- Academic Double Frame (ReDez SRDS Standard) -->
  <rect x="15" y="15" width="1070" height="820" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1060" height="810" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="550" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 4.2: System Context Diagram (Level 0 DFD Overview)</text>
  <line x1="50" y1="62" x2="1050" y2="62" stroke="#cccccc" stroke-width="1"/>

  <!-- Central System Circle -->
  <circle cx="550" cy="450" r="135" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="550" y="432" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">TexEye AI</text>
  <text x="550" y="454" fill="#000000" font-size="12.5" text-anchor="middle">Fabric Defect Detection</text>
  <text x="550" y="472" fill="#000000" font-size="12.5" text-anchor="middle">&amp; Quality Management</text>

  <!-- External Entity 1: Camera & Sensor Rig (Top Left) -->
  <rect x="70" y="110" width="230" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="185" y="140" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Camera &amp; Sensors</text>
  <text x="185" y="158" fill="#555555" font-size="10.5" text-anchor="middle">(Rig &amp; Rotary Encoder)</text>

  <!-- External Entity 2: Floor Operator (Bottom Left) -->
  <rect x="70" y="670" width="230" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="185" y="700" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Floor Operator</text>
  <text x="185" y="718" fill="#555555" font-size="10.5" text-anchor="middle">(Mobile Application)</text>

  <!-- External Entity 3: Quality Inspector (Top Right) -->
  <rect x="800" y="110" width="230" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="915" y="140" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Quality Inspector</text>
  <text x="915" y="158" fill="#555555" font-size="10.5" text-anchor="middle">(Web Workstation)</text>

  <!-- External Entity 4: Production Manager (Middle Right) -->
  <rect x="800" y="390" width="230" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="915" y="420" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Production Manager</text>
  <text x="915" y="438" fill="#555555" font-size="10.5" text-anchor="middle">(Analytics Dashboard)</text>

  <!-- External Entity 5: Inventory Manager (Bottom Right) -->
  <rect x="800" y="670" width="230" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="915" y="700" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Inventory Manager</text>
  <text x="915" y="718" fill="#555555" font-size="10.5" text-anchor="middle">(ERP / Warehouse Stock)</text>


  <!-- ==================== SPACIOUS HUMAN FLOWS WITH FULL ARROWS & CLEAN CLEARANCE ==================== -->

  <!-- Flow 1: Sensor to System (From Camera Right Edge to Circle Top-Left) -->
  <line x1="300" y1="142" x2="455" y2="355" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="366" y="238" transform="rotate(53.9, 366, 238)" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">Video Stream &amp; Encoder Ticks</text>

  <!-- Flow 2: System to Stack Light Alarm (From Circle Left to Camera Bottom Edge) -->
  <line x1="420" y1="420" x2="220" y2="175" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
  <text x="331" y="308" transform="rotate(50.8, 331, 308)" fill="#000000" font-size="10" text-anchor="middle">Relay Warning Signal</text>

  <!-- Flow 3: Floor Operator to System (From Operator Right Edge to Circle Bottom-Left) -->
  <line x1="300" y1="680" x2="450" y2="540" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="385" y="600" transform="rotate(-43, 385, 600)" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">QR Scan &amp; Defect Confirmations</text>

  <!-- Flow 4: System to Floor Operator (From Circle Bottom to Operator Top Edge) -->
  <line x1="510" y1="580" x2="220" y2="670" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="361" y="638" transform="rotate(-17.2, 361, 638)" fill="#000000" font-size="10" text-anchor="middle">Vibration &amp; Audio Alerts</text>

  <!-- Flow 5: System to Quality Inspector (From Circle Top-Right to Inspector Left Edge) -->
  <line x1="645" y1="355" x2="800" y2="142" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="734" y="238" transform="rotate(-53.9, 734, 238)" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">Defect Map &amp; ASTM Grade</text>

  <!-- Flow 6: Quality Inspector to System (From Inspector Bottom Edge to Circle Right) -->
  <line x1="880" y1="175" x2="680" y2="420" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="769" y="308" transform="rotate(-50.8, 769, 308)" fill="#000000" font-size="10" text-anchor="middle">Classification Corrections</text>

  <!-- Flow 7: System to Production Manager (Horizontal Direct Flow) -->
  <line x1="685" y1="422" x2="800" y2="422" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="742" y="412" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">Defect Statistics &amp; Logs</text>

  <!-- Flow 8: System to Inventory Manager (From Circle Bottom-Right to Inventory Left Edge) -->
  <line x1="650" y1="540" x2="800" y2="680" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="715" y="600" transform="rotate(43, 715, 600)" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">Certified Roll Grade &amp; Length</text>

  <!-- Flow 9: Inventory Manager to System (From Inventory Top Edge to Circle Bottom) -->
  <line x1="880" y1="670" x2="590" y2="580" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="739" y="638" transform="rotate(17.2, 739, 638)" fill="#000000" font-size="10" text-anchor="middle">Bay &amp; Quarantine Updates</text>

</svg>