<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 900" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
  </defs>

  <!-- Academic Double Frame -->
  <rect x="15" y="15" width="1320" height="870" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1310" height="860" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="675" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 5.2: UML Component Diagram of TexEye AI</text>
  <line x1="50" y1="62" x2="1300" y2="62" stroke="#cccccc" stroke-width="1"/>

  <!-- SUBSYSTEM 1: Edge Core Subsystem -->
  <rect x="50" y="85" width="580" height="770" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="75" y="112" fill="#000000" font-size="13" font-weight="bold">&lt;&lt;subsystem&gt;&gt; texeye-edge-core</text>

  <!-- Component 1: Camera Ingestion -->
  <rect x="75" y="130" width="230" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="190" y="155" fill="#444444" font-size="10" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
  <text x="190" y="175" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">CameraIngestion</text>

  <!-- Component 2: Encoder Telemetry -->
  <rect x="375" y="130" width="230" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="490" y="155" fill="#444444" font-size="10" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
  <text x="490" y="175" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">EncoderTelemetry</text>

  <!-- Component 3: Reliability Monitor -->
  <rect x="225" y="240" width="230" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="340" y="265" fill="#444444" font-size="10" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
  <text x="340" y="285" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">ReliabilityMonitor</text>

  <!-- Camera & Encoder to Reliability -->
  <line x1="190" y1="195" x2="190" y2="272" stroke="#000000" stroke-width="1.2"/>
  <line x1="190" y1="272" x2="225" y2="272" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="490" y1="195" x2="490" y2="272" stroke="#000000" stroke-width="1.2"/>
  <line x1="490" y1="272" x2="455" y2="272" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Component 4: Defect Detector -->
  <rect x="75" y="350" width="230" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="190" y="375" fill="#444444" font-size="10" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
  <text x="190" y="395" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">DefectDetector (YOLO)</text>

  <!-- Component 5: Multi-Frame Tracker -->
  <rect x="375" y="350" width="230" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="490" y="375" fill="#444444" font-size="10" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
  <text x="490" y="395" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">MultiFrameTracker</text>

  <!-- Reliability to Detector -->
  <line x1="280" y1="305" x2="280" y2="328" stroke="#000000" stroke-width="1.2"/>
  <line x1="280" y1="328" x2="190" y2="328" stroke="#000000" stroke-width="1.2"/>
  <line x1="190" y1="328" x2="190" y2="350" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Detector to Tracker -->
  <line x1="305" y1="382" x2="375" y2="382" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Component 6: Coordinate Mapper -->
  <rect x="225" y="460" width="230" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="340" y="485" fill="#444444" font-size="10" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
  <text x="340" y="505" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">CoordinateMapper (X, Y)</text>

  <!-- Tracker to Mapper -->
  <line x1="490" y1="415" x2="490" y2="492" stroke="#000000" stroke-width="1.2"/>
  <line x1="490" y1="492" x2="455" y2="492" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Component 7: Local Persistence -->
  <rect x="75" y="570" width="230" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="190" y="595" fill="#444444" font-size="10" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
  <text x="190" y="615" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">LocalPersistenceManager</text>

  <!-- Component 8: Edge Sync Client -->
  <rect x="375" y="570" width="230" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="490" y="595" fill="#444444" font-size="10" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
  <text x="490" y="615" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">EdgeSyncClient</text>

  <!-- Mapper to Persistence -->
  <line x1="280" y1="525" x2="280" y2="548" stroke="#000000" stroke-width="1.2"/>
  <line x1="280" y1="548" x2="190" y2="548" stroke="#000000" stroke-width="1.2"/>
  <line x1="190" y1="548" x2="190" y2="570" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Persistence to Sync -->
  <line x1="305" y1="602" x2="375" y2="602" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Local SQLite DB node inside Edge Core -->
  <rect x="225" y="680" width="230" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="340" y="705" fill="#444444" font-size="10" text-anchor="middle">&lt;&lt;database&gt;&gt;</text>
  <text x="340" y="722" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">SQLite Local Outbox</text>

  <!-- Persistence to Local DB -->
  <line x1="190" y1="635" x2="190" y2="707" stroke="#000000" stroke-width="1.2"/>
  <line x1="190" y1="707" x2="225" y2="707" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>


  <!-- SUBSYSTEM 2: Central Backend API -->
  <rect x="720" y="85" width="580" height="770" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="745" y="112" fill="#000000" font-size="13" font-weight="bold">&lt;&lt;subsystem&gt;&gt; texeye-backend-api</text>

  <!-- Component: Sync Receiver -->
  <rect x="745" y="130" width="240" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="865" y="155" fill="#444444" font-size="10" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
  <text x="865" y="175" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">SyncReceiverService</text>

  <!-- Component: Auth Service -->
  <rect x="1035" y="130" width="240" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1155" y="155" fill="#444444" font-size="10" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
  <text x="1155" y="175" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Auth &amp; RBAC Service</text>

  <!-- Component: Roll Manager -->
  <rect x="745" y="240" width="240" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="865" y="265" fill="#444444" font-size="10" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
  <text x="865" y="285" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">RollManagerService</text>

  <!-- Component: Defect Manager -->
  <rect x="1035" y="240" width="240" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1155" y="265" fill="#444444" font-size="10" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
  <text x="1155" y="285" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">DefectManagerService</text>

  <!-- Component: Grading Engine -->
  <rect x="745" y="350" width="240" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="865" y="375" fill="#444444" font-size="10" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
  <text x="865" y="395" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">GradingEngine (4-Point)</text>

  <!-- Component: Inventory Service -->
  <rect x="1035" y="350" width="240" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1155" y="375" fill="#444444" font-size="10" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
  <text x="1155" y="395" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">InventoryService</text>

  <!-- Component: Report Generator -->
  <rect x="745" y="460" width="240" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="865" y="485" fill="#444444" font-size="10" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
  <text x="865" y="505" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">ReportGenerator (PDF)</text>

  <!-- Component: Notification Hub -->
  <rect x="1035" y="460" width="240" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1155" y="485" fill="#444444" font-size="10" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
  <text x="1155" y="505" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">NotificationHub (WSS)</text>

  <!-- Central Database representation -->
  <rect x="745" y="570" width="240" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="865" y="595" fill="#444444" font-size="10" text-anchor="middle">&lt;&lt;database&gt;&gt;</text>
  <text x="865" y="615" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">PostgreSQL Database</text>

  <!-- Central Object Storage -->
  <rect x="1035" y="570" width="240" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1155" y="595" fill="#444444" font-size="10" text-anchor="middle">&lt;&lt;storage&gt;&gt;</text>
  <text x="1155" y="615" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">MinIO / S3 Storage</text>


  <!-- Orthogonal Connectors inside Central Subsystem -->
  <!-- Sync Receiver to Roll Manager & Defect Manager -->
  <line x1="865" y1="195" x2="865" y2="240" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="985" y1="162" x2="1010" y2="162" stroke="#000000" stroke-width="1.2"/>
  <line x1="1010" y1="162" x2="1010" y2="272" stroke="#000000" stroke-width="1.2"/>
  <line x1="1010" y1="272" x2="1035" y2="272" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Defect Manager to Grading Engine -->
  <line x1="1100" y1="305" x2="1100" y2="328" stroke="#000000" stroke-width="1.2"/>
  <line x1="1100" y1="328" x2="865" y2="328" stroke="#000000" stroke-width="1.2"/>
  <line x1="865" y1="328" x2="865" y2="350" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Grading to Report -->
  <line x1="865" y1="415" x2="865" y2="460" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Backend to DB & S3 -->
  <line x1="865" y1="525" x2="865" y2="570" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1155" y1="525" x2="1155" y2="570" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>


  <!-- Cross-Subsystem Orthogonal Network Link (Edge Sync -> Central Sync Receiver) -->
  <line x1="605" y1="602" x2="675" y2="602" stroke="#000000" stroke-width="1.5"/>
  <line x1="675" y1="602" x2="675" y2="162" stroke="#000000" stroke-width="1.5"/>
  <line x1="675" y1="162" x2="745" y2="162" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="625" y="375" width="100" height="24" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="675" y="391" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">HTTPS REST</text>

</svg>
