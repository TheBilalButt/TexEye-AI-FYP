<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1200" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="hdr10" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <filter id="sh10" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/></filter>
    <marker id="mB10" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="mG10" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4ade80"/></marker>
  </defs>

  <!-- Title -->
  <g transform="translate(100, 30)" filter="url(#sh10)">
    <rect width="1250" height="70" rx="12" fill="url(#hdr10)" stroke="#334155" stroke-width="1.5"/>
    <text x="625" y="32" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">TexEye AI &mdash; UML Component Diagram</text>
    <text x="625" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Software Components, Provided &amp; Required Interfaces, and Cross-Subsystem Dependencies</text>
  </g>

  <!-- Edge Core Subsystem -->
  <g transform="translate(60, 130)" filter="url(#sh10)">
    <rect width="600" height="640" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="2.5"/>
    <text x="25" y="30" fill="#38bdf8" font-size="14" font-weight="bold">&lt;&lt;subsystem&gt;&gt; texeye-edge-core</text>

    <!-- Component 1 -->
    <rect x="30" y="55" width="240" height="85" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="150" y="85" fill="#38bdf8" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="150" y="105" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">CameraIngestion</text>
    <text x="150" y="122" fill="#94a3b8" font-size="10" text-anchor="middle">ICameraStream</text>

    <!-- Component 2 -->
    <rect x="330" y="55" width="240" height="85" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="450" y="85" fill="#fbbf24" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="450" y="105" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">EncoderTelemetry</text>
    <text x="450" y="122" fill="#94a3b8" font-size="10" text-anchor="middle">IEncoderPosition</text>

    <!-- Component 3 -->
    <rect x="180" y="170" width="240" height="85" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="300" y="198" fill="#f87171" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="300" y="218" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">ReliabilityMonitor</text>
    <text x="300" y="235" fill="#fca5a5" font-size="10" text-anchor="middle">IReliabilityStatus</text>

    <!-- Component 4 -->
    <rect x="30" y="290" width="240" height="85" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="150" y="318" fill="#c084fc" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="150" y="338" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">DefectDetector</text>
    <text x="150" y="355" fill="#94a3b8" font-size="10" text-anchor="middle">IDefectInference</text>

    <!-- Component 5 -->
    <rect x="330" y="290" width="240" height="85" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="450" y="318" fill="#c084fc" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="450" y="338" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">MultiFrameTracker</text>
    <text x="450" y="355" fill="#94a3b8" font-size="10" text-anchor="middle">ITrackTrajectory</text>

    <!-- Component 6 -->
    <rect x="180" y="410" width="240" height="85" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="300" y="438" fill="#4ade80" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="300" y="458" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">CoordinateMapper</text>
    <text x="300" y="475" fill="#bbf7d0" font-size="10" text-anchor="middle">IMetricLocation</text>

    <!-- Component 7 & 8 -->
    <rect x="30" y="530" width="250" height="85" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="155" y="558" fill="#fbbf24" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="155" y="578" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">LocalPersistenceManager</text>
    <text x="155" y="595" fill="#fde68a" font-size="10" text-anchor="middle">ILocalStorage</text>

    <rect x="320" y="530" width="250" height="85" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <text x="445" y="558" fill="#4ade80" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="445" y="578" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">EdgeSyncClient</text>
    <text x="445" y="595" fill="#86efac" font-size="10" text-anchor="middle">ISyncDispatch</text>
  </g>

  <!-- Connectors inside Edge Core -->
  <path d="M 150 140 L 230 170" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 450 140 L 370 170" stroke="#fbbf24" stroke-width="1.5"/>
  <path d="M 250 255 L 170 290" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 270 332 L 330 332" stroke="#c084fc" stroke-width="1.5"/>
  <path d="M 450 375 L 370 410" stroke="#c084fc" stroke-width="1.5"/>
  <path d="M 300 495 L 200 530" stroke="#4ade80" stroke-width="1.5"/>
  <path d="M 280 572 L 320 572" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- Backend Subsystem -->
  <g transform="translate(730, 130)" filter="url(#sh10)">
    <rect width="660" height="640" rx="12" fill="#0f172a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="25" y="30" fill="#4ade80" font-size="14" font-weight="bold">&lt;&lt;subsystem&gt;&gt; texeye-backend-api</text>

    <!-- Component 1 -->
    <rect x="30" y="55" width="280" height="80" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <text x="170" y="82" fill="#4ade80" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="170" y="102" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">SyncReceiverService</text>
    <text x="170" y="118" fill="#86efac" font-size="10" text-anchor="middle">ISyncIngest</text>

    <!-- Component 2 -->
    <rect x="350" y="55" width="280" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="490" y="82" fill="#38bdf8" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="490" y="102" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Auth &amp; RBAC Service</text>
    <text x="490" y="118" fill="#94a3b8" font-size="10" text-anchor="middle">IAuthService</text>

    <!-- Component 3 -->
    <rect x="30" y="170" width="280" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="170" y="198" fill="#38bdf8" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="170" y="218" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">RollManagerService</text>
    <text x="170" y="235" fill="#94a3b8" font-size="10" text-anchor="middle">IRollLifecycle</text>

    <!-- Component 4 -->
    <rect x="350" y="170" width="280" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="490" y="198" fill="#c084fc" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="490" y="218" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">DefectManagerService</text>
    <text x="490" y="235" fill="#94a3b8" font-size="10" text-anchor="middle">IDefectRecords</text>

    <!-- Component 5 -->
    <rect x="30" y="290" width="280" height="80" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="170" y="318" fill="#4ade80" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="170" y="338" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">GradingEngine (4-Point)</text>
    <text x="170" y="355" fill="#bbf7d0" font-size="10" text-anchor="middle">IGradingService</text>

    <!-- Component 6 -->
    <rect x="350" y="290" width="280" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="490" y="318" fill="#fbbf24" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="490" y="338" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">InventoryService</text>
    <text x="490" y="355" fill="#fde68a" font-size="10" text-anchor="middle">IInventoryService</text>

    <!-- Component 7 -->
    <rect x="30" y="410" width="280" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="170" y="438" fill="#38bdf8" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="170" y="458" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">ReportGenerator</text>
    <text x="170" y="475" fill="#94a3b8" font-size="10" text-anchor="middle">IReportService</text>

    <!-- Component 8 -->
    <rect x="350" y="410" width="280" height="80" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="490" y="438" fill="#38bdf8" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="490" y="458" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">NotificationHub (WSS)</text>
    <text x="490" y="475" fill="#93c5fd" font-size="10" text-anchor="middle">IPushAlerts</text>
  </g>

  <!-- Connect EdgeSyncClient -> SyncReceiverService -->
  <path d="M 570 700 L 760 220" stroke="#4ade80" stroke-width="3" marker-end="url(#mG10)"/>
  <text x="630" y="450" fill="#4ade80" font-size="12" font-weight="bold">HTTPS REST Batches</text>

  <!-- User Applications (Bottom) -->
  <g transform="translate(100, 810)" filter="url(#sh10)">
    <rect width="1250" height="150" rx="12" fill="#0f172a" stroke="#db2777" stroke-width="2"/>
    <text x="25" y="28" fill="#f472b6" font-size="14" font-weight="bold">&lt;&lt;subsystem&gt;&gt; user-applications (Mobile &amp; Web Dashboards)</text>

    <!-- Mobile -->
    <rect x="50" y="45" width="540" height="85" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
    <text x="320" y="75" fill="#f472b6" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="320" y="95" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">TexEyeMobileClient (Flutter / React Native)</text>
    <text x="320" y="115" fill="#94a3b8" font-size="11" text-anchor="middle">QR Scanner &bull; Review &amp; Correct &bull; Real-time Alerts</text>

    <!-- Web -->
    <rect x="660" y="45" width="540" height="85" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
    <text x="930" y="75" fill="#f472b6" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="930" y="95" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">TexEyeWebDashboard (React + TypeScript)</text>
    <text x="930" y="115" fill="#94a3b8" font-size="11" text-anchor="middle">Digital Defect Map &bull; 4-Point Roll Grading &bull; PDF Export</text>
  </g>

  <path d="M 370 810 L 370 770" stroke="#f472b6" stroke-width="2"/>
  <path d="M 980 810 L 980 770" stroke="#f472b6" stroke-width="2"/>

</svg>
