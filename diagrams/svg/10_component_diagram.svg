<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 900" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="hdr10" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <filter id="sh10" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/></filter>
    <marker id="mArrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#38bdf8"/></marker>
    <marker id="mArrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#4ade80"/></marker>
    <marker id="mArrP" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#c084fc"/></marker>
    <marker id="mArrY" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#fbbf24"/></marker>
  </defs>

  <!-- Title Banner -->
  <g transform="translate(80, 25)" filter="url(#sh10)">
    <rect width="1290" height="65" rx="10" fill="url(#hdr10)" stroke="#334155" stroke-width="1.5"/>
    <text x="645" y="30" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">TexEye AI &#8212; UML Component Architecture</text>
    <text x="645" y="50" fill="#94a3b8" font-size="12" text-anchor="middle">Software Components, Provided &amp; Required Interfaces, and Cross-Subsystem Dependencies</text>
  </g>

  <!-- SUBSYSTEM 1: Edge Core -->
  <g transform="translate(60, 115)" filter="url(#sh10)">
    <rect width="620" height="640" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
    <text x="25" y="30" fill="#38bdf8" font-size="13" font-weight="bold">&lt;&lt;subsystem&gt;&gt; texeye-edge-core</text>

    <!-- Component 1: Camera Ingestion -->
    <rect x="35" y="55" width="240" height="75" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="155" y="80" fill="#38bdf8" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="155" y="100" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">CameraIngestion</text>
    <text x="155" y="117" fill="#94a3b8" font-size="10" text-anchor="middle">ICameraStream</text>

    <!-- Component 2: Encoder Telemetry -->
    <rect x="345" y="55" width="240" height="75" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="465" y="80" fill="#fbbf24" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="465" y="100" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">EncoderTelemetry</text>
    <text x="465" y="117" fill="#94a3b8" font-size="10" text-anchor="middle">IEncoderPosition</text>

    <!-- Component 3: Reliability Monitor (Central Gate) -->
    <rect x="190" y="175" width="240" height="75" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="310" y="200" fill="#f87171" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="310" y="220" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">ReliabilityMonitor</text>
    <text x="310" y="237" fill="#fca5a5" font-size="10" text-anchor="middle">IReliabilityStatus</text>

    <!-- Connectors to Reliability Monitor -->
    <path d="M 155 130 L 155 212 L 190 212" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#mArrB)"/>
    <path d="M 465 130 L 465 212 L 430 212" stroke="#fbbf24" stroke-width="1.5" fill="none" marker-end="url(#mArrY)"/>

    <!-- Component 4: Defect Detector -->
    <rect x="35" y="295" width="240" height="75" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="155" y="320" fill="#c084fc" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="155" y="340" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">DefectDetector</text>
    <text x="155" y="357" fill="#94a3b8" font-size="10" text-anchor="middle">IDefectInference</text>

    <!-- Component 5: Multi-Frame Tracker -->
    <rect x="345" y="295" width="240" height="75" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="465" y="320" fill="#c084fc" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="465" y="340" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">MultiFrameTracker</text>
    <text x="465" y="357" fill="#94a3b8" font-size="10" text-anchor="middle">ITrackTrajectory</text>

    <!-- Reliability to Defect Detector -->
    <path d="M 250 250 L 250 270 L 155 270 L 155 295" stroke="#4ade80" stroke-width="1.5" fill="none" marker-end="url(#mArrG)"/>
    <!-- Defect Detector to Tracker -->
    <path d="M 275 332 L 345 332" stroke="#c084fc" stroke-width="1.5" fill="none" marker-end="url(#mArrP)"/>

    <!-- Component 6: Coordinate Mapper -->
    <rect x="190" y="415" width="240" height="75" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="310" y="440" fill="#4ade80" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="310" y="460" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">CoordinateMapper</text>
    <text x="310" y="477" fill="#bbf7d0" font-size="10" text-anchor="middle">IMetricLocation (X, Y)</text>

    <!-- Tracker to Mapper -->
    <path d="M 465 370 L 465 452 L 430 452" stroke="#c084fc" stroke-width="1.5" fill="none" marker-end="url(#mArrP)"/>

    <!-- Component 7: Local Persistence -->
    <rect x="35" y="535" width="240" height="75" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="155" y="560" fill="#fbbf24" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="155" y="580" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">LocalPersistenceManager</text>
    <text x="155" y="597" fill="#fde68a" font-size="10" text-anchor="middle">ILocalStorage (SQLite)</text>

    <!-- Component 8: Edge Sync Client -->
    <rect x="345" y="535" width="240" height="75" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <text x="465" y="560" fill="#4ade80" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="465" y="580" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">EdgeSyncClient</text>
    <text x="465" y="597" fill="#86efac" font-size="10" text-anchor="middle">ISyncDispatch (Outbox)</text>

    <!-- Mapper to Persistence -->
    <path d="M 250 490 L 250 515 L 155 515 L 155 535" stroke="#4ade80" stroke-width="1.5" fill="none" marker-end="url(#mArrG)"/>
    <!-- Persistence to Sync -->
    <path d="M 275 572 L 345 572" stroke="#fbbf24" stroke-width="1.5" fill="none" marker-end="url(#mArrY)"/>
  </g>

  <!-- SUBSYSTEM 2: Central Backend API -->
  <g transform="translate(740, 115)" filter="url(#sh10)">
    <rect width="650" height="640" rx="12" fill="#0f172a" stroke="#16a34a" stroke-width="2"/>
    <text x="25" y="30" fill="#4ade80" font-size="13" font-weight="bold">&lt;&lt;subsystem&gt;&gt; texeye-backend-api</text>

    <!-- Component: Sync Receiver -->
    <rect x="35" y="55" width="260" height="75" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <text x="165" y="80" fill="#4ade80" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="165" y="100" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">SyncReceiverService</text>
    <text x="165" y="117" fill="#86efac" font-size="10" text-anchor="middle">ISyncIngest</text>

    <!-- Component: Auth Service -->
    <rect x="355" y="55" width="260" height="75" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="485" y="80" fill="#38bdf8" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="485" y="100" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Auth &amp; RBAC Service</text>
    <text x="485" y="117" fill="#94a3b8" font-size="10" text-anchor="middle">IAuthService (JWT)</text>

    <!-- Component: Roll Manager -->
    <rect x="35" y="175" width="260" height="75" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="165" y="200" fill="#94a3b8" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="165" y="220" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">RollManagerService</text>
    <text x="165" y="237" fill="#94a3b8" font-size="10" text-anchor="middle">IRollLifecycle</text>

    <!-- Component: Defect Manager -->
    <rect x="355" y="175" width="260" height="75" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="485" y="200" fill="#94a3b8" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="485" y="220" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">DefectManagerService</text>
    <text x="485" y="237" fill="#94a3b8" font-size="10" text-anchor="middle">IDefectRecords</text>

    <!-- Sync to Roll & Defect -->
    <path d="M 165 130 L 165 175" stroke="#4ade80" stroke-width="1.5" fill="none" marker-end="url(#mArrG)"/>
    <path d="M 295 92 L 325 92 L 325 212 L 355 212" stroke="#4ade80" stroke-width="1.5" fill="none" marker-end="url(#mArrG)"/>

    <!-- Component: Grading Engine -->
    <rect x="35" y="295" width="260" height="75" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="165" y="320" fill="#4ade80" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="165" y="340" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">GradingEngine (4-Point)</text>
    <text x="165" y="357" fill="#86efac" font-size="10" text-anchor="middle">IGradingService</text>

    <!-- Component: Inventory Service -->
    <rect x="355" y="295" width="260" height="75" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="485" y="320" fill="#fbbf24" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="485" y="340" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">InventoryService</text>
    <text x="485" y="357" fill="#fde68a" font-size="10" text-anchor="middle">IInventoryService</text>

    <!-- Defect to Grading -->
    <path d="M 415 250 L 415 275 L 165 275 L 165 295" stroke="#c084fc" stroke-width="1.5" fill="none" marker-end="url(#mArrP)"/>

    <!-- Component: Report Generator -->
    <rect x="35" y="415" width="260" height="75" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="165" y="440" fill="#94a3b8" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="165" y="460" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">ReportGenerator</text>
    <text x="165" y="477" fill="#94a3b8" font-size="10" text-anchor="middle">IReportService (PDF)</text>

    <!-- Component: Notification Hub -->
    <rect x="355" y="415" width="260" height="75" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="485" y="440" fill="#38bdf8" font-size="11" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="485" y="460" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">NotificationHub (WSS)</text>
    <text x="485" y="477" fill="#94a3b8" font-size="10" text-anchor="middle">IPushAlerts</text>

    <!-- Grading to Report -->
    <path d="M 165 370 L 165 415" stroke="#4ade80" stroke-width="1.5" fill="none" marker-end="url(#mArrG)"/>

    <!-- Central Database & Storage representations -->
    <g transform="translate(35, 535)">
      <rect width="260" height="75" rx="6" fill="#052e16" stroke="#4ade80" stroke-width="1.5"/>
      <text x="130" y="565" fill="#4ade80" font-size="11" text-anchor="middle">&lt;&lt;database&gt;&gt;</text>
      <text x="130" y="585" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">PostgreSQL Database</text>
      <text x="130" y="600" fill="#bbf7d0" font-size="10" text-anchor="middle">Certified Rolls &amp; Defect Audit</text>
    </g>

    <g transform="translate(355, 535)">
      <rect width="260" height="75" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="130" y="565" fill="#38bdf8" font-size="11" text-anchor="middle">&lt;&lt;storage&gt;&gt;</text>
      <text x="130" y="585" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">MinIO / S3 Storage</text>
      <text x="130" y="600" fill="#94a3b8" font-size="10" text-anchor="middle">Defect Image Crops Archive</text>
    </g>
  </g>

  <!-- Cross-Subsystem Network Link -->
  <path d="M 680 687 L 710 687 L 710 205 L 775 205" stroke="#4ade80" stroke-width="2.5" fill="none" marker-end="url(#mArrG)"/>
  <rect x="670" y="430" width="130" height="26" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
  <text x="735" y="447" fill="#4ade80" font-size="10" font-weight="bold" text-anchor="middle">HTTPS Sync Batches</text>
</svg>
