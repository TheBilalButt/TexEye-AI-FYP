<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
    <marker id="arrowRev" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <polygon points="8 0, 0 4, 8 8" fill="#000000"/>
    </marker>
  </defs>

  <!-- Academic Double Frame -->
  <rect x="15" y="15" width="1170" height="920" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1160" height="910" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="600" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 5.1: Layered Software Architecture of TexEye AI</text>
  <line x1="50" y1="62" x2="1150" y2="62" stroke="#cccccc" stroke-width="1"/>

  <!-- LAYER 1: Hardware / Edge Layer -->
  <rect x="50" y="85" width="1100" height="135" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="75" y="112" fill="#000000" font-size="13" font-weight="bold">Hardware and Edge Sensing Layer</text>

  <rect x="75" y="130" width="235" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="192" y="160" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Camera Ingestion Service</text>
  <text x="192" y="180" fill="#444444" font-size="10.5" text-anchor="middle">V4L2 / GenICam Stream</text>

  <rect x="335" y="130" width="235" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="452" y="160" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Encoder Reading Service</text>
  <text x="452" y="180" fill="#444444" font-size="10.5" text-anchor="middle">GPIO Quadrature Counter</text>

  <rect x="595" y="130" width="250" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="720" y="160" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Inspection Reliability Monitor</text>
  <text x="720" y="180" fill="#444444" font-size="10.5" text-anchor="middle">Light, Blur &amp; Connection Gate</text>

  <rect x="870" y="130" width="255" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="997" y="160" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Uninspected Section Handler</text>
  <text x="997" y="180" fill="#444444" font-size="10.5" text-anchor="middle">Guards Non-Defect-Free Invariant</text>


  <!-- LAYER 2: AI Processing Layer -->
  <line x1="600" y1="220" x2="600" y2="245" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="50" y="245" width="1100" height="135" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="75" y="272" fill="#000000" font-size="13" font-weight="bold">AI Vision and Metrology Layer</text>

  <rect x="75" y="290" width="200" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="175" y="320" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Image Preprocessing</text>
  <text x="175" y="340" fill="#444444" font-size="10.5" text-anchor="middle">ROI Crop &amp; Undistortion</text>

  <rect x="295" y="290" width="230" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="410" y="320" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Defect Detection Model</text>
  <text x="410" y="340" fill="#444444" font-size="10.5" text-anchor="middle">Fine-Tuned YOLO Engine</text>

  <rect x="545" y="290" width="250" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="670" y="320" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Multi-Frame Tracker</text>
  <text x="670" y="340" fill="#444444" font-size="10.5" text-anchor="middle">Kalman Filter &amp; IoU Association</text>

  <rect x="815" y="290" width="310" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="970" y="320" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Duplicate Reduction &amp; Metrology</text>
  <text x="970" y="340" fill="#444444" font-size="10.5" text-anchor="middle">Metric Coordinate Mapping (X, Y)</text>


  <!-- LAYER 3: Backend Application Services Layer -->
  <line x1="600" y1="380" x2="600" y2="405" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="50" y="405" width="1100" height="155" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="75" y="432" fill="#000000" font-size="13" font-weight="bold">Backend Application Services Layer (FastAPI)</text>

  <rect x="75" y="450" width="190" height="85" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="170" y="480" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Auth &amp; RBAC Service</text>
  <text x="170" y="500" fill="#444444" font-size="10" text-anchor="middle">JWT Verification</text>

  <rect x="280" y="450" width="190" height="85" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="375" y="480" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Roll Management</text>
  <text x="375" y="500" fill="#444444" font-size="10" text-anchor="middle">QR Code &amp; Specifications</text>

  <rect x="485" y="450" width="190" height="85" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="580" y="480" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Defect Records Service</text>
  <text x="580" y="500" fill="#444444" font-size="10" text-anchor="middle">Classification &amp; Coordinates</text>

  <rect x="690" y="450" width="220" height="85" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="800" y="480" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">ASTM 4-Point Grading</text>
  <text x="800" y="500" fill="#444444" font-size="10" text-anchor="middle">Automated Penalty Scoring</text>

  <rect x="925" y="450" width="200" height="85" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1025" y="480" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Reporting &amp; Push Hub</text>
  <text x="1025" y="500" fill="#444444" font-size="10" text-anchor="middle">PDF Engine &amp; WebSocket</text>


  <!-- LAYER 4: Data Layer -->
  <line x1="600" y1="560" x2="600" y2="585" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrowRev)"/>
  <rect x="50" y="585" width="1100" height="135" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="75" y="612" fill="#000000" font-size="13" font-weight="bold">Data Persistence and Synchronization Layer</text>

  <rect x="75" y="630" width="320" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="235" y="660" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Local SQLite Database (WAL)</text>
  <text x="235" y="680" fill="#444444" font-size="10.5" text-anchor="middle">Offline Outbox &amp; Ring Buffer Cache</text>

  <rect x="440" y="630" width="320" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="600" y="660" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Central PostgreSQL Database</text>
  <text x="600" y="680" fill="#444444" font-size="10.5" text-anchor="middle">Relational Rolls, Defects &amp; Audit Trail</text>

  <rect x="805" y="630" width="320" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="965" y="660" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Object Storage (MinIO / S3)</text>
  <text x="965" y="680" fill="#444444" font-size="10.5" text-anchor="middle">Defect Image Crops &amp; PDF Archives</text>


  <!-- LAYER 5: Presentation / UI Layer -->
  <line x1="600" y1="720" x2="600" y2="745" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrowRev)"/>
  <rect x="50" y="745" width="1100" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="75" y="772" fill="#000000" font-size="13" font-weight="bold">User Interface and Client Layer</text>

  <rect x="150" y="790" width="380" height="85" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="340" y="825" fill="#000000" font-size="12.5" font-weight="bold" text-anchor="middle">Shop Floor Mobile Application</text>
  <text x="340" y="850" fill="#444444" font-size="10.5" text-anchor="middle">QR Scanner, Vibration Alerts &amp; Defect Review</text>

  <rect x="670" y="790" width="380" height="85" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="860" y="825" fill="#000000" font-size="12.5" font-weight="bold" text-anchor="middle">Production &amp; Quality Web Dashboard</text>
  <text x="860" y="850" fill="#444444" font-size="10.5" text-anchor="middle">2D Defect Map, 4-Point Grading &amp; Executive Analytics</text>

</svg>
