"#fbbf24" d="M0,0 L0,6 L9,3 z"/></marker></defs><g filter="url(#shadow5)" transform="translate(100, 30)"><rect width="1250" height="75" fill="url(#hdrGrad5)" stroke="#334155" stroke-width="1.5" rx="12"/><text x="625" y="32" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">TexEye AI — Layered Software Architecture &amp; Service Communication</text><text x="625" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Modular 5-Tier Architecture: Hardware/Edge • AI Pipeline • Backend Core • Data Stores • User Applications</text></g><g filter="url(#shadow5)" transform="translate(100, 130)"><rect width="1250" height="170" fill="#0f172a" stroke="#db2777" stroke-width="2" rx="12"/><text x="25" y="28" fill="#f472b6" font-size="14" font-weight="bold">E. USER INTERFACE LAYER (CLIENTS)</text><rect width="570" height="105" x="30" y="45" fill="url(#uiGrad)" stroke="#f472b6" stroke-width="1.5" rx="8"/><text x="315" y="73" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">Mobile Application (Floor Operator / Inspector)</text><text x="315" y="93" fill="#fbcfe8" font-size="11" text-anchor="middle">Technology: Flutter / React Native (Proposed Choice)</text><text x="315" y="113" fill="#fff" font-size="11" text-anchor="middle">• Real-time Alerts • QR Code Scanner • Defect Review &amp; Correction</text><text x="315" y="133" fill="#f9a8d4" font-size="10" text-anchor="middle">Communicates via HTTPS REST (Bearer JWT) &amp; WSS Push Notifications</text><rect width="580" height="105" x="640" y="45" fill="url(#uiGrad)" stroke="#f472b6" stroke-width="1.5" rx="8"/><text x="930" y="73" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">Web Dashboard (Quality / Production / Inventory / Admin)</text><text x="930" y="93" fill="#fbcfe8" font-size="11" text-anchor="middle">Technology: React + TypeScript + Tailwind CSS (Proposed Choice)</text><text x="930" y="113" fill="#fff" font-size="11" text-anchor="middle">• Interactive Fabric Defect Map • 4-Point Roll Grading • PDF Report Export</text><text x="930" y="133" fill="#f9a8d4" font-size="10" text-anchor="middle">Communicates via HTTPS REST API &amp; WebSocket Telemetry Stream</text></g><path stroke="#f472b6" stroke-width="2.5" marker-end="url(#aPK)" d="M 725 300 L 725 340"/><text x="740" y="325" fill="#f472b6" font-size="11" font-weight="bold">HTTPS REST / WSS</text><g filter="url(#shadow5)" transform="translate(100, 345)"><rect width="1250" height="240" fill="#0f172a" stroke="#16a34a" stroke-width="2" rx="12"/><text x="25" y="28" fill="#4ade80" font-size="14" font-weight="bold">C. BACKEND / APPLICATION LAYER [Proposed: FastAPI / Python ASGI / Docker]</text><rect width="220" height="80" x="30" y="45" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="140" y="72" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Authentication &amp; RBAC</text><text x="140" y="92" fill="#94a3b8" font-size="10" text-anchor="middle">JWT Tokens • Role Scopes</text><text x="140" y="108" fill="#4ade80" font-size="10" text-anchor="middle">User Session Manager</text><rect width="220" height="80" x="270" y="45" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="380" y="72" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Fabric Roll Service</text><text x="380" y="92" fill="#94a3b8" font-size="10" text-anchor="middle">Batch Numbers • QR Codes</text><text x="380" y="108" fill="#4ade80" font-size="10" text-anchor="middle">Inspection Lifecycle</text><rect width="220" height="80" x="510" y="45" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="620" y="72" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Defect Records Service</text><text x="620" y="92" fill="#94a3b8" font-size="10" text-anchor="middle">Coordinate Normalization</text><text x="620" y="108" fill="#4ade80" font-size="10" text-anchor="middle">Correction &amp; Verification</text><rect width="220" height="80" x="750" y="45" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="860" y="72" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Grading Engine</text><text x="860" y="92" fill="#94a3b8" font-size="10" text-anchor="middle">Standard 4-Point System</text><text x="860" y="108" fill="#4ade80" font-size="10" text-anchor="middle">Points/100m² Penalty Calc</text><rect width="230" height="80" x="990" y="45" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="1105" y="72" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Notification Hub</text><text x="1105" y="92" fill="#94a3b8" font-size="10" text-anchor="middle">WebSocket Telemetry</text><text x="1105" y="108" fill="#4ade80" font-size="10" text-anchor="middle">FCM Mobile Push Gateway</text><rect width="370" height="80" x="30" y="140" fill="url(#appGrad)" stroke="#4ade80" stroke-width="1.5" rx="6"/><text x="215" y="167" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Central Sync Ingestion Receiver</text><text x="215" y="187" fill="#bbf7d0" font-size="10" text-anchor="middle">Idempotent Batch Processor • UUID De-duplication</text><text x="215" y="203" fill="#86efac" font-size="10" text-anchor="middle">Validates HMAC &amp; Checksums from Edge</text><rect width="370" height="80" x="420" y="140" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="605" y="167" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Inventory &amp; Scrap Service</text><text x="605" y="187" fill="#94a3b8" font-size="10" text-anchor="middle">Warehouse Bay / Shelf Allocation</text><text x="605" y="203" fill="#4ade80" font-size="10" text-anchor="middle">Quarantine Flagging for Grade C / Scrap</text><rect width="410" height="80" x="810" y="140" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="1015" y="167" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Reporting &amp; Quality Statistics Engine</text><text x="1015" y="187" fill="#9