i-Frame Tracker</text><text x="630" y="100" fill="#c084fc" font-size="11" text-anchor="middle">Kalman Filter + IoU</text><text x="630" y="118" fill="#94a3b8" font-size="10" text-anchor="middle">Tracks across frames</text><text x="630" y="134" fill="#94a3b8" font-size="10" text-anchor="middle">Prevents track jitter</text><rect width="220" height="105" x="760" y="50" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="870" y="78" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Duplicate Reduction</text><text x="870" y="100" fill="#c084fc" font-size="11" text-anchor="middle">Spatial-Temporal Merging</text><text x="870" y="118" fill="#94a3b8" font-size="10" text-anchor="middle">Suppresses repeat count</text><text x="870" y="134" fill="#94a3b8" font-size="10" text-anchor="middle">Consolidates alerts</text><rect width="220" height="105" x="1000" y="50" fill="url(#aiGrad)" stroke="#c084fc" stroke-width="1.5" rx="6"/><text x="1110" y="78" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Metric Coordinate Engine</text><text x="1110" y="100" fill="#f3e8ff" font-size="11" text-anchor="middle">Calibration &amp; Integration</text><text x="1110" y="118" fill="#e9d5ff" font-size="10" text-anchor="middle">Y_m: Rotary Encoder</text><text x="1110" y="134" fill="#e9d5ff" font-size="10" text-anchor="middle">X_cm: Camera pixel calib</text></g><path stroke="#38bdf8" stroke-width="2.5" marker-end="url(#aB)" d="M 725 1005 L 725 1045"/><g filter="url(#shadow5)" transform="translate(100, 1050)"><rect width="1250" height="190" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="12"/><text x="25" y="28" fill="#38bdf8" font-size="14" font-weight="bold">A. HARDWARE / EDGE LAYER (PHYSICAL SENSORS &amp; TELEMETRY GATES)</text><rect width="210" height="115" x="30" y="50" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="135" y="78" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Camera Capture Service</text><text x="135" y="98" fill="#38bdf8" font-size="10" text-anchor="middle">V4L2 / GenICam Stream</text><text x="135" y="116" fill="#94a3b8" font-size="10" text-anchor="middle">Frame Buffer Queue</text><text x="135" y="132" fill="#94a3b8" font-size="10" text-anchor="middle">Zero-Copy Memory Shm</text><text x="135" y="148" fill="#94a3b8" font-size="10" text-anchor="middle">Timestamp Tagging</text><rect width="210" height="115" x="260" y="50" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="365" y="78" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Rotary Encoder Service</text><text x="365" y="98" fill="#38bdf8" font-size="10" text-anchor="middle">Hardware GPIO Listener</text><text x="365" y="116" fill="#94a3b8" font-size="10" text-anchor="middle">Quadrature Counter</text><text x="365" y="132" fill="#94a3b8" font-size="10" text-anchor="middle">ΔL Integration Engine</text><text x="365" y="148" fill="#94a3b8" font-size="10" text-anchor="middle">Speed calculation (m/min)</text><rect width="310" height="115" x="490" y="50" fill="url(#edgeGrad5)" stroke="#38bdf8" stroke-width="2" rx="6"/><text x="645" y="75" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Inspection Reliability Monitor</text><text x="645" y="95" fill="#fff" font-size="10" text-anchor="middle">• Camera Disconnect Ping Watchdog</text><text x="645" y="112" fill="#fff" font-size="10" text-anchor="middle">• Illumination Uniformity &amp; Lux Check</text><text x="645" y="129" fill="#fff" font-size="10" text-anchor="middle">• Laplacian Variance Sharpness Filter</text><text x="645" y="146" fill="#fff" font-size="10" text-anchor="middle">• Dropped Frame Sequence Analyzer</text><rect width="220" height="115" x="820" y="50" fill="#1e293b" stroke="#ef4444" stroke-width="2" rx="6"/><text x="930" y="78" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle">Uninspected Section Handler</text><text x="930" y="98" fill="#fff" font-size="10" text-anchor="middle">Computes Span [L1, L2]</text><text x="930" y="116" fill="#fca5a5" font-size="10" text-anchor="middle">Triggers Warning Beacon</text><text x="930" y="132" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">Flags as UNINSPECTED</text><text x="930" y="148" fill="#fca5a5" font-size="9" text-anchor="middle">Never treats as defect-free!</text><rect width="160" height="115" x="1060" y="50" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" rx="6"/><text x="1140" y="78" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">Edge Sync Daemon</text><text x="1140" y="98" fill="#94a3b8" font-size="10" text-anchor="middle">Background HTTP</text><text x="1140" y="116" fill="#94a3b8" font-size="10" text-anchor="middle">Heartbeat Worker</text><text x="1140" y="132" fill="#94a3b8" font-size="10" text-anchor="middle">Exponential Jitter</text><text x="1140" y="148" fill="#94a3b8" font-size="10" text-anchor="middle">Outbox Processor</text></g><path stroke="#4ade80" stroke-dasharray="4 2" stroke-width="2" marker-end="url(#aG)" d="M 1220 1100 L 1380 1100 L 1380 470 L 400 470"/><text x="1390" y="780" fill="#4ade80" font-size="11" font-weight="bold" transform="rotate(90, 1390, 780)">HTTPS Sync Batches</text></svg>