<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1300" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="hdr9" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <filter id="sh9" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/></filter>
    <marker id="mB9" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="mG9" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4ade80"/></marker>
    <marker id="mP9" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c084fc"/></marker>
    <marker id="mR9" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f87171"/></marker>
  </defs>

  <!-- Title -->
  <g transform="translate(100, 30)" filter="url(#sh9)">
    <rect width="1250" height="70" rx="12" fill="url(#hdr9)" stroke="#334155" stroke-width="1.5"/>
    <text x="625" y="32" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">TexEye AI &mdash; Level 1 Data Flow Diagram (DFD L1)</text>
    <text x="625" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Detailed Sub-process Breakdown: Ingestion, AI Metrology, Persistence, Grading Engine &amp; User Hubs</text>
  </g>

  <!-- Group 1: Subsystem 1.0 Decomposed -->
  <g transform="translate(60, 130)" filter="url(#sh9)">
    <rect width="400" height="420" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="25" y="28" fill="#38bdf8" font-size="13" font-weight="bold">1.0 HARDWARE INGESTION &amp; RELIABILITY DECOMPOSITION</text>

    <!-- 1.1 -->
    <rect x="25" y="45" width="350" height="70" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="200" y="73" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">1.1 Frame Capture &amp; Buffer</text>
    <text x="200" y="93" fill="#94a3b8" font-size="10" text-anchor="middle">V4L2/GenICam &bull; Timestamp Ingestion</text>

    <!-- 1.2 -->
    <rect x="25" y="135" width="350" height="70" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="200" y="163" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">1.2 Encoder Pulse Integration</text>
    <text x="200" y="183" fill="#94a3b8" font-size="10" text-anchor="middle">Hardware GPIO Listener &bull; Distance &Delta;L</text>

    <!-- 1.3 -->
    <rect x="25" y="225" width="350" height="85" rx="15" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2"/>
    <text x="200" y="253" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">1.3 Reliability &amp; Quality Gate</text>
    <text x="200" y="273" fill="#93c5fd" font-size="10" text-anchor="middle">Checks: Cam disconnect, Lighting, Focus Blur</text>
    <text x="200" y="290" fill="#93c5fd" font-size="10" text-anchor="middle">Dropped-Frame Rate &amp; Speed Synchrony</text>

    <!-- 1.4 -->
    <rect x="25" y="330" width="350" height="70" rx="15" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <text x="200" y="358" fill="#fca5a5" font-size="12" font-weight="bold" text-anchor="middle">1.4 Uninspected Span Calculator</text>
    <text x="200" y="378" fill="#fecaca" font-size="10" text-anchor="middle">Flags [L1, L2] &bull; Bypasses AI Model &bull; Alerts Floor</text>
  </g>

  <!-- Connectors inside 1.0 -->
  <path d="M 235 245 L 235 355" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 235 435 L 235 460" stroke="#f87171" stroke-width="2" marker-end="url(#mR9)"/>

  <!-- Group 2: Subsystem 2.0 AI Vision Decomposed -->
  <g transform="translate(520, 130)" filter="url(#sh9)">
    <rect width="420" height="420" rx="12" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
    <text x="25" y="28" fill="#c084fc" font-size="13" font-weight="bold">2.0 AI VISION &amp; METROLOGY PIPELINE DECOMPOSITION</text>

    <!-- 2.1 -->
    <rect x="25" y="45" width="370" height="70" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="210" y="73" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2.1 ROI Conditioning &amp; CLAHE Normalization</text>
    <text x="210" y="93" fill="#c084fc" font-size="10" text-anchor="middle">Fabric web edge detection &amp; contrast normalization</text>

    <!-- 2.2 -->
    <rect x="25" y="135" width="370" height="75" rx="15" fill="#3b0764" stroke="#c084fc" stroke-width="2"/>
    <text x="210" y="163" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">2.2 Deep Learning Defect Detection</text>
    <text x="210" y="183" fill="#f3e8ff" font-size="10" text-anchor="middle">YOLO Model &bull; Confidence Filtering (&ge; &theta;)</text>
    <text x="210" y="197" fill="#e9d5ff" font-size="9" text-anchor="middle">Classes: Hole, Stain, Warp/Weft flaw, Float, Oil spot</text>

    <!-- 2.3 -->
    <rect x="25" y="230" width="370" height="75" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="210" y="258" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2.3 Multi-Frame Tracker &amp; Deduplication</text>
    <text x="210" y="278" fill="#c084fc" font-size="10" text-anchor="middle">Kalman Filter &bull; IoU Trajectory Association</text>
    <text x="210" y="292" fill="#94a3b8" font-size="9" text-anchor="middle">Suppresses duplicate alerts for the same defect</text>

    <!-- 2.4 -->
    <rect x="25" y="325" width="370" height="75" rx="15" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="210" y="353" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">2.4 Metric Coordinate Mapping (X_cm, Y_m)</text>
    <text x="210" y="373" fill="#bbf7d0" font-size="10" text-anchor="middle">Longitudinal Y via Rotary Encoder Pulses</text>
    <text x="210" y="388" fill="#86efac" font-size="9" text-anchor="middle">Lateral X via Camera Pixel-to-Fabric Ground Resolution</text>
  </g>

  <!-- Connect 1.3 to 2.1 -->
  <path d="M 435 390 L 490 390 L 490 205 L 545 205" stroke="#4ade80" stroke-width="2" marker-end="url(#mG9)"/>
  <text x="440" y="195" fill="#4ade80" font-size="9" font-weight="bold">Clean Frames</text>

  <!-- Group 3: Subsystem 3.0 Edge Data Storage & Sync -->
  <g transform="translate(980, 130)" filter="url(#sh9)">
    <rect width="410" height="420" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="25" y="28" fill="#fbbf24" font-size="13" font-weight="bold">3.0 EDGE DATA STORAGE &amp; SYNC</text>

    <!-- 3.1 -->
    <rect x="25" y="45" width="360" height="100" rx="15" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="205" y="75" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">3.1 Local Storage Writer &amp; Image Cache</text>
    <text x="205" y="95" fill="#fde68a" font-size="10" text-anchor="middle">Writes defect rows &amp; uninspected spans to SQLite</text>
    <text x="205" y="112" fill="#94a3b8" font-size="10" text-anchor="middle">Stores cropped JPEG snippets locally</text>
    <text x="205" y="128" fill="#fbbf24" font-size="10" text-anchor="middle">Appends transaction to Offline Sync Queue</text>

    <!-- 3.2 -->
    <rect x="25" y="180" width="360" height="110" rx="15" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <text x="205" y="210" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">3.2 Connectivity Probe &amp; Sync Dispatcher</text>
    <text x="205" y="230" fill="#94a3b8" font-size="10" text-anchor="middle">Continuous HTTP ping / health watchdog</text>
    <text x="205" y="248" fill="#bbf7d0" font-size="10" text-anchor="middle">On Connection: Batches N queued records</text>
    <text x="205" y="266" fill="#86efac" font-size="10" text-anchor="middle">Dispatches HTTPS POST to Central API</text>

    <!-- Local DB Box -->
    <rect x="25" y="315" width="360" height="85" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="205" y="345" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">D1: SQLite Database &bull; D2: Outbox Table</text>
    <text x="205" y="365" fill="#fde68a" font-size="10" text-anchor="middle">Atomic Local Commits (Zero latency on floor)</text>
    <text x="205" y="382" fill="#fef3c7" font-size="9" text-anchor="middle">Guaranteed offline operation without factory stoppage</text>
  </g>

  <!-- Connect 2.4 to 3.1 -->
  <path d="M 915 480 L 980 480 L 980 200 L 1005 200" stroke="#c084fc" stroke-width="2" marker-end="url(#mP9)"/>

  <!-- Group 4 & 5: Central Quality Management & User Hubs -->
  <g transform="translate(100, 600)" filter="url(#sh9)">
    <rect width="1250" height="340" rx="12" fill="#0f172a" stroke="#4ade80" stroke-width="2"/>
    <text x="25" y="28" fill="#4ade80" font-size="14" font-weight="bold">4.0 &amp; 5.0 CENTRAL MANAGEMENT, GRADING &amp; USER PRESENTATION SERVICES</text>

    <!-- 4.1 -->
    <rect x="30" y="50" width="370" height="90" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="215" y="78" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">4.1 Defect Review &amp; Correction Manager</text>
    <text x="215" y="98" fill="#94a3b8" font-size="10" text-anchor="middle">Receives Inspector corrections from mobile/web</text>
    <text x="215" y="115" fill="#4ade80" font-size="10" text-anchor="middle">Updates verified classification &amp; audit trail</text>

    <!-- 4.2 -->
    <rect x="440" y="50" width="370" height="90" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="625" y="78" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">4.2 4-Point Fabric Grading Calculator</text>
    <text x="625" y="98" fill="#94a3b8" font-size="10" text-anchor="middle">Points Penalty: 1, 2, 3, or 4 points per defect size</text>
    <text x="625" y="115" fill="#4ade80" font-size="10" text-anchor="middle">Calculates Total Points per 100m&sup2; &rarr; Grade A / B / C / Scrap</text>

    <!-- 4.3 -->
    <rect x="850" y="50" width="370" height="90" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="1035" y="78" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">4.3 Report &amp; Quality Statistics Engine</text>
    <text x="1035" y="98" fill="#94a3b8" font-size="10" text-anchor="middle">Generates certified PDF Roll Inspection Certificates</text>
    <text x="1035" y="115" fill="#4ade80" font-size="10" text-anchor="middle">Maintains Pareto defect frequency analytics</text>

    <!-- 5.1 & 5.2 -->
    <rect x="30" y="165" width="580" height="150" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="320" y="195" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">5.1 Real-Time Alert &amp; Push Broadcaster</text>
    <text x="320" y="218" fill="#94a3b8" font-size="11" text-anchor="middle">WebSocket stream to active floor clients</text>
    <text x="320" y="238" fill="#fca5a5" font-size="11" text-anchor="middle">&bull; Dispatches "Uninspected Section Warning" on sensor degraded</text>
    <text x="320" y="258" fill="#fde68a" font-size="11" text-anchor="middle">&bull; Dispatches "Critical Defect Discovered" vibration to mobile</text>
    <text x="320" y="280" fill="#38bdf8" font-size="11" text-anchor="middle">&bull; Updates floor status banners</text>

    <rect x="640" y="165" width="580" height="150" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="930" y="195" fill="#c084fc" font-size="13" font-weight="bold" text-anchor="middle">5.2 Digital Fabric Defect Map Visualizer</text>
    <text x="930" y="218" fill="#94a3b8" font-size="11" text-anchor="middle">Interactive 2D Roll Canvas (Web Dashboard)</text>
    <text x="930" y="238" fill="#ffffff" font-size="11" text-anchor="middle">&bull; Color-coded defect markers plotted at (X_cm, Y_m)</text>
    <text x="930" y="258" fill="#fca5a5" font-size="11" text-anchor="middle">&bull; Amber / Hashed bands clearly highlight UNINSPECTED spans</text>
    <text x="930" y="280" fill="#bbf7d0" font-size="11" text-anchor="middle">&bull; Zoom, filter by defect class, click to view defect image crop</text>
  </g>

</svg>
