<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
  </defs>

  <!-- Academic Double Frame (ReDez SRDS Standard) -->
  <rect x="15" y="15" width="1170" height="820" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1160" height="810" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="600" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 4.4: DFD Level 1 (Decomposition of Process 2.0: Quality &amp; Defect Analysis)</text>
  <line x1="50" y1="62" x2="1150" y2="62" stroke="#cccccc" stroke-width="1"/>

  <!-- External Input: 1.0 Synchronized Streams -->
  <rect x="50" y="200" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="140" y="235" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Process 1.0 (Sync Feed)</text>

  <!-- Process 2.1: Reliability Gate (Clean Rounded Box - No Dividing Line) -->
  <rect x="310" y="190" width="220" height="80" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="420" y="225" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">2.1 Verify</text>
  <text x="420" y="245" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Reliability Gate</text>

  <line x1="230" y1="230" x2="310" y2="230" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="245" y="212" width="50" height="16" fill="#ffffff" stroke="none"/>
  <text x="270" y="224" fill="#000000" font-size="10.5" text-anchor="middle">Frames</text>

  <!-- Process 2.2: Uninspected Span Handler (Clean Rounded Box) -->
  <rect x="310" y="370" width="220" height="80" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="420" y="405" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">2.2 Mark Uninspected Span</text>
  <text x="420" y="425" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">&amp; Trip Warning Relay</text>

  <!-- 2.1 to 2.2 (Unreliable) -->
  <line x1="420" y1="270" x2="420" y2="370" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="425" y="312" width="95" height="18" fill="#ffffff" stroke="none"/>
  <text x="430" y="325" fill="#000000" font-size="10.5" font-weight="bold">Degraded Frame</text>

  <!-- Process 2.3: YOLO Detection (Clean Rounded Box) -->
  <rect x="630" y="190" width="220" height="80" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="740" y="225" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">2.3 Run AI</text>
  <text x="740" y="245" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Defect Detection</text>

  <!-- 2.1 to 2.3 (Reliable) -->
  <line x1="530" y1="230" x2="630" y2="230" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="545" y="212" width="70" height="16" fill="#ffffff" stroke="none"/>
  <text x="580" y="224" fill="#000000" font-size="10.5" text-anchor="middle">Clean Image</text>

  <!-- Process 2.4: Multi-Frame Tracking & Deduplication (Clean Rounded Box) -->
  <rect x="930" y="190" width="220" height="80" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="1040" y="225" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">2.4 Track Across Frames</text>
  <text x="1040" y="245" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">&amp; Suppress Duplicates</text>

  <!-- 2.3 to 2.4 -->
  <line x1="850" y1="230" x2="930" y2="230" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="855" y="212" width="70" height="16" fill="#ffffff" stroke="none"/>
  <text x="890" y="224" fill="#000000" font-size="10.5" text-anchor="middle">Detections</text>

  <!-- Process 2.5: Metrology & Physical Mapping (Clean Rounded Box) -->
  <rect x="930" y="370" width="220" height="80" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="1040" y="405" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">2.5 Map Coordinates</text>
  <text x="1040" y="425" fill="#000000" font-size="11.5" text-anchor="middle">(X lateral, Y longitudinal)</text>

  <!-- 2.4 to 2.5 -->
  <line x1="1040" y1="270" x2="1040" y2="370" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="1045" y="312" width="85" height="18" fill="#ffffff" stroke="none"/>
  <text x="1050" y="325" fill="#000000" font-size="10.5">Unique Tracks</text>

  <!-- Process 2.6: ASTM 4-Point Grade Scoring (Clean Rounded Box) -->
  <rect x="630" y="370" width="220" height="80" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="740" y="405" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">2.6 Compute ASTM</text>
  <text x="740" y="425" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">4-Point Penalty Score</text>

  <!-- 2.5 to 2.6 -->
  <line x1="930" y1="410" x2="850" y2="410" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="855" y="392" width="70" height="16" fill="#ffffff" stroke="none"/>
  <text x="890" y="404" fill="#000000" font-size="10.5" text-anchor="middle">Dimensions</text>

  <!-- Data Store D1: Clean Standard Database Box (No nested cuts) -->
  <rect x="480" y="560" width="240" height="50" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="590" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">D1: Local SQLite Outbox</text>

  <!-- 2.2 (Uninspected) to D1 -->
  <line x1="420" y1="450" x2="420" y2="585" stroke="#000000" stroke-width="1.2"/>
  <line x1="420" y1="585" x2="480" y2="585" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="310" y="510" width="115" height="18" fill="#ffffff" stroke="none"/>
  <text x="365" y="523" fill="#000000" font-size="10.5">Uninspected Record</text>

  <!-- 2.6 (Scored Defect) to D1 -->
  <line x1="740" y1="450" x2="740" y2="585" stroke="#000000" stroke-width="1.2"/>
  <line x1="740" y1="585" x2="720" y2="585" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="745" y="510" width="130" height="18" fill="#ffffff" stroke="none"/>
  <text x="750" y="523" fill="#000000" font-size="10.5">Verified Defect Payload</text>

  <!-- Output to 3.0 Sync Process -->
  <rect x="510" y="690" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="600" y="725" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Process 3.0 (Sync)</text>

  <line x1="600" y1="610" x2="600" y2="690" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="605" y="645" width="80" height="18" fill="#ffffff" stroke="none"/>
  <text x="645" y="658" fill="#000000" font-size="10.5">Outbox Batch</text>

</svg>
