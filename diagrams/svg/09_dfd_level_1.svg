<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1450 970" style="background-color:#0b1120;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="hdr9" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><filter id="sh9" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".5" stdDeviation="6"/></filter><marker id="mB9" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#38bdf8" d="M0,0 L0,6 L9,3 z"/></marker><marker id="mG9" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#4ade80" d="M0,0 L0,6 L9,3 z"/></marker><marker id="mP9" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#c084fc" d="M0,0 L0,6 L9,3 z"/></marker><marker id="mR9" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#f87171" d="M0,0 L0,6 L9,3 z"/></marker></defs><g filter="url(#sh9)" transform="translate(100, 30)"><rect width="1250" height="70" fill="url(#hdr9)" stroke="#334155" stroke-width="1.5" rx="12"/><text x="625" y="32" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">TexEye AI — Level 1 Data Flow Diagram (DFD L1)</text><text x="625" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Detailed Sub-process Breakdown: Ingestion, AI Metrology, Persistence, Grading Engine &amp; User Hubs</text></g><g filter="url(#sh9)" transform="translate(60, 130)"><rect width="400" height="420" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="12"/><text x="25" y="28" fill="#38bdf8" font-size="13" font-weight="bold">1.0 HARDWARE INGESTION &amp; RELIABILITY DECOMPOSITION</text><rect width="350" height="70" x="25" y="45" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="15"/><text x="200" y="73" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">1.1 Frame Capture &amp; Buffer</text><text x="200" y="93" fill="#94a3b8" font-size="10" text-anchor="middle">V4L2/GenICam • Timestamp Ingestion</text><rect width="350" height="70" x="25" y="135" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="15"/><text x="200" y="163" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">1.2 Encoder Pulse Integration</text><text x="200" y="183" fill="#94a3b8" font-size="10" text-anchor="middle">Hardware GPIO Listener • Distance ΔL</text><rect width="350" height="85" x="25" y="225" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2" rx="15"/><text x="200" y="253" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">1.3 Reliability &amp; Quality Gate</text><text x="200" y="273" fill="#93c5fd" font-size="10" text-anchor="middle">Checks: Cam disconnect, Lighting, Focus Blur</text><text x="200" y="290" fill="#93c5fd" font-size="10" text-anchor="middle">Dropped-Frame Rate &amp; Speed Synchrony</text><rect width="350" height="70" x="25" y="330" fill="#450a0a" stroke="#ef4444" stroke-width="2" rx="15"/><text x="200" y="358" fill="#fca5a5" font-size="12" font-weight="bold" text-anchor="middle">1.4 Uninspected Span Calculator</text><text x="200" y="378" fill="#fecaca" font-size="10" text-anchor="middle">Flags [L1, L2] • Bypasses AI Model • Alerts Floor</text></g><path stroke="#38bdf8" stroke-width="1.5" d="M 235 245 L 235 355"/><path stroke="#f87171" stroke-width="2" marker-end="url(#mR9)" d="M 235 435 L 235 460"/><g filter="url(#sh9)" transform="translate(520, 130)"><rect width="420" height="420" fill="#0f172a" stroke="#c084fc" stroke-width="2" rx="12"/><text x="25" y="28" fill="#c084fc" font-size="13" font-weight="bold">2.0 AI VISION &amp; METROLOGY PIPELINE DECOMPOSITION</text><rect width="370" height="70" x="25" y="45" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="15"/><text x="210" y="73" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">2.1 ROI Conditioning &amp; CLAHE Normalization</text><text x="210" y="93" fill="#c084fc" font-size="10" text-anchor="middle">Fabric web edge detection &amp; contrast normalization</text><rect width="370" height="75" x="25" y="135" fill="#3b0764" stroke="#c084fc" stroke-width="2" rx="15"/><text x="210" y="163" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">2.2 Deep Learning Defect Detection</text><text x="210" y="183" fill="#f3e8ff" font-size="10" text-anchor="middle">YOLO Model • Confidence Filtering (≥ θ)</text><text x="210" y="197" fill="#e9d5ff" font-size="9" text-anchor="middle">Classes: Hole, Stain, Warp/Weft flaw, Float, Oil spot</text><rect width="370" height="75" x="25" y="230" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="15"/><text x="210" y="258" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">2.3 Multi-Frame Tracker &amp; Deduplication</text><text x="210" y="278" fill="#c084fc" font-size="10" text-anchor="middle">Kalman Filter • IoU Trajectory Association</text><text x="210" y="292" fill="#94a3b8" font-size="9" text-anchor="middle">Suppresses duplicate alerts for the same defect</text><rect width="370" height="75" x="25" y="325" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" rx="15"/><text x="210" y="353" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">2.4 Metric Coordinate Mapping (X_cm, Y_m)</text><text x="210" y="373" fill="#bbf7d0" font-size="10" text-anchor="middle">Longitudinal Y via Rotary Encoder Pulses</text><text x="210" y="388" fill="#86efac" font-size="9" text-anchor="middle">Lateral X via Camera Pixel-to-Fabric Ground Resolution</text></g><path stroke="#4ade80" stroke-width="2" marker-end="url(#mG9)" d="M 435 390 L 490 390 L 490 205 L 545 205"/><text x="440" y="195" fill="#4ade80" font-size="9" font-weight="bold">Clean Frames</text><g filter="url(#sh9)" transform="translate(980, 130)"><rect width="410" height="420" fill="#0f172a" stroke="#f59e0b" stroke-width="2" rx="12"/><text x="25" y="28" fill="#fbbf24" font-size="13" font-weight="bold">3.0 EDGE DATA STORAGE &amp; SYNC</text><rect width="360" height="100" x="25" y="45" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" rx="15"/><text x="205" y="75" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">3.1 Local Storage Writer &amp; Image Cache</text><text x="205" y="95" fill="#fde68a" font-size="10" text-anchor="middle">Writes defect rows &amp; uninspected spans to SQLite</text><text x="205" y="112" fill="#94a3b8" font-size="10" text-anchor="middle">Stores cropped JPEG snippets locally</text><text x="205" y="128" fill="#fbbf24" font-size="10" text-anchor="middle">Appends transaction to Offline Sync Queue</text><rect width="360" height="110" x="25" y="180" fill="#1e293b" stroke="#4ade80" stroke-width="2" rx="15"/><text x="205" y="210" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">3.2 Connectivity Probe &amp; Sync Dispatcher</text><text x="205" y="230" fill="#94a3b8" font-size="10" text-anchor="middle">Continuous HTTP ping / health watchdog</text><text x="205" y="248" fill="#bbf7d0" font-size="10" text-anchor="middle">On Connection: Batches N queued records</text><text x="205" y="266" fill="#86efac" font-size="10" text-anchor="middle">Dispatches HTTPS POST to Central API</text><rect width="360" height="85" x="25" y="315" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" rx="8"/><text x="205" y="345" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">D1: SQLite Database • D2: Outbox Table</text><text x="205" y="365" fill="#fde68a" font-size="10" text-anchor="middle">Atomic Local Commits (Zero latency on floor)</text><text x="205" y="382" fill="#fef3c7" font-size="9" text-anchor="middle">Guaranteed offline operation without factory stoppage</text></g><path stroke="#c084fc" stroke-width="2" marker-end="url(#mP9)" d="M 915 480 L 980 480 L 980 200 L 1005 200"/><g filter="url(#sh9)" transform="translate(100, 600)"><rect width="1250" height="340" fill="#0f172a" stroke="#4ade80" stroke-width="2" rx="12"/><text x="25" y="28" fill="#4ade80" font-size="14" font-weight="bold">4.0 &amp; 5.0 CENTRAL MANAGEMENT, GRADING &amp; USER PRESENTATION SERVICES</text><rect width="370" height="90" x="30" y="50" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="15"/><text x="215" y="78" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">4.1 Defect Review &amp; Correction Manager</text><text x="215" y="98" fill="#94a3b8" font-size="10" text-anchor="middle">Receives Inspector corrections from mobile/web</text><text x="215" y="115" fill="#4ade80" font-size="10" text-anchor="middle">Updates verified classification &amp; audit trail</text><rect width="370" height="90" x="440" y="50" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="15"/><text x="625" y="78" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">4.2 4-Point Fabric Grading Calculator</text><text x="625" y="98" fill="#94a3b8" font-size="10" text-anchor="middle">Points Penalty: 1, 2, 3, or 4 points per defect size</text><text x="625" y="115" fill="#4ade80" font-size="10" text-anchor="middle">Calculates Total Points per 100m² → Grade A / B / C / Scrap</text><rect width="370" height="90" x="850" y="50" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="15"/><text x="1035" y="78" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">4.3 Report &amp; Quality Statistics Engine</text><text x="1035" y="98" fill="#94a3b8" font-size="10" text-anchor="middle">Generates certified PDF Roll Inspection Certificates</text><text x="1035" y="115" fill="#4ade80" font-size="10" text-anchor="middle">Maintains Pareto defect frequency analytics</text><rect width="580" height="150" x="30" y="165" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="12"/><text x="320" y="195" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">5.1 Real-Time Alert &amp; Push Broadcaster</text><text x="320" y="218" fill="#94a3b8" font-size="11" text-anchor="middle">WebSocket stream to active floor clients</text><text x="320" y="238" fill="#fca5a5" font-size="11" text-anchor="middle">• Dispatches &quot;Uninspected Section Warning&quot; on sensor degraded</text><text x="320" y="258" fill="#fde68a" font-size="11" text-anchor="middle">• Dispatches &quot;Critical Defect Discovered&quot; vibration to mobile</text><text x="320" y="280" fill="#38bdf8" font-size="11" text-anchor="middle">• Updates floor status banners</text><rect width="580" height="150" x="640" y="165" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" rx="12"/><text x="930" y="195" fill="#c084fc" font-size="13" font-weight="bold" text-anchor="middle">5.2 Digital Fabric Defect Map Visualizer</text><text x="930" y="218" fill="#94a3b8" font-size="11" text-anchor="middle">Interactive 2D Roll Canvas (Web Dashboard)</text><text x="930" y="238" fill="#fff" font-size="11" text-anchor="middle">• Color-coded defect markers plotted at (X_cm, Y_m)</text><text x="930" y="258" fill="#fca5a5" font-size="11" text-anchor="middle">• Amber / Hashed bands clearly highlight UNINSPECTED spans</text><text x="930" y="280" fill="#bbf7d0" font-size="11" text-anchor="middle">• Zoom, filter by defect class, click to view defect image crop</text></g></svg>