<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1130" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="blueGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="greenGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="redGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4ade80"/></marker>
    <marker id="arR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f87171"/></marker>
  </defs>

  <!-- Title -->
  <g transform="translate(100, 30)" filter="url(#shadow3)">
    <rect width="1200" height="70" rx="12" fill="url(#headerGrad3)" stroke="#334155" stroke-width="1.5"/>
    <text x="600" y="32" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">TexEye AI &#8212; Resilient Offline / Online Data Synchronization Architecture</text>
    <text x="600" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Zero-Latency Edge Local Storage &#8226; Fault-Tolerant Outbox Queuing &#8226; Idempotent Central Ingestion</text>
  </g>

  <!-- Edge Event Source -->
  <g transform="translate(450, 130)" filter="url(#shadow3)">
    <rect width="500" height="50" rx="25" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="250" y="31" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">New Local Inspection Event Generated on Edge</text>
  </g>
  <path d="M 700 180 L 700 215" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arB)"/>

  <!-- Local Storage Container -->
  <g transform="translate(150, 220)" filter="url(#shadow3)">
    <rect width="1100" height="170" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="25" y="28" fill="#f59e0b" font-size="14" font-weight="bold">LOCAL EDGE STORAGE TIER (ALWAYS RUNNING &#8226; ZERO INTERNET DEPENDENCY)</text>

    <!-- SQLite Box -->
    <rect x="30" y="45" width="320" height="100" rx="8" fill="url(#amberGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="190" y="75" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Local SQLite DB</text>
    <text x="190" y="98" fill="#fde68a" font-size="11" text-anchor="middle">Insert Defect / Uninspected Record</text>
    <text x="190" y="118" fill="#fef3c7" font-size="11" text-anchor="middle">sync_status = 'PENDING'</text>

    <!-- NVMe Image Cache -->
    <rect x="390" y="45" width="320" height="100" rx="8" fill="url(#amberGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="550" y="75" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Local NVMe Image Cache</text>
    <text x="550" y="98" fill="#fde68a" font-size="11" text-anchor="middle">Save Defect Snippet / High-Res Crop</text>
    <text x="550" y="118" fill="#fef3c7" font-size="11" text-anchor="middle">Ring-buffer storage cap</text>

    <!-- Outbox Queue -->
    <rect x="750" y="45" width="320" height="100" rx="8" fill="url(#amberGrad)" stroke="#f59e0b" stroke-width="2"/>
    <text x="910" y="75" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Offline Sync Outbox Queue</text>
    <text x="910" y="98" fill="#fde68a" font-size="11" text-anchor="middle">FIFO Transaction Log Entry</text>
    <text x="910" y="118" fill="#fef3c7" font-size="11" text-anchor="middle">Immutable UUIDv4 + Checksum</text>
  </g>
  <path d="M 700 390 L 700 425" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arB)"/>

  <!-- Decision Gate: Network Connectivity -->
  <g transform="translate(525, 430)" filter="url(#shadow3)">
    <polygon points="175,0 350,65 175,130 0,65" fill="url(#blueGrad3)" stroke="#38bdf8" stroke-width="2"/>
    <text x="175" y="55" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Central Backend</text>
    <text x="175" y="75" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Reachable?</text>
    <text x="175" y="95" fill="#93c5fd" font-size="10" text-anchor="middle">Ping / HTTPS Heartbeat Probe</text>
  </g>

  <!-- Left: Offline Route -->
  <path d="M 525 495 L 340 495" stroke="#f87171" stroke-width="2.5" marker-end="url(#arR)"/>
  <text x="390" y="485" fill="#f87171" font-size="12" font-weight="bold">NO (Outage)</text>

  <g transform="translate(80, 530)" filter="url(#shadow3)">
    <rect width="360" height="170" rx="10" fill="url(#redGrad3)" stroke="#ef4444" stroke-width="2"/>
    <text x="180" y="30" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">INTERNET OUTAGE STATE</text>
    
    <rect x="20" y="45" width="320" height="40" rx="6" fill="#450a0a"/>
    <text x="180" y="68" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="middle">1. Inspection continues unhindered!</text>

    <rect x="20" y="95" width="320" height="55" rx="6" fill="#450a0a"/>
    <text x="180" y="117" fill="#fecaca" font-size="10" text-anchor="middle">2. Accumulate in local SQLite outbox.</text>
    <text x="180" y="135" fill="#fecaca" font-size="10" text-anchor="middle">Heartbeat worker polls with exponential backoff.</text>
  </g>

  <!-- Right: Online Route -->
  <path d="M 875 495 L 1000 495" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arG)"/>
  <text x="910" y="485" fill="#4ade80" font-size="12" font-weight="bold">YES (Online)</text>

  <!-- Online Sync Pipeline (Right side) -->
  <g transform="translate(550, 600)" filter="url(#shadow3)">
    <rect width="750" height="360" rx="12" fill="#0f172a" stroke="#4ade80" stroke-width="2"/>
    <text x="25" y="28" fill="#4ade80" font-size="14" font-weight="bold">ONLINE TRANSMISSION &amp; CENTRAL INGESTION PIPELINE</text>

    <!-- Batch Pack -->
    <rect x="30" y="50" width="690" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="375" y="73" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">1. Edge Sync Daemon Fetches Pending Batch</text>
    <text x="375" y="93" fill="#94a3b8" font-size="11" text-anchor="middle">Queries: SELECT * FROM sync_queue WHERE status = 'PENDING' LIMIT 50</text>

    <!-- Encrypted POST -->
    <rect x="30" y="120" width="690" height="55" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="375" y="143" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">2. HTTPS POST /api/v1/sync/batch (TLS 1.3 + HMAC Checksum)</text>
    <text x="375" y="163" fill="#94a3b8" font-size="11" text-anchor="middle">Transmits JSON record payload + Multipart JPEG Defect Snippets</text>

    <!-- Central DB Ingest -->
    <rect x="30" y="190" width="690" height="85" rx="8" fill="url(#greenGrad3)" stroke="#4ade80" stroke-width="1.5"/>
    <text x="375" y="215" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">3. Central Backend Atomic Ingestion</text>
    <text x="375" y="238" fill="#bbf7d0" font-size="11" text-anchor="middle">&#8226; PostgreSQL Upsert with UUID Idempotency (Prevents duplicates)</text>
    <text x="375" y="258" fill="#bbf7d0" font-size="11" text-anchor="middle">&#8226; Stream Defect Images into Cloud Object Storage (MinIO / S3)</text>

    <!-- Acknowledgment -->
    <rect x="30" y="290" width="690" height="50" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="375" y="312" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">4. Return HTTP 200 OK + Synced IDs Confirmation</text>
    <text x="375" y="328" fill="#86efac" font-size="10" text-anchor="middle">Edge marks local queue rows as 'SYNCED' &amp; clears uploaded images</text>
  </g>

  <!-- Reconnect link from offline box to batch pack -->
  <path d="M 260 700 L 260 800 L 540 800" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arB)"/>
  <text x="310" y="790" fill="#f59e0b" font-size="11" font-weight="bold">Auto-Sync on Link Recovery</text>

  <!-- Downstream Real-time Notification -->
  <path d="M 925 960 L 925 1010" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arG)"/>

  <g transform="translate(350, 1015)" filter="url(#shadow3)">
    <rect width="800" height="85" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="400" y="32" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Real-Time Downstream Notification Distribution</text>
    <text x="400" y="55" fill="#f8fafc" font-size="12" text-anchor="middle">WebSocket broadcasts live coordinates to Web Defect Map</text>
    <text x="400" y="73" fill="#94a3b8" font-size="11" text-anchor="middle">FCM pushes critical alerts to Floor Operator &amp; Inspector Mobile Apps</text>
  </g>

</svg>




