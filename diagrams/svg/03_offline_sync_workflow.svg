<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
  </defs>

  <!-- Academic Double Frame -->
  <rect x="15" y="15" width="970" height="1220" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="960" height="1210" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="500" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 2.3: Offline Buffering and Synchronization Workflow</text>
  <line x1="50" y1="62" x2="950" y2="62" stroke="#cccccc" stroke-width="1"/>

  <!-- Start Symbol -->
  <circle cx="500" cy="95" r="14" fill="#000000" stroke="#000000" stroke-width="1.5"/>

  <!-- Step 1: Query Local Outbox -->
  <line x1="500" y1="109" x2="500" y2="135" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="135" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="161" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Query Pending Batches from Outbox</text>

  <!-- Step 2: Send Heartbeat -->
  <line x1="500" y1="177" x2="500" y2="205" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="205" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="231" fill="#000000" font-size="12" text-anchor="middle">Send Health Heartbeat to Central API</text>

  <!-- Decision 1: Server Reachable? -->
  <line x1="500" y1="247" x2="500" y2="275" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <polygon points="500 275, 630 310, 500 345, 370 310" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="314" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Server Reachable?</text>

  <!-- [No] Branch: Backoff loop -->
  <line x1="370" y1="310" x2="230" y2="310" stroke="#000000" stroke-width="1.2"/>
  <line x1="230" y1="310" x2="230" y2="355" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="300" y="302" fill="#000000" font-size="11" font-weight="bold">No</text>

  <rect x="110" y="355" width="240" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="230" y="381" fill="#000000" font-size="12" text-anchor="middle">Increment Retry Counter</text>

  <line x1="230" y1="397" x2="230" y2="425" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="110" y="425" width="240" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="230" y="451" fill="#000000" font-size="12" text-anchor="middle">Apply Exponential Backoff Delay</text>

  <!-- Loop back to Heartbeat -->
  <line x1="110" y1="446" x2="70" y2="446" stroke="#000000" stroke-width="1.2"/>
  <line x1="70" y1="446" x2="70" y2="226" stroke="#000000" stroke-width="1.2"/>
  <line x1="70" y1="226" x2="360" y2="226" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- [Yes] Branch: Transmit Batch -->
  <line x1="500" y1="345" x2="500" y2="380" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="510" y="365" fill="#000000" font-size="11" font-weight="bold">Yes</text>

  <rect x="360" y="380" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="406" fill="#000000" font-size="12" text-anchor="middle">Serialize Batch (JSON &amp; JPEG Crops)</text>

  <line x1="500" y1="422" x2="500" y2="450" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="450" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="476" fill="#000000" font-size="12" text-anchor="middle">Transmit Batch via HTTPS REST</text>

  <!-- Step: Server Processing -->
  <line x1="500" y1="492" x2="500" y2="520" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="520" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="546" fill="#000000" font-size="12" text-anchor="middle">Central Server Validates &amp; Ingests Data</text>

  <!-- Decision 2: Ingestion Succeeded? -->
  <line x1="500" y1="562" x2="500" y2="590" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <polygon points="500 590, 630 625, 500 660, 370 625" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="629" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">HTTP 200 Received?</text>

  <!-- [No] Ingestion Failed -->
  <line x1="370" y1="625" x2="230" y2="625" stroke="#000000" stroke-width="1.2"/>
  <line x1="230" y1="625" x2="230" y2="670" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="300" y="617" fill="#000000" font-size="11" font-weight="bold">No</text>

  <rect x="110" y="670" width="240" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="230" y="696" fill="#000000" font-size="12" text-anchor="middle">Log Ingestion Failure &amp; Requeue</text>

  <!-- Loop back from failed to delay -->
  <line x1="230" y1="712" x2="230" y2="740" stroke="#000000" stroke-width="1.2"/>
  <line x1="230" y1="740" x2="50" y2="740" stroke="#000000" stroke-width="1.2"/>
  <line x1="50" y1="740" x2="50" y2="446" stroke="#000000" stroke-width="1.2"/>
  <line x1="50" y1="446" x2="110" y2="446" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- [Yes] Ingestion Succeeded -->
  <line x1="500" y1="660" x2="500" y2="695" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="510" y="680" fill="#000000" font-size="11" font-weight="bold">Yes</text>

  <rect x="360" y="695" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="721" fill="#000000" font-size="12" text-anchor="middle">Mark Outbox Records as Synced</text>

  <line x1="500" y1="737" x2="500" y2="765" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="765" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="791" fill="#000000" font-size="12" text-anchor="middle">Evict Synced Images from Local Cache</text>

  <line x1="500" y1="807" x2="500" y2="835" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="835" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="861" fill="#000000" font-size="12" text-anchor="middle">Update Central Defect Map &amp; Inventory</text>

  <!-- Decision 3: Remaining Batches in Outbox? -->
  <line x1="500" y1="877" x2="500" y2="905" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <polygon points="500 905, 630 940, 500 975, 370 940" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="944" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Pending Records Remain?</text>

  <!-- [Yes] Loop back to step 1 -->
  <line x1="630" y1="940" x2="770" y2="940" stroke="#000000" stroke-width="1.2"/>
  <line x1="770" y1="940" x2="770" y2="156" stroke="#000000" stroke-width="1.2"/>
  <line x1="770" y1="156" x2="640" y2="156" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="660" y="932" fill="#000000" font-size="11" font-weight="bold">Yes</text>

  <!-- [No] Standby State -->
  <line x1="500" y1="975" x2="500" y2="1010" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="510" y="995" fill="#000000" font-size="11" font-weight="bold">No</text>

  <rect x="360" y="1010" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="1036" fill="#000000" font-size="12" text-anchor="middle">Transition Sync Worker to Idle Sleep</text>

  <!-- End Node -->
  <line x1="500" y1="1052" x2="500" y2="1085" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <circle cx="500" cy="1105" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <circle cx="500" cy="1105" r="8" fill="#000000"/>
</svg>
