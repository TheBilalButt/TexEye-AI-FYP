<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1400 1130" style="background-color:#0b1120;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="headerGrad3" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="amberGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#451a03"/></linearGradient><linearGradient id="blueGrad3" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="greenGrad3" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#15803d"/><stop offset="100%" stop-color="#052e16"/></linearGradient><linearGradient id="redGrad3" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#b91c1c"/><stop offset="100%" stop-color="#450a0a"/></linearGradient><filter id="shadow3" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".5" stdDeviation="6"/></filter><marker id="arB" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#38bdf8" d="M0,0 L0,6 L9,3 z"/></marker><marker id="arG" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#4ade80" d="M0,0 L0,6 L9,3 z"/></marker><marker id="arR" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#f87171" d="M0,0 L0,6 L9,3 z"/></marker></defs><g filter="url(#shadow3)" transform="translate(100, 30)"><rect width="1200" height="70" fill="url(#headerGrad3)" stroke="#334155" stroke-width="1.5" rx="12"/><text x="600" y="32" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">TexEye AI — Resilient Offline / Online Data Synchronization Architecture</text><text x="600" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Zero-Latency Edge Local Storage • Fault-Tolerant Outbox Queuing • Idempotent Central Ingestion</text></g><g filter="url(#shadow3)" transform="translate(450, 130)"><rect width="500" height="50" fill="#0284c7" stroke="#38bdf8" stroke-width="2" rx="25"/><text x="250" y="31" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">New Local Inspection Event Generated on Edge</text></g><path stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arB)" d="M 700 180 L 700 215"/><g filter="url(#shadow3)" transform="translate(150, 220)"><rect width="1100" height="170" fill="#0f172a" stroke="#f59e0b" stroke-width="2" rx="12"/><text x="25" y="28" fill="#f59e0b" font-size="14" font-weight="bold">LOCAL EDGE STORAGE TIER (ALWAYS RUNNING • ZERO INTERNET DEPENDENCY)</text><rect width="320" height="100" x="30" y="45" fill="url(#amberGrad)" stroke="#f59e0b" stroke-width="1.5" rx="8"/><text x="190" y="75" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Local SQLite DB</text><text x="190" y="98" fill="#fde68a" font-size="11" text-anchor="middle">Insert Defect / Uninspected Record</text><text x="190" y="118" fill="#fef3c7" font-size="11" text-anchor="middle">sync_status = &apos;PENDING&apos;</text><rect width="320" height="100" x="390" y="45" fill="url(#amberGrad)" stroke="#f59e0b" stroke-width="1.5" rx="8"/><text x="550" y="75" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Local NVMe Image Cache</text><text x="550" y="98" fill="#fde68a" font-size="11" text-anchor="middle">Save Defect Snippet / High-Res Crop</text><text x="550" y="118" fill="#fef3c7" font-size="11" text-anchor="middle">Ring-buffer storage cap</text><rect width="320" height="100" x="750" y="45" fill="url(#amberGrad)" stroke="#f59e0b" stroke-width="2" rx="8"/><text x="910" y="75" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Offline Sync Outbox Queue</text><text x="910" y="98" fill="#fde68a" font-size="11" text-anchor="middle">FIFO Transaction Log Entry</text><text x="910" y="118" fill="#fef3c7" font-size="11" text-anchor="middle">Immutable UUIDv4 + Checksum</text></g><path stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arB)" d="M 700 390 L 700 425"/><g filter="url(#shadow3)" transform="translate(525, 430)"><polygon fill="url(#blueGrad3)" stroke="#38bdf8" stroke-width="2" points="175 0 350 65 175 130 0 65"/><text x="175" y="55" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Central Backend</text><text x="175" y="75" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Reachable?</text><text x="175" y="95" fill="#93c5fd" font-size="10" text-anchor="middle">Ping / HTTPS Heartbeat Probe</text></g><path stroke="#f87171" stroke-width="2.5" marker-end="url(#arR)" d="M 525 495 L 340 495"/><text x="390" y="485" fill="#f87171" font-size="12" font-weight="bold">NO (Outage)</text><g filter="url(#shadow3)" transform="translate(80, 530)"><rect width="360" height="170" fill="url(#redGrad3)" stroke="#ef4444" stroke-width="2" rx="10"/><text x="180" y="30" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">INTERNET OUTAGE STATE</text><rect width="320" height="40" x="20" y="45" fill="#450a0a" rx="6"/><text x="180" y="68" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="middle">1. Inspection continues unhindered!</text><rect width="320" height="55" x="20" y="95" fill="#450a0a" rx="6"/><text x="180" y="117" fill="#fecaca" font-size="10" text-anchor="middle">2. Accumulate in local SQLite outbox.</text><text x="180" y="135" fill="#fecaca" font-size="10" text-anchor="middle">Heartbeat worker polls with exponential backoff.</text></g><path stroke="#4ade80" stroke-width="2.5" marker-end="url(#arG)" d="M 875 495 L 1000 495"/><text x="910" y="485" fill="#4ade80" font-size="12" font-weight="bold">YES (Online)</text><g filter="url(#shadow3)" transform="translate(550, 600)"><rect width="750" height="360" fill="#0f172a" stroke="#4ade80" stroke-width="2" rx="12"/><text x="25" y="28" fill="#4ade80" font-size="14" font-weight="bold">ONLINE TRANSMISSION &amp; CENTRAL INGESTION PIPELINE</text><rect width="690" height="55" x="30" y="50" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="8"/><text x="375" y="73" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">1. Edge Sync Daemon Fetches Pending Batch</text><text x="375" y="93" fill="#94a3b8" font-size="11" text-anchor="middle">Queries: SELECT * FROM sync_queue WHERE status = &apos;PENDING&apos; LIMIT 50</text><rect width="690" height="55" x="30" y="120" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8"/><text x="375" y="143" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">2. HTTPS POST /api/v1/sync/batch (TLS 1.3 + HMAC Checksum)</text><text x="375" y="163" fill="#94a3b8" font-size="11" text-anchor="middle">Transmits JSON record payload + Multipart JPEG Defect Snippets</text><rect width="690" height="85" x="30" y="190" fill="url(#greenGrad3)" stroke="#4ade80" stroke-width="1.5" rx="8"/><text x="375" y="215" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">3. Central Backend Atomic Ingestion</text><text x="375" y="238" fill="#bbf7d0" font-size="11" text-anchor="middle">• PostgreSQL Upsert with UUID Idempotency (Prevents duplicates)</text><text x="375" y="258" fill="#bbf7d0" font-size="11" text-anchor="middle">• Stream Defect Images into Cloud Object Storage (MinIO / S3)</text><rect width="690" height="50" x="30" y="290" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" rx="8"/><text x="375" y="312" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">4. Return HTTP 200 OK + Synced IDs Confirmation</text><text x="375" y="328" fill="#86efac" font-size="10" text-anchor="middle">Edge marks local queue rows as &apos;SYNCED&apos; &amp; clears uploaded images</text></g><path stroke="#f59e0b" stroke-dasharray="4 2" stroke-width="2" marker-end="url(#arB)" d="M 260 700 L 260 800 L 540 800"/><text x="310" y="790" fill="#f59e0b" font-size="11" font-weight="bold">Auto-Sync on Link Recovery</text><path stroke="#4ade80" stroke-width="2.5" marker-end="url(#arG)" d="M 925 960 L 925 1010"/><g filter="url(#shadow3)" transform="translate(350, 1015)"><rect width="800" height="85" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="12"/><text x="400" y="32" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Real-Time Downstream Notification Distribution</text><text x="400" y="55" fill="#f8fafc" font-size="12" text-anchor="middle">WebSocket broadcasts live coordinates to Web Defect Map</text><text x="400" y="73" fill="#94a3b8" font-size="11" text-anchor="middle">FCM pushes critical alerts to Floor Operator &amp; Inspector Mobile Apps</text></g></svg>