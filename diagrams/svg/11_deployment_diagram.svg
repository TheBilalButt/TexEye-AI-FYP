<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 900" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
    <marker id="arrowRev" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <polygon points="8 0, 0 4, 8 8" fill="#000000"/>
    </marker>
  </defs>

  <!-- Academic Double Frame -->
  <rect x="15" y="15" width="1320" height="870" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1310" height="860" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="675" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 5.3: UML Deployment Diagram of TexEye AI</text>
  <line x1="50" y1="62" x2="1300" y2="62" stroke="#cccccc" stroke-width="1"/>

  <!-- NODE 1: Stand Device -->
  <rect x="50" y="90" width="320" height="350" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="75" y="115" fill="#444444" font-size="10" font-weight="bold">&lt;&lt;device&gt;&gt;</text>
  <text x="75" y="132" fill="#000000" font-size="12.5" font-weight="bold">Fabric Inspection Stand</text>
  <line x1="50" y1="140" x2="370" y2="140" stroke="#000000" stroke-width="0.8"/>

  <rect x="75" y="155" width="270" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="210" y="180" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;sensor&gt;&gt;</text>
  <text x="210" y="198" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Industrial Camera (Area-Scan)</text>

  <rect x="75" y="225" width="270" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="210" y="250" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;sensor&gt;&gt;</text>
  <text x="210" y="268" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Rotary Encoder (Quadrature)</text>

  <rect x="75" y="295" width="270" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="210" y="320" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;actuator&gt;&gt;</text>
  <text x="210" y="338" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Stack Light &amp; Buzzer Relay</text>

  <rect x="75" y="365" width="270" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="210" y="390" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;hardware&gt;&gt;</text>
  <text x="210" y="408" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">LED Constant-Current Rig</text>


  <!-- NODE 2: Industrial Edge Computer -->
  <rect x="490" y="90" width="370" height="530" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="515" y="115" fill="#444444" font-size="10" font-weight="bold">&lt;&lt;device&gt;&gt;</text>
  <text x="515" y="132" fill="#000000" font-size="12.5" font-weight="bold">Industrial Edge Computer (Linux)</text>
  <line x1="490" y1="140" x2="860" y2="140" stroke="#000000" stroke-width="0.8"/>

  <!-- Inside Edge: Execution Environments -->
  <rect x="515" y="155" width="320" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="675" y="180" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;process&gt;&gt;</text>
  <text x="675" y="200" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">texeye-capture-daemon</text>
  <text x="675" y="215" fill="#444444" font-size="10" text-anchor="middle">V4L2 &amp; Reliability Gate</text>

  <rect x="515" y="245" width="320" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="675" y="270" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;process&gt;&gt;</text>
  <text x="675" y="290" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">texeye-ai-inference</text>
  <text x="675" y="305" fill="#444444" font-size="10" text-anchor="middle">YOLO &amp; Multi-Frame Tracker</text>

  <rect x="515" y="335" width="320" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="675" y="360" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;process&gt;&gt;</text>
  <text x="675" y="380" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">texeye-sync-agent</text>
  <text x="675" y="395" fill="#444444" font-size="10" text-anchor="middle">Outbox Dispatcher</text>

  <rect x="515" y="425" width="320" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="675" y="450" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;database&gt;&gt;</text>
  <text x="675" y="470" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">SQLite Local Database (WAL)</text>

  <rect x="515" y="505" width="320" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="675" y="530" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;file system&gt;&gt;</text>
  <text x="675" y="548" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Local Image Crop Buffer</text>


  <!-- Physical Links: Stand to Edge -->
  <line x1="345" y1="182" x2="515" y2="182" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="430" y="174" fill="#000000" font-size="9.5" font-weight="bold" text-anchor="middle">USB 3.0 / GigE</text>

  <line x1="345" y1="252" x2="515" y2="200" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="430" y="240" fill="#000000" font-size="9.5" font-weight="bold" text-anchor="middle">GPIO Pulses</text>

  <line x1="515" y1="218" x2="345" y2="322" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="430" y="295" fill="#000000" font-size="9.5" font-weight="bold" text-anchor="middle">Relay Trigger</text>


  <!-- NODE 3: Central Cloud Server -->
  <rect x="970" y="90" width="330" height="530" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="995" y="115" fill="#444444" font-size="10" font-weight="bold">&lt;&lt;device&gt;&gt;</text>
  <text x="995" y="132" fill="#000000" font-size="12.5" font-weight="bold">Central Cloud Server (Linux)</text>
  <line x1="970" y1="140" x2="1300" y2="140" stroke="#000000" stroke-width="0.8"/>

  <rect x="995" y="155" width="280" height="80" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1135" y="180" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;container&gt;&gt;</text>
  <text x="1135" y="200" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">FastAPI Application Server</text>
  <text x="1135" y="218" fill="#444444" font-size="10" text-anchor="middle">REST Ingestion &amp; WebSocket Hub</text>

  <rect x="995" y="260" width="280" height="75" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1135" y="285" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;database&gt;&gt;</text>
  <text x="1135" y="305" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">PostgreSQL Database</text>
  <text x="1135" y="322" fill="#444444" font-size="10" text-anchor="middle">Rolls, Defects &amp; Audit Logs</text>

  <rect x="995" y="360" width="280" height="75" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1135" y="385" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;storage&gt;&gt;</text>
  <text x="1135" y="405" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">MinIO / S3 Object Storage</text>
  <text x="1135" y="422" fill="#444444" font-size="10" text-anchor="middle">Defect Image Crops Archive</text>


  <!-- Network Link: Edge to Cloud -->
  <line x1="835" y1="370" x2="995" y2="195" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="880" y="270" width="105" height="24" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="932" y="286" fill="#000000" font-size="9.5" font-weight="bold" text-anchor="middle">HTTPS REST</text>


  <!-- NODE 4: Management Workstation (PC / Laptop) -->
  <rect x="490" y="690" width="370" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="515" y="715" fill="#444444" font-size="10" font-weight="bold">&lt;&lt;device&gt;&gt;</text>
  <text x="515" y="732" fill="#000000" font-size="12.5" font-weight="bold">Management Workstation (PC / Laptop)</text>
  <line x1="490" y1="740" x2="860" y2="740" stroke="#000000" stroke-width="0.8"/>

  <rect x="525" y="755" width="300" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="675" y="780" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;client artifact&gt;&gt;</text>
  <text x="675" y="800" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Web Browser (React Dashboard)</text>


  <!-- NODE 5: Shop Floor Mobile Device -->
  <rect x="970" y="690" width="330" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="995" y="715" fill="#444444" font-size="10" font-weight="bold">&lt;&lt;device&gt;&gt;</text>
  <text x="995" y="732" fill="#000000" font-size="12.5" font-weight="bold">Shop Floor Mobile Device</text>
  <line x1="970" y1="740" x2="1300" y2="740" stroke="#000000" stroke-width="0.8"/>

  <rect x="995" y="755" width="280" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1135" y="780" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;client artifact&gt;&gt;</text>
  <text x="1135" y="800" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Shop Floor Mobile App</text>


  <!-- Central Server to Clients -->
  <line x1="1040" y1="235" x2="720" y2="755" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrowRev)"/>
  <text x="890" y="650" fill="#000000" font-size="10" font-weight="bold">HTTPS / WSS</text>

  <line x1="1135" y1="235" x2="1135" y2="755" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrowRev)"/>
  <text x="1145" y="650" fill="#000000" font-size="10" font-weight="bold">WSS / Push</text>

</svg>
