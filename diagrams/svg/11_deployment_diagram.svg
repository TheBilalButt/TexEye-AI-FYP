<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 900" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
    <marker id="arrowRev" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <polygon points="8 0, 0 4, 8 8" fill="#000000"/>
    </marker>
  </defs>

  <!-- Academic Double Frame (ReDez SRDS Standard) -->
  <rect x="15" y="15" width="1320" height="870" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1310" height="860" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="675" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 5.3: UML Deployment Diagram of TexEye AI</text>
  <line x1="50" y1="62" x2="1300" y2="62" stroke="#cccccc" stroke-width="1"/>


  <!-- ==================== TIER 1: SHOP FLOOR PHYSICAL HARDWARE STAND ==================== -->
  <rect x="50" y="90" width="320" height="530" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="75" y="115" fill="#444444" font-size="10" font-weight="bold">&lt;&lt;device&gt;&gt;</text>
  <text x="75" y="132" fill="#000000" font-size="12.5" font-weight="bold">Fabric Inspection Stand</text>
  <line x1="50" y1="140" x2="370" y2="140" stroke="#000000" stroke-width="0.8"/>

  <!-- Camera -->
  <rect x="75" y="155" width="270" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="210" y="178" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;sensor&gt;&gt;</text>
  <text x="210" y="196" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Industrial Area-Scan Camera</text>

  <!-- Rotary Encoder -->
  <rect x="75" y="235" width="270" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="210" y="258" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;sensor&gt;&gt;</text>
  <text x="210" y="276" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Rotary Optical Encoder</text>

  <!-- Stack Light & Buzzer Relay -->
  <rect x="75" y="315" width="270" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="210" y="338" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;actuator&gt;&gt;</text>
  <text x="210" y="356" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Stack Light &amp; Warning Buzzer</text>

  <!-- Constant-Current LED Rig -->
  <rect x="75" y="395" width="270" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="210" y="418" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;hardware&gt;&gt;</text>
  <text x="210" y="436" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Constant-Current LED Lighting Rig</text>


  <!-- ==================== TIER 2: INDUSTRIAL EDGE COMPUTER (LINUX) ==================== -->
  <rect x="490" y="90" width="370" height="530" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="515" y="115" fill="#444444" font-size="10" font-weight="bold">&lt;&lt;device&gt;&gt;</text>
  <text x="515" y="132" fill="#000000" font-size="12.5" font-weight="bold">Industrial Edge Controller (Linux)</text>
  <line x1="490" y1="140" x2="860" y2="140" stroke="#000000" stroke-width="0.8"/>

  <!-- Service 1: Camera Capture Service (Horizontal with Camera) -->
  <rect x="515" y="155" width="320" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="675" y="178" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;service&gt;&gt;</text>
  <text x="675" y="196" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Camera Frame Capture Service</text>

  <!-- Service 2: Encoder Displacement Service (Horizontal with Encoder) -->
  <rect x="515" y="235" width="320" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="675" y="258" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;service&gt;&gt;</text>
  <text x="675" y="276" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Encoder Displacement Service</text>

  <!-- Service 3: Alarm Relay Controller (Horizontal with Stack Light) -->
  <rect x="515" y="315" width="320" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="675" y="338" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;service&gt;&gt;</text>
  <text x="675" y="356" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Alarm Relay Controller Service</text>

  <!-- Service 4: AI Inference & Tracker -->
  <rect x="515" y="395" width="320" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="675" y="416" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;service&gt;&gt;</text>
  <text x="675" y="434" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">YOLO Defect Detector &amp; Tracker</text>

  <!-- Service 5: Outbox Sync Service -->
  <rect x="515" y="465" width="320" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="675" y="486" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;service&gt;&gt;</text>
  <text x="675" y="504" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Cloud Sync Outbox Service</text>

  <!-- Local Database & Storage -->
  <rect x="515" y="535" width="320" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="675" y="555" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;database &amp; local buffer&gt;&gt;</text>
  <text x="675" y="573" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Local SQLite Outbox DB + Image Crops</text>


  <!-- ==================== STAND TO EDGE: CLEAN PARALLEL HORIZONTAL FLOWS ==================== -->

  <!-- Flow 1: Camera to Capture Service (Horizontal) -->
  <line x1="345" y1="185" x2="515" y2="185" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="430" y="176" fill="#000000" font-size="9.5" font-weight="bold" text-anchor="middle">USB 3.0 / GigE</text>

  <!-- Flow 2: Rotary Encoder to Encoder Service (Horizontal) -->
  <line x1="345" y1="265" x2="515" y2="265" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="430" y="256" fill="#000000" font-size="9.5" font-weight="bold" text-anchor="middle">GPIO Pulses</text>

  <!-- Flow 3: Relay Controller to Stack Light (Horizontal) -->
  <line x1="515" y1="345" x2="345" y2="345" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="430" y="336" fill="#000000" font-size="9.5" font-weight="bold" text-anchor="middle">Relay Trigger</text>


  <!-- ==================== TIER 3: CENTRAL CLOUD SERVER (LINUX) ==================== -->
  <rect x="970" y="90" width="330" height="530" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="995" y="115" fill="#444444" font-size="10" font-weight="bold">&lt;&lt;device&gt;&gt;</text>
  <text x="995" y="132" fill="#000000" font-size="12.5" font-weight="bold">Central Cloud Server (Linux)</text>
  <line x1="970" y1="140" x2="1300" y2="140" stroke="#000000" stroke-width="0.8"/>

  <!-- FastAPI -->
  <rect x="995" y="155" width="280" height="85" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1135" y="180" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;application server&gt;&gt;</text>
  <text x="1135" y="200" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">FastAPI Application Server</text>
  <text x="1135" y="218" fill="#444444" font-size="10" text-anchor="middle">REST Ingestion &amp; WebSocket Hub</text>

  <!-- PostgreSQL Central DB -->
  <rect x="995" y="265" width="280" height="85" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1135" y="290" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;database&gt;&gt;</text>
  <text x="1135" y="310" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">PostgreSQL Central Database</text>
  <text x="1135" y="328" fill="#444444" font-size="10" text-anchor="middle">Rolls, Defect Records &amp; Audit Logs</text>

  <!-- MinIO / S3 -->
  <rect x="995" y="375" width="280" height="85" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1135" y="400" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;storage&gt;&gt;</text>
  <text x="1135" y="420" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">MinIO / S3 Object Storage</text>
  <text x="1135" y="438" fill="#444444" font-size="10" text-anchor="middle">Defect Image Crops Archive</text>


  <!-- ==================== EDGE TO CLOUD: CLEAN HORIZONTAL SYNC ==================== -->
  <line x1="860" y1="197" x2="995" y2="197" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="927" y="187" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">HTTPS REST</text>


  <!-- ==================== TIER 4: CLIENT NODES (BOTTOM) ==================== -->

  <!-- Node 4: Shop Floor Mobile Device (Directly beneath Edge Controller) -->
  <rect x="490" y="680" width="370" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="515" y="705" fill="#444444" font-size="10" font-weight="bold">&lt;&lt;device&gt;&gt;</text>
  <text x="515" y="722" fill="#000000" font-size="12.5" font-weight="bold">Shop Floor Mobile Terminal</text>
  <line x1="490" y1="730" x2="860" y2="730" stroke="#000000" stroke-width="0.8"/>

  <rect x="525" y="745" width="300" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="675" y="770" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;client artifact&gt;&gt;</text>
  <text x="675" y="790" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Floor Inspection Mobile App</text>

  <!-- Straight Vertical Link: Edge to Mobile -->
  <line x1="675" y1="620" x2="675" y2="680" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrowRev)"/>
  <text x="685" y="655" fill="#000000" font-size="10" font-weight="bold" text-anchor="start">Wi-Fi / LAN (Zero-Latency Alerts)</text>


  <!-- Node 5: Quality Workstation (Directly beneath Cloud Server) -->
  <rect x="970" y="680" width="330" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="995" y="705" fill="#444444" font-size="10" font-weight="bold">&lt;&lt;device&gt;&gt;</text>
  <text x="995" y="722" fill="#000000" font-size="12.5" font-weight="bold">Quality &amp; Management Workstation</text>
  <line x1="970" y1="730" x2="1300" y2="730" stroke="#000000" stroke-width="0.8"/>

  <rect x="995" y="745" width="280" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1135" y="770" fill="#444444" font-size="9.5" text-anchor="middle">&lt;&lt;client artifact&gt;&gt;</text>
  <text x="1135" y="790" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Web Browser (React Dashboard)</text>

  <!-- Straight Vertical Link: Cloud to Workstation -->
  <line x1="1135" y1="620" x2="1135" y2="680" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrowRev)"/>
  <text x="1145" y="655" fill="#000000" font-size="10" font-weight="bold" text-anchor="start">HTTPS / WSS (Web Analytics)</text>

</svg>