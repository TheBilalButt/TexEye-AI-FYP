<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1200" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="hdr11" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <filter id="sh11" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/></filter>
    <marker id="mG11" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4ade80"/></marker>
    <marker id="mB11" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
  </defs>

  <!-- Title -->
  <g transform="translate(100, 30)" filter="url(#sh11)">
    <rect width="1250" height="70" rx="12" fill="url(#hdr11)" stroke="#334155" stroke-width="1.5"/>
    <text x="625" y="32" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">TexEye AI &mdash; UML Deployment Diagram (Physical Execution Topology)</text>
    <text x="625" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Inspection Stand Device &bull; Linux Edge Computing Node &bull; Dockerized Cloud Server &bull; Mobile &amp; Web Nodes</text>
  </g>

  <!-- Node 1: Inspection Stand -->
  <g transform="translate(60, 130)" filter="url(#sh11)">
    <rect width="360" height="520" rx="12" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <text x="25" y="28" fill="#f8fafc" font-size="13" font-weight="bold">&lt;&lt;device&gt;&gt; Fabric Inspection Stand</text>

    <rect x="25" y="50" width="310" height="85" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="180" y="75" fill="#38bdf8" font-size="11" text-anchor="middle">&lt;&lt;hardware component&gt;&gt;</text>
    <text x="180" y="95" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Industrial Camera</text>
    <text x="180" y="112" fill="#94a3b8" font-size="10" text-anchor="middle">High-Resolution Area-Scan / Line-Scan</text>

    <rect x="25" y="155" width="310" height="85" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="180" y="180" fill="#fbbf24" font-size="11" text-anchor="middle">&lt;&lt;hardware component&gt;&gt;</text>
    <text x="180" y="200" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Rotary Encoder</text>
    <text x="180" y="217" fill="#94a3b8" font-size="10" text-anchor="middle">Shaft-Coupled to Measurement Roller</text>

    <rect x="25" y="260" width="310" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="180" y="285" fill="#ffffff" font-size="11" text-anchor="middle">&lt;&lt;hardware component&gt;&gt;</text>
    <text x="180" y="305" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">LED Lighting Array</text>
    <text x="180" y="322" fill="#94a3b8" font-size="10" text-anchor="middle">Constant-Current Illumination Rig</text>

    <rect x="25" y="365" width="310" height="85" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="180" y="390" fill="#f87171" font-size="11" text-anchor="middle">&lt;&lt;hardware component&gt;&gt;</text>
    <text x="180" y="410" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Alert Tower Light / Buzzer</text>
    <text x="180" y="427" fill="#fca5a5" font-size="10" text-anchor="middle">Opto-Isolated Relay Driven Alarm</text>
  </g>

  <!-- Connectors Stand -> Edge -->
  <path d="M 395 220 L 460 220" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="400" y="210" fill="#38bdf8" font-size="9" font-weight="bold">USB 3 / GigE</text>

  <path d="M 395 320 L 460 320" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="400" y="310" fill="#fbbf24" font-size="9" font-weight="bold">GPIO Counter</text>

  <!-- Node 2: Edge Computing Unit -->
  <g transform="translate(460, 130)" filter="url(#sh11)">
    <rect width="460" height="520" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="2.5"/>
    <text x="25" y="28" fill="#38bdf8" font-size="13" font-weight="bold">&lt;&lt;device&gt;&gt; Industrial Edge Computer (Ubuntu 22.04 LTS)</text>
    <text x="25" y="44" fill="#94a3b8" font-size="10">Proposed: NVIDIA Jetson / Industrial IPC (Embedded GPU)</text>

    <!-- Edge Processes -->
    <rect x="25" y="55" width="410" height="75" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="230" y="80" fill="#38bdf8" font-size="11" text-anchor="middle">&lt;&lt;execution environment&gt;&gt;</text>
    <text x="230" y="100" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">texeye-capture-daemon</text>
    <text x="230" y="117" fill="#94a3b8" font-size="10" text-anchor="middle">V4L2 / GenICam / GPIO Listener &bull; Reliability Gate</text>

    <rect x="25" y="145" width="410" height="75" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <text x="230" y="170" fill="#c084fc" font-size="11" text-anchor="middle">&lt;&lt;execution environment&gt;&gt;</text>
    <text x="230" y="190" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">texeye-ai-inference (CUDA / TensorRT)</text>
    <text x="230" y="207" fill="#e9d5ff" font-size="10" text-anchor="middle">Real-time YOLO Defect Detector &bull; Multi-Frame Tracker</text>

    <rect x="25" y="235" width="410" height="75" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="230" y="260" fill="#fbbf24" font-size="11" text-anchor="middle">&lt;&lt;database engine&gt;&gt;</text>
    <text x="230" y="280" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">SQLite 3 (texeye_local.db)</text>
    <text x="230" y="297" fill="#fde68a" font-size="10" text-anchor="middle">WAL Mode &bull; Offline Outbox Queue &bull; Fast Local Commits</text>

    <rect x="25" y="325" width="410" height="75" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="230" y="350" fill="#ffffff" font-size="11" text-anchor="middle">&lt;&lt;file store&gt;&gt;</text>
    <text x="230" y="370" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">NVMe Flash Image Cache (/var/texeye/img)</text>
    <text x="230" y="387" fill="#94a3b8" font-size="10" text-anchor="middle">Pre-sync Defect Crops &bull; Ring Buffer Quota</text>

    <rect x="25" y="415" width="410" height="75" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <text x="230" y="440" fill="#4ade80" font-size="11" text-anchor="middle">&lt;&lt;execution environment&gt;&gt;</text>
    <text x="230" y="460" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">texeye-sync-agent (Python Background Worker)</text>
    <text x="230" y="477" fill="#86efac" font-size="10" text-anchor="middle">Connectivity Watchdog &bull; Multipart HTTPS Batch Upload</text>
  </g>

  <!-- Connect Edge -> Cloud -->
  <path d="M 920 490 L 980 490" stroke="#4ade80" stroke-width="3" marker-end="url(#mG11)"/>
  <text x="915" y="475" fill="#4ade80" font-size="10" font-weight="bold">HTTPS TLS 1.3</text>

  <!-- Node 3: Central Cloud / Server -->
  <g transform="translate(980, 130)" filter="url(#sh11)">
    <rect width="410" height="520" rx="12" fill="#0f172a" stroke="#16a34a" stroke-width="2.5"/>
    <text x="25" y="28" fill="#4ade80" font-size="13" font-weight="bold">&lt;&lt;device&gt;&gt; Central Enterprise Cloud Server</text>
    <text x="25" y="44" fill="#94a3b8" font-size="10">Ubuntu Linux 22.04 LTS &bull; Docker Container Cluster</text>

    <rect x="25" y="55" width="360" height="75" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="205" y="80" fill="#ffffff" font-size="11" text-anchor="middle">&lt;&lt;reverse proxy&gt;&gt;</text>
    <text x="205" y="100" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Nginx 1.24 (Port 443 / SSL)</text>
    <text x="205" y="117" fill="#94a3b8" font-size="10" text-anchor="middle">TLS 1.3 Termination &bull; WebSocket Upgrade</text>

    <rect x="25" y="145" width="360" height="75" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="205" y="170" fill="#4ade80" font-size="11" text-anchor="middle">&lt;&lt;docker container&gt;&gt;</text>
    <text x="205" y="190" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">texeye-backend-api (FastAPI)</text>
    <text x="205" y="207" fill="#86efac" font-size="10" text-anchor="middle">REST Core &bull; Sync Ingest &bull; 4-Pt Grading</text>

    <rect x="25" y="235" width="360" height="75" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="205" y="260" fill="#fbbf24" font-size="11" text-anchor="middle">&lt;&lt;docker container&gt;&gt;</text>
    <text x="205" y="280" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">PostgreSQL 16 Database</text>
    <text x="205" y="297" fill="#fde68a" font-size="10" text-anchor="middle">Relational Roll, Defect &amp; Grading Records</text>

    <rect x="25" y="325" width="360" height="75" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="205" y="350" fill="#ffffff" font-size="11" text-anchor="middle">&lt;&lt;docker container&gt;&gt;</text>
    <text x="205" y="370" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">MinIO / S3 Object Store</text>
    <text x="205" y="387" fill="#94a3b8" font-size="10" text-anchor="middle">Permanent Defect Image Archive &amp; PDF Reports</text>

    <rect x="25" y="415" width="360" height="75" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="205" y="440" fill="#38bdf8" font-size="11" text-anchor="middle">&lt;&lt;docker container&gt;&gt;</text>
    <text x="205" y="460" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">WebSocket / Notification Hub</text>
    <text x="205" y="477" fill="#93c5fd" font-size="10" text-anchor="middle">Real-Time Coordinate Broadcasting to Web/App</text>
  </g>

  <!-- Lower Nodes: Clients -->
  <!-- Mobile Device Node -->
  <g transform="translate(180, 720)" filter="url(#sh11)">
    <rect width="480" height="150" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="25" y="28" fill="#38bdf8" font-size="13" font-weight="bold">&lt;&lt;device&gt;&gt; Shop Floor Mobile Device (Android / iOS)</text>
    <rect x="20" y="45" width="440" height="85" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="240" y="75" fill="#38bdf8" font-size="11" text-anchor="middle">&lt;&lt;mobile app artifact&gt;&gt;</text>
    <text x="240" y="95" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">TexEye AI Mobile App (Flutter / React Native)</text>
    <text x="240" y="115" fill="#94a3b8" font-size="11" text-anchor="middle">Integrated Camera QR Scanner &bull; Wi-Fi 802.11 / 4G</text>
  </g>

  <!-- Workstation Node -->
  <g transform="translate(780, 720)" filter="url(#sh11)">
    <rect width="480" height="150" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text x="25" y="28" fill="#c084fc" font-size="13" font-weight="bold">&lt;&lt;device&gt;&gt; Management Workstation (PC / Laptop)</text>
    <rect x="20" y="45" width="440" height="85" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="240" y="75" fill="#c084fc" font-size="11" text-anchor="middle">&lt;&lt;web app artifact&gt;&gt;</text>
    <text x="240" y="95" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">TexEye AI Web Dashboard (React + TypeScript)</text>
    <text x="240" y="115" fill="#94a3b8" font-size="11" text-anchor="middle">Chrome / Edge / Firefox &bull; Corporate LAN Ethernet</text>
  </g>

  <!-- Client Connections to Cloud -->
  <path d="M 420 720 L 420 680 L 1180 680 L 1180 650" stroke="#38bdf8" stroke-width="2" marker-end="url(#mB11)"/>
  <path d="M 1020 720 L 1020 650" stroke="#c084fc" stroke-width="2" marker-end="url(#mB11)"/>

</svg>
