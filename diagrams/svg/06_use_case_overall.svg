  <!-- ==================== AUTOMATED SYSTEM PROCESSES ==================== -->
  <rect x="315" y="785" width="710" height="315" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="670" y="808" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Automated Edge AI &amp; Inspection Processes</text>

  <!-- UC-18: Capture Fabric Images -->
  <ellipse cx="460" cy="845" rx="110" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="460" y="843" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-18</text>
  <text x="460" y="855" fill="#000000" font-size="11" text-anchor="middle">Capture Fabric Images</text>

  <!-- UC-19: Read Encoder Pulses -->
  <ellipse cx="460" cy="910" rx="110" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="460" y="908" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-19</text>
  <text x="460" y="920" fill="#000000" font-size="11" text-anchor="middle">Read Encoder Pulses</text>

  <!-- UC-20: Monitor Inspection Reliability -->
  <ellipse cx="460" cy="975" rx="110" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="460" y="973" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-20</text>
  <text x="460" y="985" fill="#000000" font-size="11" text-anchor="middle">Monitor Reliability</text>

