  <!-- UC-11: View Defect Statistics -->
  <g id="uc-stats">
    <ellipse cx="850" cy="265" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="850" y="263" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-11</text>
    <text x="850" y="275" fill="#000000" font-size="11" text-anchor="middle">View Defect Statistics</text>
  </g>

  <!-- UC-12: View Quality Records -->
  <g id="uc-quality">
    <ellipse cx="850" cy="325" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="850" y="323" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-12</text>
    <text x="850" y="335" fill="#000000" font-size="11" text-anchor="middle">View Quality Records</text>
