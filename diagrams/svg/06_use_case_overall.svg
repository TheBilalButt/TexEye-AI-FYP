  <g id="uc-calib">
    <ellipse cx="850" cy="655" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="850" y="653" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-17</text>
    <text x="850" y="665" fill="#000000" font-size="11" text-anchor="middle">Configure Calibration Rules</text>
