  <ellipse cx="460" cy="1060" rx="110" ry="20" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="460" y="1058" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-21</text>
  <text x="460" y="1070" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">Mark Uninspected Section</text>

  <!-- Extend arrow from UC-21 to UC-20 (No box, pure clean text with open arrowhead) -->
  <path d="M 460 1040 L 460 999" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="472" y="1024" fill="#000000" font-size="9.5" text-anchor="start">&lt;&lt;extend&gt;&gt;</text>

  <!-- UC-22: Detect Fabric Defects -->
  <ellipse cx="780" cy="845" rx="110" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="780" y="843" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-22</text>
  <text x="780" y="855" fill="#000000" font-size="11" text-anchor="middle">Detect Fabric Defects</text>

  <!-- UC-23: Track Defects Across Frames -->
