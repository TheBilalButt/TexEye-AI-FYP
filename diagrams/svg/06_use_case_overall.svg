  <text x="780" y="973" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-24</text>
  <text x="780" y="985" fill="#000000" font-size="11" text-anchor="middle">Store Records Locally</text>

  <!-- UC-25: Synchronize Records Online -->
  <ellipse cx="780" cy="1060" rx="110" ry="20" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="780" y="1058" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-25</text>
  <text x="780" y="1070" fill="#000000" font-size="10" text-anchor="middle">Synchronize Records Online</text>


