  <!-- ==================== ASSOCIATIONS (SOLID BLACK LINES - ZERO CROSSINGS) ==================== -->

  <!-- Floor Operator Associations (Strictly UC-01 to UC-04) -->
  <line x1="170" y1="286" x2="365" y2="205" stroke="#000000" stroke-width="1.2"/>
  <line x1="170" y1="286" x2="365" y2="265" stroke="#000000" stroke-width="1.2"/>
  <line x1="170" y1="286" x2="365" y2="325" stroke="#000000" stroke-width="1.2"/>
  <line x1="170" y1="286" x2="365" y2="385" stroke="#000000" stroke-width="1.2"/>

  <!-- Quality Inspector Associations (Strictly UC-05 to UC-09) -->
  <line x1="170" y1="606" x2="365" y2="450" stroke="#000000" stroke-width="1.2"/>
  <line x1="170" y1="606" x2="365" y2="510" stroke="#000000" stroke-width="1.2"/>
  <line x1="170" y1="606" x2="365" y2="570" stroke="#000000" stroke-width="1.2"/>
  <line x1="170" y1="606" x2="365" y2="630" stroke="#000000" stroke-width="1.2"/>
  <line x1="170" y1="606" x2="365" y2="745" stroke="#000000" stroke-width="1.2"/>

  <!-- Production Manager Associations -->
  <line x1="1180" y1="276" x2="975" y2="205" stroke="#000000" stroke-width="1.2"/>
  <line x1="1180" y1="276" x2="975" y2="265" stroke="#000000" stroke-width="1.2"/>
  <line x1="1180" y1="276" x2="975" y2="325" stroke="#000000" stroke-width="1.2"/>

