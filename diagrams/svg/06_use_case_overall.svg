<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1150" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <!-- Arrowhead markers for UML relationships -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
    <marker id="openArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6" fill="none" stroke="#000000" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Document Frame (Academic Style) -->
  <rect x="15" y="15" width="1370" height="1120" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1360" height="1110" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Diagram Caption Header -->
  <text x="700" y="52" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 3.1: Use Case Diagram of TexEye AI System</text>
  <line x1="50" y1="65" x2="1350" y2="65" stroke="#cccccc" stroke-width="1"/>

  <!-- ==================== SYSTEM BOUNDARY ==================== -->
  <rect x="290" y="85" width="760" height="1025" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="670" y="112" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">TexEye AI</text>

  <!-- ==================== USE CASES (INSIDE BOUNDARY) ==================== -->

  <!-- Shared Auth -->
  <g id="uc-auth">
    <ellipse cx="670" cy="145" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="670" y="143" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-00</text>
    <text x="670" y="155" fill="#000000" font-size="11" text-anchor="middle">Login / Authenticate</text>
  </g>

  <!-- UC-01: Scan Roll QR Code -->
  <g id="uc-scan">
    <ellipse cx="490" cy="205" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="490" y="203" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-01</text>
    <text x="490" y="215" fill="#000000" font-size="11" text-anchor="middle">Scan Roll QR Code</text>
  </g>

  <!-- UC-02: View Roll Specifications -->
  <g id="uc-spec">
    <ellipse cx="490" cy="265" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="490" y="263" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-02</text>
    <text x="490" y="275" fill="#000000" font-size="11" text-anchor="middle">View Roll Specifications</text>
  </g>

  <!-- UC-03: Receive Inspection Alerts -->
  <g id="uc-alert">
    <ellipse cx="490" cy="325" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="490" y="323" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-03</text>
    <text x="490" y="335" fill="#000000" font-size="11" text-anchor="middle">Receive Inspection Alerts</text>
  </g>

  <!-- UC-04: Review Detected Defects -->
  <g id="uc-review">
    <ellipse cx="490" cy="385" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="490" y="383" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-04</text>
    <text x="490" y="395" fill="#000000" font-size="11" text-anchor="middle">Review Detected Defects</text>
  </g>

  <!-- UC-05: View Digital Defect Map -->
  <g id="uc-map">
    <ellipse cx="490" cy="450" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="490" y="448" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-05</text>
    <text x="490" y="460" fill="#000000" font-size="11" text-anchor="middle">View Digital Defect Map</text>
  </g>

  <!-- UC-06: Correct Defect Record -->
  <g id="uc-correct">
    <ellipse cx="490" cy="515" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="490" y="513" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-06</text>
    <text x="490" y="525" fill="#000000" font-size="11" text-anchor="middle">Correct Defect Record</text>
  </g>

  <!-- UC-07: Confirm Fabric Grading -->
  <g id="uc-grade">
    <ellipse cx="490" cy="580" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="490" y="578" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-07</text>
    <text x="490" y="590" fill="#000000" font-size="11" text-anchor="middle">Confirm Fabric Grading</text>
  </g>

  <!-- UC-08: Generate Inspection Report -->
  <g id="uc-report">
    <ellipse cx="490" cy="645" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="490" y="643" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-08</text>
    <text x="490" y="655" fill="#000000" font-size="11" text-anchor="middle">Generate Inspection Report</text>
  </g>

  <!-- UC-09: View Production Dashboard -->
  <g id="uc-dash">
    <ellipse cx="850" cy="205" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="850" y="203" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-09</text>
    <text x="850" y="215" fill="#000000" font-size="11" text-anchor="middle">View Production Dashboard</text>
  </g>

  <!-- UC-10: View Defect Statistics -->
  <g id="uc-stats">
    <ellipse cx="850" cy="265" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="850" y="263" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-10</text>
    <text x="850" y="275" fill="#000000" font-size="11" text-anchor="middle">View Defect Statistics</text>
  </g>

  <!-- UC-11: View Quality Records -->
  <g id="uc-quality">
    <ellipse cx="850" cy="325" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="850" y="323" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-11</text>
    <text x="850" y="335" fill="#000000" font-size="11" text-anchor="middle">View Quality Records</text>
  </g>

  <!-- UC-12: View Inventory Records -->
  <g id="uc-inv">
    <ellipse cx="850" cy="400" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="850" y="398" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-12</text>
    <text x="850" y="410" fill="#000000" font-size="11" text-anchor="middle">View Inventory Records</text>
  </g>

  <!-- UC-13: Update Roll Location -->
  <g id="uc-loc">
    <ellipse cx="850" cy="460" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="850" y="458" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-13</text>
    <text x="850" y="470" fill="#000000" font-size="11" text-anchor="middle">Update Roll Location</text>
  </g>

  <!-- UC-14: Manage Quarantine Records -->
  <g id="uc-quar">
    <ellipse cx="850" cy="520" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="850" y="518" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-14</text>
    <text x="850" y="530" fill="#000000" font-size="11" text-anchor="middle">Manage Quarantine Records</text>
  </g>

  <!-- UC-15: Manage User Accounts -->
  <g id="uc-users">
    <ellipse cx="850" cy="595" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="850" y="593" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-15</text>
    <text x="850" y="605" fill="#000000" font-size="11" text-anchor="middle">Manage User Accounts</text>
  </g>

  <!-- UC-16: Configure Calibration Rules -->
  <g id="uc-calib">
    <ellipse cx="850" cy="655" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="850" y="653" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-16</text>
    <text x="850" y="665" fill="#000000" font-size="11" text-anchor="middle">Configure Calibration Rules</text>
  </g>

  <!-- Sub-included / Extended Use Cases -->
  <!-- Calculate 4-Point Grade (included by Confirm Fabric Grading) -->
  <ellipse cx="670" cy="735" rx="120" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="670" y="739" fill="#000000" font-size="11" text-anchor="middle">Calculate 4-Point Grade</text>

  <!-- Include arrow from UC-07 to Calculate 4-Point Grade -->
  <path d="M 535 600 L 635 715" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="600" y="650" fill="#000000" font-size="9" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- Extend arrow from UC-06 to UC-04 -->
  <path d="M 490 493 L 490 407" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="525" y="445" fill="#000000" font-size="9" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>

  <!-- ==================== AUTOMATED SYSTEM PROCESSES ==================== -->
  <rect x="315" y="785" width="710" height="305" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="670" y="810" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Automated Edge AI &amp; Inspection Processes</text>

  <!-- UC-17: Capture Fabric Images -->
  <ellipse cx="460" cy="855" rx="110" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="460" y="853" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-17</text>
  <text x="460" y="865" fill="#000000" font-size="11" text-anchor="middle">Capture Fabric Images</text>

  <!-- UC-18: Read Encoder Pulses -->
  <ellipse cx="460" cy="925" rx="110" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="460" y="923" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-18</text>
  <text x="460" y="935" fill="#000000" font-size="11" text-anchor="middle">Read Encoder Pulses</text>

  <!-- UC-19: Monitor Inspection Reliability -->
  <ellipse cx="460" cy="995" rx="110" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="460" y="993" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-19</text>
  <text x="460" y="1005" fill="#000000" font-size="11" text-anchor="middle">Monitor Reliability</text>

  <!-- UC-20: Mark Uninspected Section -->
  <ellipse cx="460" cy="1055" rx="110" ry="20" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="460" y="1053" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-20</text>
  <text x="460" y="1065" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">Mark Uninspected Section</text>

  <!-- Extend arrow from UC-20 to UC-19 -->
  <path d="M 460 1035 L 460 1017" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="500" y="1027" fill="#000000" font-size="9" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>

  <!-- UC-21: Detect Fabric Defects -->
  <ellipse cx="780" cy="855" rx="110" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="780" y="853" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-21</text>
  <text x="780" y="865" fill="#000000" font-size="11" text-anchor="middle">Detect Fabric Defects</text>

  <!-- UC-22: Track Defects Across Frames -->
  <ellipse cx="780" cy="925" rx="110" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="780" y="923" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-22</text>
  <text x="780" y="935" fill="#000000" font-size="11" text-anchor="middle">Track Defects Across Frames</text>

  <!-- UC-23: Store Records Locally -->
  <ellipse cx="780" cy="995" rx="110" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="780" y="993" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-23</text>
  <text x="780" y="1005" fill="#000000" font-size="11" text-anchor="middle">Store Records Locally</text>

  <!-- UC-24: Synchronize Records Online -->
  <ellipse cx="780" cy="1055" rx="110" ry="20" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="780" y="1053" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-24</text>
  <text x="780" y="1065" fill="#000000" font-size="10" text-anchor="middle">Synchronize Records Online</text>


  <!-- ==================== ACTORS (OUTSIDE BOUNDARY) ==================== -->

  <!-- ACTOR 1: Floor Operator (Top Left) -->
  <g id="actor-floor-operator" transform="translate(140, 240)">
    <circle cx="20" cy="20" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="34" x2="20" y2="70" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="46" x2="40" y2="46" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="70" x2="4" y2="105" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="70" x2="36" y2="105" stroke="#000000" stroke-width="1.5"/>
    <text x="20" y="125" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Floor Operator</text>
  </g>

  <!-- ACTOR 2: Quality Inspector (Bottom Left) -->
  <g id="actor-quality-inspector" transform="translate(140, 520)">
    <circle cx="20" cy="20" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="34" x2="20" y2="70" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="46" x2="40" y2="46" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="70" x2="4" y2="105" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="70" x2="36" y2="105" stroke="#000000" stroke-width="1.5"/>
    <text x="20" y="125" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Quality Inspector</text>
  </g>

  <!-- ACTOR 3: Production Manager (Top Right) -->
  <g id="actor-production-manager" transform="translate(1180, 230)">
    <circle cx="20" cy="20" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="34" x2="20" y2="70" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="46" x2="40" y2="46" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="70" x2="4" y2="105" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="70" x2="36" y2="105" stroke="#000000" stroke-width="1.5"/>
    <text x="20" y="125" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Production Manager</text>
  </g>

  <!-- ACTOR 4: Inventory Manager (Middle Right) -->
  <g id="actor-inventory-manager" transform="translate(1180, 430)">
    <circle cx="20" cy="20" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="34" x2="20" y2="70" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="46" x2="40" y2="46" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="70" x2="4" y2="105" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="70" x2="36" y2="105" stroke="#000000" stroke-width="1.5"/>
    <text x="20" y="125" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Inventory Manager</text>
  </g>

  <!-- ACTOR 5: System Administrator (Bottom Right) -->
  <g id="actor-system-admin" transform="translate(1180, 600)">
    <circle cx="20" cy="20" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="34" x2="20" y2="70" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="46" x2="40" y2="46" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="70" x2="4" y2="105" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="70" x2="36" y2="105" stroke="#000000" stroke-width="1.5"/>
    <text x="20" y="125" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">System Administrator</text>
  </g>


  <!-- ==================== ASSOCIATIONS (SOLID BLACK LINES) ==================== -->

  <!-- Floor Operator Associations -->
  <line x1="180" y1="286" x2="365" y2="205" stroke="#000000" stroke-width="1.2"/>
  <line x1="180" y1="286" x2="365" y2="265" stroke="#000000" stroke-width="1.2"/>
  <line x1="180" y1="286" x2="365" y2="325" stroke="#000000" stroke-width="1.2"/>
  <line x1="180" y1="286" x2="365" y2="385" stroke="#000000" stroke-width="1.2"/>

  <!-- Quality Inspector Associations -->
  <line x1="180" y1="566" x2="365" y2="385" stroke="#000000" stroke-width="1.2"/>
  <line x1="180" y1="566" x2="365" y2="450" stroke="#000000" stroke-width="1.2"/>
  <line x1="180" y1="566" x2="365" y2="515" stroke="#000000" stroke-width="1.2"/>
  <line x1="180" y1="566" x2="365" y2="580" stroke="#000000" stroke-width="1.2"/>
  <line x1="180" y1="566" x2="365" y2="645" stroke="#000000" stroke-width="1.2"/>

  <!-- Production Manager Associations -->
  <line x1="1180" y1="276" x2="975" y2="205" stroke="#000000" stroke-width="1.2"/>
  <line x1="1180" y1="276" x2="975" y2="265" stroke="#000000" stroke-width="1.2"/>
  <line x1="1180" y1="276" x2="975" y2="325" stroke="#000000" stroke-width="1.2"/>

  <!-- Inventory Manager Associations -->
  <line x1="1180" y1="476" x2="975" y2="400" stroke="#000000" stroke-width="1.2"/>
  <line x1="1180" y1="476" x2="975" y2="460" stroke="#000000" stroke-width="1.2"/>
  <line x1="1180" y1="476" x2="975" y2="520" stroke="#000000" stroke-width="1.2"/>

  <!-- System Administrator Associations -->
  <line x1="1180" y1="646" x2="975" y2="595" stroke="#000000" stroke-width="1.2"/>
  <line x1="1180" y1="646" x2="975" y2="655" stroke="#000000" stroke-width="1.2"/>

</svg>
