    <text x="850" y="458" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-14</text>
    <text x="850" y="470" fill="#000000" font-size="11" text-anchor="middle">Update Roll Location</text>
  </g>

  <!-- UC-15: Manage Quarantine Records -->
  <g id="uc-quar">
    <ellipse cx="850" cy="520" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="850" y="518" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-15</text>
    <text x="850" y="530" fill="#000000" font-size="11" text-anchor="middle">Manage Quarantine Records</text>
