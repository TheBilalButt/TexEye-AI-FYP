<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 1150" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
    <marker id="openArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#000000" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Academic Double Frame -->
  <rect x="15" y="15" width="1320" height="1120" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1310" height="1110" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="675" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 5.1: UML Use Case Diagram of TexEye AI System</text>
  <line x1="50" y1="62" x2="1300" y2="62" stroke="#cccccc" stroke-width="1"/>

  <!-- ==================== SYSTEM BOUNDARY ==================== -->
  <rect x="300" y="85" width="740" height="1025" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="670" y="112" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">SYSTEM BOUNDARY: TexEye AI</text>
  <line x1="310" y1="122" x2="1030" y2="122" stroke="#000000" stroke-width="0.8"/>

  <!-- Common Use Case: UC-00 Authentication -->
  <ellipse cx="670" cy="150" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="670" y="148" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-00</text>
  <text x="670" y="160" fill="#000000" font-size="11" text-anchor="middle">Login / Authenticate (JWT)</text>


  <!-- ==================== COLUMN 1: SHOP FLOOR & QUALITY INSPECTOR ==================== -->

  <!-- Floor Operator Dedicated Use Cases (UC-01 to UC-04) -->
  <!-- UC-01: Scan Roll QR Code -->
  <g id="uc-scan">
    <ellipse cx="490" cy="205" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="490" y="203" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-01</text>
    <text x="490" y="215" fill="#000000" font-size="11" text-anchor="middle">Scan Roll QR Code</text>
  </g>

  <!-- UC-02: View Roll Specifications -->
  <g id="uc-specs">
    <ellipse cx="490" cy="265" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="490" y="263" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-02</text>
    <text x="490" y="275" fill="#000000" font-size="11" text-anchor="middle">View Roll Specifications</text>
  </g>

  <!-- UC-03: Receive Inspection Alerts -->
  <g id="uc-alerts">
    <ellipse cx="490" cy="325" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="490" y="323" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-03</text>
    <text x="490" y="335" fill="#000000" font-size="11" text-anchor="middle">Receive Inspection Alerts</text>
  </g>

  <!-- UC-04: Review Flaw Crops (Mobile) -->
  <g id="uc-review-mobile">
    <ellipse cx="490" cy="385" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="490" y="383" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-04</text>
    <text x="490" y="395" fill="#000000" font-size="11" text-anchor="middle">Review Flaw Crops (Mobile)</text>
  </g>


  <!-- Quality Inspector Dedicated Use Cases (UC-05 to UC-09) -->
  <!-- UC-05: View Digital Defect Map -->
  <g id="uc-map">
    <ellipse cx="490" cy="450" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="490" y="448" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-05</text>
    <text x="490" y="460" fill="#000000" font-size="11" text-anchor="middle">View Digital Defect Map</text>
  </g>

  <!-- UC-06: Inspect Defect Details -->
  <g id="uc-inspect">
    <ellipse cx="490" cy="510" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="490" y="508" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-06</text>
    <text x="490" y="520" fill="#000000" font-size="11" text-anchor="middle">Inspect Defect Details</text>
  </g>

  <!-- UC-07: Correct Defect Record -->
  <g id="uc-correct">
    <ellipse cx="490" cy="570" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="490" y="568" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-07</text>
    <text x="490" y="580" fill="#000000" font-size="11" text-anchor="middle">Correct Defect Record</text>
  </g>

  <!-- Extend arrow from UC-07 up to UC-06: routed cleanly around the outside right flank -->
  <path d="M 612 570 L 642 570 L 642 510 L 617 510" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="650" y="544" fill="#000000" font-size="9.5" text-anchor="start">&lt;&lt;extend&gt;&gt;</text>

  <!-- UC-08: Confirm Fabric Grading -->
  <g id="uc-grade">
    <ellipse cx="490" cy="630" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="490" y="628" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-08</text>
    <text x="490" y="640" fill="#000000" font-size="11" text-anchor="middle">Confirm Fabric Grading</text>
  </g>

  <!-- Sub included UC: Calculate 4-Point Grade (directly adjacent below UC-08) -->
  <g id="uc-calc-grade">
    <ellipse cx="490" cy="690" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="490" y="694" fill="#000000" font-size="11" text-anchor="middle">Calculate 4-Point Grade</text>
  </g>

  <!-- Include arrow from UC-08 down to Calculate 4-Point Grade: routed cleanly around the outside right flank -->
  <path d="M 612 630 L 642 630 L 642 690 L 617 690" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#openArrow)"/>
  <text x="650" y="664" fill="#000000" font-size="9.5" text-anchor="start">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-09: Generate Inspection Report -->
  <g id="uc-report">
