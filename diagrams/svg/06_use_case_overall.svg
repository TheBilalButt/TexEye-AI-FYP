    <circle cx="20" cy="20" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="34" x2="20" y2="70" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="46" x2="40" y2="46" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="70" x2="4" y2="105" stroke="#000000" stroke-width="1.5"/>
    <line x1="20" y1="70" x2="36" y2="105" stroke="#000000" stroke-width="1.5"/>
    <text x="20" y="125" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Production Manager</text>
