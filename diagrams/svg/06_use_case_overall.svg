    <text x="490" y="743" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-09</text>
    <text x="490" y="755" fill="#000000" font-size="11" text-anchor="middle">Generate Inspection Report</text>
  </g>


  <!-- ==================== COLUMN 2: MANAGEMENT & ADMIN ==================== -->

  <!-- UC-10: View Production Dashboard -->
  <g id="uc-dash">
    <ellipse cx="850" cy="205" rx="125" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="850" y="203" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">UC-10</text>
    <text x="850" y="215" fill="#000000" font-size="11" text-anchor="middle">View Production Dashboard</text>
