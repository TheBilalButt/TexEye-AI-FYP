<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1400 1290" style="background-color:#0b1120;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="headerGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="blueCard" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="greenCard" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#14532d"/><stop offset="100%" stop-color="#052e16"/></linearGradient><linearGradient id="purpleCard" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#581c87"/><stop offset="100%" stop-color="#3b0764"/></linearGradient><linearGradient id="redCard" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#7f1d1d"/><stop offset="100%" stop-color="#450a0a"/></linearGradient><linearGradient id="amberCard" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#78350f"/><stop offset="100%" stop-color="#451a03"/></linearGradient><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".5" stdDeviation="6"/></filter><marker id="arrowBlue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#38bdf8" d="M0,0 L0,6 L9,3 z"/></marker><marker id="arrowGreen" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#4ade80" d="M0,0 L0,6 L9,3 z"/></marker><marker id="arrowRed" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#f87171" d="M0,0 L0,6 L9,3 z"/></marker><marker id="arrowPurple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#c084fc" d="M0,0 L0,6 L9,3 z"/></marker></defs><g filter="url(#shadow)" transform="translate(100, 30)"><rect width="1200" height="70" fill="url(#headerGrad)" stroke="#334155" stroke-width="1.5" rx="12"/><text x="600" y="32" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">TexEye AI — End-to-End System Workflow</text><text x="600" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Muhammad Afnan Khan (FA23-BAI-028) • Muhammad Bilal Butt (FA23-BAI-042) | Real-Time Inspection &amp; Quality Gating</text></g><g filter="url(#shadow)" transform="translate(525, 130)"><rect width="350" height="50" fill="#0284c7" stroke="#38bdf8" stroke-width="2" rx="25"/><text x="175" y="30" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">START: Fabric Roll Enters Stand</text></g><path stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)" d="M 700 180 L 700 210"/><g filter="url(#shadow)" transform="translate(500, 215)"><rect width="400" height="60" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8"/><text x="200" y="27" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">Initialize Inspection Session</text><text x="200" y="47" fill="#94a3b8" font-size="12" text-anchor="middle">Operator QR Scan • Fabric Metadata Loaded</text></g><path stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)" d="M 700 275 L 700 305"/><g filter="url(#shadow)" transform="translate(150, 310)"><rect width="1100" height="110" fill="#0f172a" stroke="#334155" stroke-dasharray="4 2" stroke-width="1.5" rx="12"/><text x="25" y="25" fill="#38bdf8" font-size="13" font-weight="bold">1. CONTINUOUS HARDWARE SENSING &amp; ILLUMINATION</text><rect width="320" height="50" x="30" y="40" fill="#1e293b" stroke="#475569" stroke-width="1" rx="6"/><text x="190" y="62" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">LED Lighting System</text><text x="190" y="80" fill="#94a3b8" font-size="11" text-anchor="middle">High-CRI Uniform Illumination</text><rect width="320" height="50" x="390" y="40" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="6"/><text x="550" y="62" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Industrial Camera</text><text x="550" y="80" fill="#94a3b8" font-size="11" text-anchor="middle">Continuous High-Speed Video Stream</text><rect width="320" height="50" x="750" y="40" fill="#1e293b" stroke="#475569" stroke-width="1" rx="6"/><text x="910" y="62" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Rotary Encoder</text><text x="910" y="80" fill="#94a3b8" font-size="11" text-anchor="middle">Physical Movement Pulses (ΔL)</text></g><path stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)" d="M 700 420 L 700 460"/><g filter="url(#shadow)" transform="translate(550, 465)"><polygon fill="url(#blueCard)" stroke="#38bdf8" stroke-width="2" points="150 0 300 70 150 140 0 70"/><text x="150" y="55" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Inspection Data</text><text x="150" y="75" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Reliable?</text><text x="150" y="95" fill="#93c5fd" font-size="10" text-anchor="middle">Cam • Light • Blur • Drop</text></g><path stroke="#f87171" stroke-width="2.5" marker-end="url(#arrowRed)" d="M 550 535 L 360 535"/><text x="440" y="525" fill="#f87171" font-size="12" font-weight="bold">NO (Degraded)</text><g filter="url(#shadow)" transform="translate(100, 500)"><rect width="250" height="70" fill="url(#redCard)" stroke="#f87171" stroke-width="1.5" rx="8"/><text x="125" y="30" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Generate Warning Alert</text><text x="125" y="50" fill="#fca5a5" font-size="11" text-anchor="middle">Local Beacon • Operator Push</text></g><path stroke="#f87171" stroke-width="2.5" marker-end="url(#arrowRed)" d="M 225 570 L 225 610"/><g filter="url(#shadow)" transform="translate(60, 615)"><rect width="330" height="95" fill="url(#redCard)" stroke="#ef4444" stroke-width="2" rx="8"/><text x="165" y="27" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Mark Section as UNINSPECTED</text><text x="165" y="47" fill="#fecaca" font-size="11" text-anchor="middle">Interval: [L_start, L_end] in meters</text><rect width="290" height="25" x="20" y="58" fill="#450a0a" rx="4"/><text x="165" y="75" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle">CRITICAL: Never treat as defect-free!</text></g><path stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrowGreen)" d="M 700 605 L 700 645"/><text x="710" y="625" fill="#4ade80" font-size="12" font-weight="bold">YES (Reliable)</text><g filter="url(#shadow)" transform="translate(500, 650)"><rect width="400" height="260" fill="#0f172a" stroke="#a855f7" stroke-width="2" rx="12"/><text x="20" y="25" fill="#c084fc" font-size="13" font-weight="bold">AI DEFECT DETECTION &amp; METROLOGY PIPELINE</text><rect width="350" height="42" x="25" y="40" fill="url(#purpleCard)" stroke="#c084fc" stroke-width="1" rx="6"/><text x="200" y="65" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">1. AI Model Defect Detection (YOLO)</text><rect width="350" height="42" x="25" y="92" fill="url(#purpleCard)" stroke="#c084fc" stroke-width="1" rx="6"/><text x="200" y="117" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">2. Multi-Frame Tracking (Kalman / IoU)</text><rect width="350" height="42" x="25" y="144" fill="url(#purpleCard)" stroke="#c084fc" stroke-width="1" rx="6"/><text x="200" y="169" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">3. Duplicate Detection Reduction</text><rect width="350" height="45" x="25" y="196" fill="url(#purpleCard)" stroke="#c084fc" stroke-width="1" rx="6"/><text x="200" y="217" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">4. Metric Position Estimation</text><text x="200" y="233" fill="#e9d5ff" font-size="10" text-anchor="middle">X_cm (Cam Calib) • Y_m (Encoder Displace)</text></g><path stroke="#f87171" stroke-width="2.5" marker-end="url(#arrowRed)" d="M 225 710 L 225 960 L 520 960"/><path stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrowGreen)" d="M 700 910 L 700 935"/><g filter="url(#shadow)" transform="translate(525, 935)"><rect width="350" height="65" fill="url(#amberCard)" stroke="#f59e0b" stroke-width="2" rx="10"/><text x="175" y="28" fill="#fef3c7" font-size="13" font-weight="bold" text-anchor="middle">Local Edge Data Store (Always Active)</text><text x="175" y="48" fill="#fde68a" font-size="11" text-anchor="middle">SQLite DB • Local Defect Image Cache • Outbox Queue</text></g><path stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)" d="M 700 1000 L 700 1030"/><g filter="url(#shadow)" transform="translate(575, 1035)"><polygon fill="url(#blueCard)" stroke="#38bdf8" stroke-width="2" points="125 0 250 50 125 100 0 50"/><text x="125" y="47" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Internet / Cloud</text><text x="125" y="63" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Reachable?</text></g><path stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowBlue)" d="M 575 1085 L 350 1085"/><text x="440" y="1075" fill="#f59e0b" font-size="11" font-weight="bold">NO (Offline)</text><g filter="url(#shadow)" transform="translate(100, 1055)"><rect width="240" height="65" fill="url(#amberCard)" stroke="#f59e0b" stroke-width="1.5" rx="8"/><text x="120" y="27" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Buffer in Sync Queue</text><text x="120" y="45" fill="#fde68a" font-size="10" text-anchor="middle">Zero stoppage. Syncs automatically</text><text x="120" y="58" fill="#fde68a" font-size="10" text-anchor="middle">when connection restores.</text></g><path stroke="#f59e0b" stroke-dasharray="4 2" stroke-width="1.5" d="M 220 1120 L 220 1160 L 850 1160 L 850 1125"/><path stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrowGreen)" d="M 825 1085 L 940 1085"/><text x="850" y="1075" fill="#4ade80" font-size="11" font-weight="bold">YES (Online)</text><g filter="url(#shadow)" transform="translate(950, 1055)"><rect width="360" height="65" fill="url(#greenCard)" stroke="#4ade80" stroke-width="2" rx="8"/><text x="180" y="27" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Central Backend Synchronization</text><text x="180" y="47" fill="#bbf7d0" font-size="11" text-anchor="middle">PostgreSQL Ingest • Cloud S3 • WebSockets</text></g><path stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)" d="M 1130 1120 L 1130 1180"/><g filter="url(#shadow)" transform="translate(450, 1185)"><rect width="860" height="85" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="10"/><rect width="390" height="55" x="20" y="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1" rx="6"/><text x="215" y="37" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Mobile App (Floor Operator / Inspector)</text><text x="215" y="55" fill="#94a3b8" font-size="11" text-anchor="middle">Push Alerts • QR Scanning • Review &amp; Correct</text><rect width="400" height="55" x="440" y="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1" rx="6"/><text x="640" y="37" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Web Dashboard (QA / Manager / Inventory)</text><text x="640" y="55" fill="#94a3b8" font-size="11" text-anchor="middle">Fabric Defect Map • 4-Point Grading • PDF Reports</text></g></svg>