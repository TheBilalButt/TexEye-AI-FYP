<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
  </defs>

  <!-- Academic Double Frame -->
  <rect x="15" y="15" width="970" height="1220" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="960" height="1210" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="500" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 2.1: Main System Workflow of TexEye AI</text>
  <line x1="50" y1="62" x2="950" y2="62" stroke="#cccccc" stroke-width="1"/>

  <!-- Start Symbol (Initial State) -->
  <circle cx="500" cy="95" r="14" fill="#000000" stroke="#000000" stroke-width="1.5"/>

  <!-- Step 1: Roll Enters Stand -->
  <line x1="500" y1="109" x2="500" y2="135" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="135" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="161" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Fabric Roll Enters Inspection Stand</text>

  <!-- Step 2: Initialize Session / Scan QR -->
  <line x1="500" y1="177" x2="500" y2="205" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="205" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="231" fill="#000000" font-size="12" text-anchor="middle">Scan Roll QR Code &amp; Load Metadata</text>

  <!-- Step 3: Capture & Measure (Fork) -->
  <line x1="500" y1="247" x2="500" y2="275" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="275" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="301" fill="#000000" font-size="12" text-anchor="middle">Capture Images &amp; Read Encoder Displacement</text>

  <!-- Step 4: Reliability Gate Check -->
  <line x1="500" y1="317" x2="500" y2="345" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="345" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="371" fill="#000000" font-size="12" text-anchor="middle">Evaluate Inspection Reliability</text>

  <!-- Decision 1: Inspection Reliable? -->
  <line x1="500" y1="387" x2="500" y2="415" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <polygon points="500 415, 620 450, 500 485, 380 450" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="454" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Data Reliable?</text>

  <!-- [No] Branch: Left -->
  <line x1="380" y1="450" x2="230" y2="450" stroke="#000000" stroke-width="1.2"/>
  <line x1="230" y1="450" x2="230" y2="495" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="310" y="442" fill="#000000" font-size="11" font-weight="bold">No</text>

  <rect x="110" y="495" width="240" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="230" y="521" fill="#000000" font-size="12" text-anchor="middle">Trigger Warning Stack Light</text>

  <line x1="230" y1="537" x2="230" y2="565" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="110" y="565" width="240" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="230" y="591" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Mark Span as Uninspected</text>

  <!-- [Yes] Branch: Down to AI Pipeline -->
  <line x1="500" y1="485" x2="500" y2="520" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="510" y="505" fill="#000000" font-size="11" font-weight="bold">Yes</text>

  <rect x="360" y="520" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="546" fill="#000000" font-size="12" text-anchor="middle">Run AI Defect Detection</text>

  <line x1="500" y1="562" x2="500" y2="590" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="590" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="616" fill="#000000" font-size="12" text-anchor="middle">Track Defects Across Frames</text>

  <line x1="500" y1="632" x2="500" y2="660" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="660" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="686" fill="#000000" font-size="12" text-anchor="middle">Deduplicate Repeat Detections</text>

  <line x1="500" y1="702" x2="500" y2="730" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="730" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="756" fill="#000000" font-size="12" text-anchor="middle">Estimate Physical Coordinate (X, Y)</text>

  <!-- Merge Uninspected and Detected Branches -->
  <line x1="230" y1="607" x2="230" y2="795" stroke="#000000" stroke-width="1.2"/>
  <line x1="230" y1="795" x2="475" y2="795" stroke="#000000" stroke-width="1.2"/>
  <line x1="500" y1="772" x2="500" y2="785" stroke="#000000" stroke-width="1.2"/>

  <!-- Decision 2: Merge Diamond -->
  <polygon points="500 785, 525 795, 500 805, 475 795" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <line x1="500" y1="805" x2="500" y2="830" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Step: Save Inspection Record Locally -->
  <rect x="360" y="830" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="856" fill="#000000" font-size="12" text-anchor="middle">Save Record to Local Storage</text>

  <!-- Decision 3: Network Connection Available? -->
  <line x1="500" y1="872" x2="500" y2="900" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <polygon points="500 900, 620 935, 500 970, 380 935" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="939" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Network Available?</text>

  <!-- [No] Branch: Store in Outbox Queue -->
  <line x1="380" y1="935" x2="230" y2="935" stroke="#000000" stroke-width="1.2"/>
  <line x1="230" y1="935" x2="230" y2="985" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="310" y="927" fill="#000000" font-size="11" font-weight="bold">No</text>

  <rect x="110" y="985" width="240" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="230" y="1011" fill="#000000" font-size="11.5" text-anchor="middle">Queue in Offline Outbox</text>

  <!-- [Yes] Branch: Synchronize to Central Backend -->
  <line x1="500" y1="970" x2="500" y2="1005" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="510" y="990" fill="#000000" font-size="11" font-weight="bold">Yes</text>

  <rect x="360" y="1005" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="1031" fill="#000000" font-size="12" text-anchor="middle">Synchronize Batches with Central Server</text>

  <!-- Final Step: Update UI & Reports -->
  <line x1="230" y1="1027" x2="230" y2="1080" stroke="#000000" stroke-width="1.2"/>
  <line x1="230" y1="1080" x2="360" y2="1080" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="500" y1="1047" x2="500" y2="1070" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="1070" width="280" height="45" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="1092" fill="#000000" font-size="11" text-anchor="middle">Update Defect Map, 4-Point Grade</text>
  <text x="500" y="1106" fill="#000000" font-size="11" text-anchor="middle">&amp; Push Alerts to Web / Mobile</text>

  <!-- End Node (Bullseye) -->
  <line x1="500" y1="1115" x2="500" y2="1145" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <circle cx="500" cy="1165" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <circle cx="500" cy="1165" r="8" fill="#000000"/>
</svg>
