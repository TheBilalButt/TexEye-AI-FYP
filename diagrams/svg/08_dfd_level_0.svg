<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
  </defs>

  <!-- Academic Double Frame -->
  <rect x="15" y="15" width="1170" height="820" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1160" height="810" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="600" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 4.3: Data Flow Diagram (DFD Level 0)</text>
  <line x1="50" y1="62" x2="1150" y2="62" stroke="#cccccc" stroke-width="1"/>

  <!-- External Entity: Camera & Encoder -->
  <rect x="50" y="140" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="140" y="175" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Sensors &amp; Encoder</text>

  <!-- Process 1.0 -->
  <rect x="330" y="130" width="220" height="80" rx="16" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <line x1="330" y1="160" x2="550" y2="160" stroke="#000000" stroke-width="0.8"/>
  <text x="350" y="152" fill="#000000" font-size="11" font-weight="bold">1.0</text>
  <text x="440" y="185" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Ingest Signals &amp; Frames</text>

  <!-- Entity to Process 1.0 -->
  <line x1="230" y1="170" x2="330" y2="170" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="280" y="162" fill="#000000" font-size="10" text-anchor="middle">Raw Data</text>

  <!-- Process 2.0: Quality & Defects -->
  <rect x="670" y="130" width="220" height="80" rx="16" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <line x1="670" y1="160" x2="890" y2="160" stroke="#000000" stroke-width="0.8"/>
  <text x="690" y="152" fill="#000000" font-size="11" font-weight="bold">2.0</text>
  <text x="780" y="180" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Analyze Quality &amp;</text>
  <text x="780" y="196" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Detect Defects</text>

  <!-- Process 1.0 to 2.0 -->
  <line x1="550" y1="170" x2="670" y2="170" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="610" y="162" fill="#000000" font-size="10" text-anchor="middle">Sync Frame</text>

  <!-- External Entity: Floor Operator -->
  <rect x="50" y="440" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="140" y="475" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Floor Operator</text>

  <!-- Process 2.0 to Floor Operator (Alert) -->
  <line x1="720" y1="210" x2="720" y2="350" stroke="#000000" stroke-width="1.2"/>
  <line x1="720" y1="350" x2="140" y2="350" stroke="#000000" stroke-width="1.2"/>
  <line x1="140" y1="350" x2="140" y2="440" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="430" y="342" fill="#000000" font-size="10" text-anchor="middle">Real-Time Flaw &amp; Reliability Alert</text>

  <!-- Data Store D1: Local Storage -->
  <g transform="translate(670, 320)">
    <line x1="0" y1="0" x2="220" y2="0" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="50" x2="220" y2="50" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="50" stroke="#000000" stroke-width="1.5"/>
    <line x1="50" y1="0" x2="50" y2="50" stroke="#000000" stroke-width="1"/>
    <text x="25" y="30" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">D1</text>
    <text x="135" y="30" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Local SQLite Outbox</text>
  </g>

  <!-- Process 2.0 to D1 -->
  <line x1="780" y1="210" x2="780" y2="320" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="830" y="270" fill="#000000" font-size="10">Defect Record</text>

  <!-- Process 3.0: Sync & Management -->
  <rect x="670" y="470" width="220" height="80" rx="16" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <line x1="670" y1="500" x2="890" y2="500" stroke="#000000" stroke-width="0.8"/>
  <text x="690" y="492" fill="#000000" font-size="11" font-weight="bold">3.0</text>
  <text x="780" y="520" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Synchronize &amp;</text>
  <text x="780" y="536" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Ingest Records</text>

  <!-- D1 to Process 3.0 -->
  <line x1="780" y1="370" x2="780" y2="470" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="825" y="425" fill="#000000" font-size="10">Queued Batch</text>

  <!-- Data Store D2: Central DB -->
  <g transform="translate(670, 640)">
    <line x1="0" y1="0" x2="220" y2="0" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="50" x2="220" y2="50" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="50" stroke="#000000" stroke-width="1.5"/>
    <line x1="50" y1="0" x2="50" y2="50" stroke="#000000" stroke-width="1"/>
    <text x="25" y="30" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">D2</text>
    <text x="135" y="30" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">PostgreSQL Central DB</text>
  </g>

  <!-- Process 3.0 to D2 -->
  <line x1="780" y1="550" x2="780" y2="640" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="830" y="595" fill="#000000" font-size="10">Certified Data</text>

  <!-- Process 4.0: Reporting & Analytics -->
  <rect x="330" y="625" width="220" height="80" rx="16" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <line x1="330" y1="655" x2="550" y2="655" stroke="#000000" stroke-width="0.8"/>
  <text x="350" y="647" fill="#000000" font-size="11" font-weight="bold">4.0</text>
  <text x="440" y="675" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Provide Web &amp;</text>
  <text x="440" y="691" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Mobile Analytics</text>

  <!-- D2 to Process 4.0 -->
  <line x1="670" y1="665" x2="550" y2="665" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="610" y="657" fill="#000000" font-size="10" text-anchor="middle">Fetch Records</text>

  <!-- External Entity: Quality Inspector & Managers -->
  <rect x="970" y="635" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="1060" y="670" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Inspector &amp; Manager</text>

  <!-- Process 4.0 to Inspector & Manager -->
  <line x1="440" y1="705" x2="440" y2="760" stroke="#000000" stroke-width="1.2"/>
  <line x1="440" y1="760" x2="1060" y2="760" stroke="#000000" stroke-width="1.2"/>
  <line x1="1060" y1="760" x2="1060" y2="695" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="750" y="752" fill="#000000" font-size="10" text-anchor="middle">Inspection Reports, Defect Maps &amp; Grade</text>

</svg>
