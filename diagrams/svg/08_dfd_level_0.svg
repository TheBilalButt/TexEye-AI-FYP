<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1450 900" style="background-color:#0b1120;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="hdr8" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="pGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><filter id="sh8" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".5" stdDeviation="6"/></filter><marker id="mB8" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#38bdf8" d="M0,0 L0,6 L9,3 z"/></marker><marker id="mG8" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#4ade80" d="M0,0 L0,6 L9,3 z"/></marker><marker id="mR8" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#f87171" d="M0,0 L0,6 L9,3 z"/></marker><marker id="mY8" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#fbbf24" d="M0,0 L0,6 L9,3 z"/></marker></defs><g filter="url(#sh8)" transform="translate(100, 30)"><rect width="1250" height="70" fill="url(#hdr8)" stroke="#334155" stroke-width="1.5" rx="12"/><text x="625" y="32" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">TexEye AI — Level 0 Data Flow Diagram (DFD L0)</text><text x="625" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">5 Major Functional Processes • Data Stores (D1 to D4) • Edge-to-Cloud Data Flows</text></g><g filter="url(#sh8)" transform="translate(100, 160)"><rect width="320" height="110" fill="url(#pGrad)" stroke="#38bdf8" stroke-width="2" rx="20"/><text x="160" y="35" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">1.0 Ingest &amp; Validate</text><text x="160" y="55" fill="#