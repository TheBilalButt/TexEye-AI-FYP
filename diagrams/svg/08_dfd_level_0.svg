<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1250" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="hdr8" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <filter id="sh8" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/></filter>
    <marker id="mB8" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="mG8" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4ade80"/></marker>
    <marker id="mR8" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f87171"/></marker>
    <marker id="mY8" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker>
  </defs>

  <!-- Title -->
  <g transform="translate(100, 30)" filter="url(#sh8)">
    <rect width="1250" height="70" rx="12" fill="url(#hdr8)" stroke="#334155" stroke-width="1.5"/>
    <text x="625" y="32" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">TexEye AI &mdash; Level 0 Data Flow Diagram (DFD L0)</text>
    <text x="625" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">5 Major Functional Processes &bull; Data Stores (D1 to D4) &bull; Edge-to-Cloud Data Flows</text>
  </g>

  <!-- Process 1.0 -->
  <g transform="translate(100, 160)" filter="url(#sh8)">
    <rect width="320" height="110" rx="20" fill="url(#pGrad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="160" y="35" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">1.0 Ingest &amp; Validate</text>
    <text x="160" y="55" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Hardware Signals</text>
    <text x="160" y="80" fill="#94a3b8" font-size="11" text-anchor="middle">Camera Ingestion &bull; Encoder Counter</text>
    <text x="160" y="98" fill="#fca5a5" font-size="10" text-anchor="middle">Dropped-Frame &amp; Light Quality Gate</text>
  </g>

  <!-- Process 2.0 -->
  <g transform="translate(565, 160)" filter="url(#sh8)">
    <rect width="320" height="110" rx="20" fill="url(#pGrad)" stroke="#c084fc" stroke-width="2"/>
    <text x="160" y="35" fill="#c084fc" font-size="14" font-weight="bold" text-anchor="middle">2.0 Process AI Detection,</text>
    <text x="160" y="55" fill="#c084fc" font-size="14" font-weight="bold" text-anchor="middle">Tracking &amp; Metrology</text>
    <text x="160" y="80" fill="#94a3b8" font-size="11" text-anchor="middle">YOLO Inference &bull; Multi-frame Tracker</text>
    <text x="160" y="98" fill="#e9d5ff" font-size="10" text-anchor="middle">Deduplication Gate &bull; Metric (X, Y) Calc</text>
  </g>

  <path d="M 420 215 L 565 215" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#mB8)"/>
  <text x="440" y="205" fill="#38bdf8" font-size="10" font-weight="bold">Reliable Frames + &Delta;L</text>

  <!-- Process 3.0 -->
  <g transform="translate(100, 390)" filter="url(#sh8)">
    <rect width="320" height="110" rx="20" fill="url(#pGrad)" stroke="#f59e0b" stroke-width="2"/>
    <text x="160" y="35" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">3.0 Manage Edge Storage</text>
    <text x="160" y="55" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">&amp; Offline Sync Engine</text>
    <text x="160" y="80" fill="#94a3b8" font-size="11" text-anchor="middle">Local SQLite Cache &bull; Outbox Outflow</text>
    <text x="160" y="98" fill="#fde68a" font-size="10" text-anchor="middle">Periodic Probe &bull; Auto-Sync on Reconnect</text>
  </g>

  <!-- Link 1.0 -> 3.0 (Uninspected Section Anomaly) -->
  <path d="M 180 270 L 180 390" stroke="#f87171" stroke-width="2" marker-end="url(#mR8)"/>
  <text x="190" y="340" fill="#f87171" font-size="10" font-weight="bold">Uninspected Section Anomaly [L1, L2]</text>

  <!-- Link 2.0 -> 3.0 (Unique Defect Records) -->
  <path d="M 725 270 L 725 350 L 380 350 L 380 390" stroke="#c084fc" stroke-width="2" marker-end="url(#mB8)"/>
  <text x="500" y="340" fill="#c084fc" font-size="10" font-weight="bold">Unique Defect Coordinates &amp; Crop</text>

  <!-- DATA STORES: D1 & D2 (Edge) -->
  <g transform="translate(60, 570)" filter="url(#sh8)">
    <rect width="180" height="65" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="60" y1="570" x2="60" y2="635" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="90" y="30" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">D1: SQLite DB</text>
    <text x="90" y="48" fill="#94a3b8" font-size="10" text-anchor="middle">Local Inspection Data</text>
  </g>
  <path d="M 190 500 L 190 570" stroke="#fbbf24" stroke-width="2"/>

  <g transform="translate(280, 570)" filter="url(#sh8)">
    <rect width="180" height="65" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="280" y1="570" x2="280" y2="635" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="90" y="30" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">D2: Outbox Queue</text>
    <text x="90" y="48" fill="#94a3b8" font-size="10" text-anchor="middle">Pending Transactions</text>
  </g>
  <path d="M 330 500 L 330 570" stroke="#fbbf24" stroke-width="2"/>

  <!-- Process 4.0 -->
  <g transform="translate(565, 390)" filter="url(#sh8)">
    <rect width="320" height="110" rx="20" fill="url(#pGrad)" stroke="#4ade80" stroke-width="2"/>
    <text x="160" y="35" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle">4.0 Manage Central Quality,</text>
    <text x="160" y="55" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle">Roll Grading &amp; Reports</text>
    <text x="160" y="80" fill="#94a3b8" font-size="11" text-anchor="middle">4-Point Standard Penalty Calculation</text>
    <text x="160" y="98" fill="#86efac" font-size="10" text-anchor="middle">Automated PDF Report &amp; Trend Analytics</text>
  </g>

  <!-- Uplink 3.0 -> 4.0 -->
  <path d="M 420 445 L 565 445" stroke="#4ade80" stroke-width="3" marker-end="url(#mG8)"/>
  <text x="440" y="435" fill="#4ade80" font-size="10" font-weight="bold">HTTPS Batch Sync</text>

  <!-- DATA STORES: D3 & D4 (Central) -->
  <g transform="translate(980, 370)" filter="url(#sh8)">
    <rect width="200" height="65" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="100" y="30" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">D3: PostgreSQL DB</text>
    <text x="100" y="48" fill="#94a3b8" font-size="10" text-anchor="middle">Central Enterprise Store</text>
  </g>
  <path d="M 885 410 L 980 410" stroke="#4ade80" stroke-width="2"/>

  <g transform="translate(980, 460)" filter="url(#sh8)">
    <rect width="200" height="65" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="100" y="30" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">D4: Object Storage</text>
    <text x="100" y="48" fill="#94a3b8" font-size="10" text-anchor="middle">MinIO/S3 Defect Images</text>
  </g>
  <path d="M 885 480 L 980 480" stroke="#4ade80" stroke-width="2"/>

  <!-- Process 5.0 -->
  <g transform="translate(565, 620)" filter="url(#sh8)">
    <rect width="320" height="110" rx="20" fill="url(#pGrad)" stroke="#f472b6" stroke-width="2"/>
    <text x="160" y="35" fill="#f472b6" font-size="14" font-weight="bold" text-anchor="middle">5.0 Serve User Applications</text>
    <text x="160" y="55" fill="#f472b6" font-size="14" font-weight="bold" text-anchor="middle">&amp; Dispatch Alerts</text>
    <text x="160" y="80" fill="#94a3b8" font-size="11" text-anchor="middle">Mobile QR Scanner &bull; Defect Review</text>
    <text x="160" y="98" fill="#fbcfe8" font-size="10" text-anchor="middle">Interactive Web Defect Map Canvas</text>
  </g>
  <path d="M 725 500 L 725 620" stroke="#f472b6" stroke-width="2.5" marker-end="url(#mB8)"/>
  <text x="735" y="560" fill="#f472b6" font-size="11" font-weight="bold">Inspection Status &amp; Grades</text>

  <!-- External User Entities Connected to 5.0 -->
  <g transform="translate(100, 800)" filter="url(#sh8)">
    <rect width="220" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="110" y="27" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Floor Operator</text>
    <text x="110" y="47" fill="#94a3b8" font-size="10" text-anchor="middle">Mobile Client</text>
  </g>

  <g transform="translate(370, 800)" filter="url(#sh8)">
    <rect width="220" height="60" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="110" y="27" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">Quality Inspector</text>
    <text x="110" y="47" fill="#94a3b8" font-size="10" text-anchor="middle">Web &amp; Mobile Client</text>
  </g>

  <g transform="translate(640, 800)" filter="url(#sh8)">
    <rect width="220" height="60" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="110" y="27" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">Production Manager</text>
    <text x="110" y="47" fill="#94a3b8" font-size="10" text-anchor="middle">Web Dashboard</text>
  </g>

  <g transform="translate(910, 800)" filter="url(#sh8)">
    <rect width="220" height="60" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="110" y="27" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Inventory Manager</text>
    <text x="110" y="47" fill="#94a3b8" font-size="10" text-anchor="middle">Web Dashboard</text>
  </g>

  <g transform="translate(1180, 800)" filter="url(#sh8)">
    <rect width="220" height="60" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
    <text x="110" y="27" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle">System Admin</text>
    <text x="110" y="47" fill="#94a3b8" font-size="10" text-anchor="middle">Web Management</text>
  </g>

  <path d="M 620 730 L 210 800" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 670 730 L 480 800" stroke="#a855f7" stroke-width="1.5"/>
  <path d="M 725 730 L 750 800" stroke="#4ade80" stroke-width="1.5"/>
  <path d="M 780 730 L 1020 800" stroke="#fbbf24" stroke-width="1.5"/>
  <path d="M 830 730 L 1290 800" stroke="#f87171" stroke-width="1.5"/>

</svg>
