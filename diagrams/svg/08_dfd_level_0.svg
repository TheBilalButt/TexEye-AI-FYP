<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
  </defs>

  <!-- Academic Double Frame (ReDez SRDS Standard) -->
  <rect x="15" y="15" width="1170" height="820" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="1160" height="810" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="600" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 4.3: Data Flow Diagram (DFD Level 0)</text>
  <line x1="50" y1="62" x2="1150" y2="62" stroke="#cccccc" stroke-width="1"/>

  <!-- External Entity 1: Sensors & Encoder (Top Left) -->
  <rect x="50" y="140" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="140" y="175" fill="#000000" font-size="12.5" font-weight="bold" text-anchor="middle">Sensors &amp; Encoder</text>

  <!-- Process 1.0 (Clean Human-Made Rounded Box - No Dividing Line) -->
  <rect x="330" y="130" width="220" height="80" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="440" y="165" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">1.0 Ingest Signals</text>
  <text x="440" y="185" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">&amp; Camera Frames</text>

  <!-- Entity to Process 1.0 -->
  <line x1="230" y1="170" x2="330" y2="170" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="250" y="150" width="60" height="18" fill="#ffffff" stroke="none"/>
  <text x="280" y="163" fill="#000000" font-size="10.5" text-anchor="middle">Raw Data</text>

  <!-- Process 2.0 (Clean Human-Made Rounded Box - No Dividing Line) -->
  <rect x="670" y="130" width="220" height="80" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="780" y="165" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">2.0 Analyze Quality</text>
  <text x="780" y="185" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">&amp; Detect Defects</text>

  <!-- Process 1.0 to 2.0 -->
  <line x1="550" y1="170" x2="670" y2="170" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="575" y="150" width="70" height="18" fill="#ffffff" stroke="none"/>
  <text x="610" y="163" fill="#000000" font-size="10.5" text-anchor="middle">Sync Frame</text>

  <!-- External Entity 2: Floor Operator (Middle Left) -->
  <rect x="50" y="440" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="140" y="475" fill="#000000" font-size="12.5" font-weight="bold" text-anchor="middle">Floor Operator</text>

  <!-- Process 2.0 to Floor Operator (Alert) -->
  <line x1="720" y1="210" x2="720" y2="350" stroke="#000000" stroke-width="1.2"/>
  <line x1="720" y1="350" x2="140" y2="350" stroke="#000000" stroke-width="1.2"/>
  <line x1="140" y1="350" x2="140" y2="440" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="330" y="340" width="200" height="20" fill="#ffffff" stroke="none"/>
  <text x="430" y="354" fill="#000000" font-size="10.5" text-anchor="middle">Real-Time Flaw &amp; Reliability Alert</text>

  <!-- Data Store D1: Clean Standard Database Box (No nested cuts) -->
  <rect x="670" y="320" width="220" height="50" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="780" y="350" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">D1: Local SQLite Outbox</text>

  <!-- Process 2.0 to D1 -->
  <line x1="780" y1="210" x2="780" y2="320" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="790" y="258" width="90" height="18" fill="#ffffff" stroke="none"/>
  <text x="835" y="271" fill="#000000" font-size="10.5">Defect Record</text>

  <!-- Process 3.0 (Clean Human-Made Rounded Box - No Dividing Line) -->
  <rect x="670" y="470" width="220" height="80" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="780" y="505" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">3.0 Synchronize &amp;</text>
  <text x="780" y="525" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Ingest Records</text>

  <!-- D1 to Process 3.0 -->
  <line x1="780" y1="370" x2="780" y2="470" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="790" y="413" width="90" height="18" fill="#ffffff" stroke="none"/>
  <text x="835" y="426" fill="#000000" font-size="10.5">Queued Batch</text>

  <!-- Data Store D2: Clean Standard Database Box (No nested cuts) -->
  <rect x="670" y="640" width="220" height="50" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="780" y="670" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">D2: PostgreSQL Central DB</text>

  <!-- Process 3.0 to D2 -->
  <line x1="780" y1="550" x2="780" y2="640" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="790" y="588" width="90" height="18" fill="#ffffff" stroke="none"/>
  <text x="835" y="601" fill="#000000" font-size="10.5">Certified Data</text>

  <!-- Process 4.0 (Clean Human-Made Rounded Box - No Dividing Line) -->
  <rect x="330" y="625" width="220" height="80" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="440" y="660" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">4.0 Provide Web &amp;</text>
  <text x="440" y="680" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Mobile Analytics</text>

  <!-- D2 to Process 4.0 -->
  <line x1="670" y1="665" x2="550" y2="665" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="565" y="645" width="90" height="18" fill="#ffffff" stroke="none"/>
  <text x="610" y="658" fill="#000000" font-size="10.5" text-anchor="middle">Fetch Records</text>

  <!-- External Entity 3: Quality Inspector & Managers -->
  <rect x="970" y="635" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="1060" y="670" fill="#000000" font-size="12.5" font-weight="bold" text-anchor="middle">Inspector &amp; Manager</text>

  <!-- Process 4.0 to Inspector & Manager -->
  <line x1="440" y1="705" x2="440" y2="760" stroke="#000000" stroke-width="1.2"/>
  <line x1="440" y1="760" x2="1060" y2="760" stroke="#000000" stroke-width="1.2"/>
  <line x1="1060" y1="760" x2="1060" y2="695" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="630" y="750" width="240" height="18" fill="#ffffff" stroke="none"/>
  <text x="750" y="763" fill="#000000" font-size="10.5" text-anchor="middle">Inspection Reports, Defect Maps &amp; Grade</text>

</svg>
