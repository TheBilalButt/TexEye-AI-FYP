<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
  </defs>

  <!-- Academic Double Frame -->
  <rect x="15" y="15" width="970" height="1220" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="20" width="960" height="1210" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Caption Title -->
  <text x="500" y="50" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">Figure 2.2: AI Vision, Tracking and Metrology Workflow</text>
  <line x1="50" y1="62" x2="950" y2="62" stroke="#cccccc" stroke-width="1"/>

  <!-- Start Symbol -->
  <circle cx="500" cy="95" r="14" fill="#000000" stroke="#000000" stroke-width="1.5"/>

  <!-- Step 1: Ingest Frame & Encoder -->
  <line x1="500" y1="109" x2="500" y2="135" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="135" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="161" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Ingest Synchronized Frame &amp; Encoder Tick</text>

  <!-- Step 2: Pre-Inference Quality Checks -->
  <line x1="500" y1="177" x2="500" y2="205" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="205" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="231" fill="#000000" font-size="12" text-anchor="middle">Check Connectivity, Lighting &amp; Sharpness</text>

  <!-- Decision: Quality Acceptable? -->
  <line x1="500" y1="247" x2="500" y2="275" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <polygon points="500 275, 620 310, 500 345, 380 310" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="314" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Frame Reliable?</text>

  <!-- [No] Branch: Uninspected Span -->
  <line x1="380" y1="310" x2="230" y2="310" stroke="#000000" stroke-width="1.2"/>
  <line x1="230" y1="310" x2="230" y2="355" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="310" y="302" fill="#000000" font-size="11" font-weight="bold">No</text>

  <rect x="110" y="355" width="240" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="230" y="381" fill="#000000" font-size="12" text-anchor="middle">Log Telemetry Anomaly</text>

  <line x1="230" y1="397" x2="230" y2="425" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="110" y="425" width="240" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="230" y="451" fill="#000000" font-size="11.5" font-weight="bold" text-anchor="middle">Mark Span as Uninspected</text>

  <!-- [Yes] Branch: Inference Pipeline -->
  <line x1="500" y1="345" x2="500" y2="380" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="510" y="365" fill="#000000" font-size="11" font-weight="bold">Yes</text>

  <rect x="360" y="380" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="406" fill="#000000" font-size="12" text-anchor="middle">ROI Crop &amp; Undistortion</text>

  <line x1="500" y1="422" x2="500" y2="450" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="450" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="476" fill="#000000" font-size="12" text-anchor="middle">Execute AI Defect Detection</text>

  <!-- Decision: Defect Detected? -->
  <line x1="500" y1="492" x2="500" y2="520" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <polygon points="500 520, 620 555, 500 590, 380 555" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="559" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Defect Found?</text>

  <!-- [No Defect] Branch -->
  <line x1="620" y1="555" x2="770" y2="555" stroke="#000000" stroke-width="1.2"/>
  <line x1="770" y1="555" x2="770" y2="600" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="680" y="547" fill="#000000" font-size="11" font-weight="bold">No</text>

  <rect x="650" y="600" width="240" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="770" y="626" fill="#000000" font-size="12" text-anchor="middle">Record Clean Verified Meterage</text>

  <!-- [Yes Defect] Branch -->
  <line x1="500" y1="590" x2="500" y2="625" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="510" y="610" fill="#000000" font-size="11" font-weight="bold">Yes</text>

  <rect x="360" y="625" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="651" fill="#000000" font-size="12" text-anchor="middle">Track Defect Across Consecutive Frames</text>

  <line x1="500" y1="667" x2="500" y2="695" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="695" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="721" fill="#000000" font-size="12" text-anchor="middle">Filter Duplicate Defect Instances</text>

  <line x1="500" y1="737" x2="500" y2="765" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="765" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="791" fill="#000000" font-size="12" text-anchor="middle">Calculate Physical Coordinates (X, Y)</text>

  <!-- Merge All 3 Branches -->
  <line x1="230" y1="467" x2="230" y2="835" stroke="#000000" stroke-width="1.2"/>
  <line x1="230" y1="835" x2="475" y2="835" stroke="#000000" stroke-width="1.2"/>

  <line x1="770" y1="642" x2="770" y2="835" stroke="#000000" stroke-width="1.2"/>
  <line x1="770" y1="835" x2="525" y2="835" stroke="#000000" stroke-width="1.2"/>

  <line x1="500" y1="807" x2="500" y2="825" stroke="#000000" stroke-width="1.2"/>

  <polygon points="500 825, 525 835, 500 845, 475 835" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <line x1="500" y1="845" x2="500" y2="875" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Step: Assemble Payload -->
  <rect x="360" y="875" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="901" fill="#000000" font-size="12" text-anchor="middle">Assemble Inspection Record Payload</text>

  <!-- Step: Write Local SQLite DB -->
  <line x1="500" y1="917" x2="500" y2="945" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="945" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="971" fill="#000000" font-size="12" text-anchor="middle">Commit Record to Local Storage</text>

  <!-- Step: Enqueue Outbox Queue -->
  <line x1="500" y1="987" x2="500" y2="1015" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="1015" width="280" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="500" y="1041" fill="#000000" font-size="12" text-anchor="middle">Enqueue to Synchronization Outbox</text>

  <!-- End Node -->
  <line x1="500" y1="1057" x2="500" y2="1090" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <circle cx="500" cy="1110" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <circle cx="500" cy="1110" r="8" fill="#000000"/>
</svg>
