<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1400 1320" style="background-color:#0b1120;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="headerGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="purpleGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#7e22ce"/><stop offset="100%" stop-color="#3b0764"/></linearGradient><linearGradient id="blueGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="greenGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#15803d"/><stop offset="100%" stop-color="#052e16"/></linearGradient><linearGradient id="redGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#991b1b"/><stop offset="100%" stop-color="#450a0a"/></linearGradient><filter id="shadow2" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".5" stdDeviation="6"/></filter><marker id="arrB" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#38bdf8" d="M0,0 L0,6 L9,3 z"/></marker><marker id="arrP" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#c084fc" d="M0,0 L0,6 L9,3 z"/></marker><marker id="arrG" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#4ade80" d="M0,0 L0,6 L9,3 z"/></marker><marker id="arrR" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#f87171" d="M0,0 L0,6 L9,3 z"/></marker></defs><g filter="url(#shadow2)" transform="translate(100, 30)"><rect width="1200" height="70" fill="url(#headerGrad2)" stroke="#334155" stroke-width="1.5" rx="12"/><text x="600" y="32" fill="#c084fc" font-size="20" font-weight="bold" text-anchor="middle">TexEye AI — Detailed AI Vision, Tracking &amp; Metrology Pipeline</text><text x="600" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Muhammad Bilal Butt (FA23-BAI-042) | Real-Time Detection, Multi-Frame Tracking &amp; Encoder Synchronization</text></g><g filter="url(#shadow2)" transform="translate(450, 125)"><rect width="500" height="50" fill="#0284c7" stroke="#38bdf8" stroke-width="2" rx="25"/><text x="250" y="31" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">Synchronized Video Stream &amp; Rotary Encoder Ticks</text></g><path stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrB)" d="M 700 175 L 700 205"/><g filter="url(#shadow2)" transform="translate(100, 210)"><rect width="1200" height="230" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="12"/><text x="25" y="28" fill="#38bdf8" font-size="14" font-weight="bold">STAGE 1: PRE-INFERENCE RELIABILITY &amp; INTEGRITY GATE</text><polygon fill="url(#blueGrad)" stroke="#38bdf8" stroke-width="1.5" points="170 50 290 105 170 160 50 105"/><text x="170" y="100" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Frame Sequence</text><text x="170" y="118" fill="#93c5fd" font-size="10" text-anchor="middle">Dropped Frames?</text><polygon fill="url(#blueGrad)" stroke="#38bdf8" stroke-width="1.5" points="570 50 690 105 570 160 450 105"/><text x="570" y="100" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Illumination</text><text x="570" y="118" fill="#93c5fd" font-size="10" text-anchor="middle">Luminance Histogram</text><polygon fill="url(#blueGrad)" stroke="#38bdf8" stroke-width="1.5" points="970 50 1090 105 970 160 850 105"/><text x="970" y="100" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Image Sharpness</text><text x="970" y="118" fill="#93c5fd" font-size="10" text-anchor="middle">Laplacian Variance</text><path stroke="#4ade80" stroke-width="2" marker-end="url(#arrG)" d="M 290 105 L 440 105"/><text x="360" y="95" fill="#4ade80" font-size="11" font-weight="bold">Intact</text><path stroke="#4ade80" stroke-width="2" marker-end="url(#arrG)" d="M 690 105 L 840 105"/><text x="760" y="95" fill="#4ade80" font-size="11" font-weight="bold">Uniform</text><rect width="840" height="38" x="180" y="180" fill="url(#redGrad)" stroke="#ef4444" stroke-width="1.5" rx="6"/><text x="600" y="204" fill="#fecaca" font-size="12" font-weight="bold" text-anchor="middle">ANY FAILURE → Compute Span [L1, L2], Flag as UNINSPECTED (Bypasses AI Inference)</text><path stroke="#f87171" stroke-width="2" d="M 170 160 L 170 180"/><path stroke="#f87171" stroke-width="2" d="M 570 160 L 570 180"/><path stroke="#f87171" stroke-width="2" d="M 970 160 L 970 180"/></g><path stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrG)" d="M 1070 440 L 1070 480 L 700 480 L 700 500"/><g filter="url(#shadow2)" transform="translate(100, 505)"><rect width="1200" height="190" fill="#0f172a" stroke="#c084fc" stroke-width="2" rx="12"/><text x="25" y="28" fill="#c084fc" font-size="14" font-weight="bold">STAGE 2: IMAGE CONDITIONING &amp; AI DEFECT INFERENCE</text><rect width="280" height="60" x="40" y="50" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" rx="8"/><text x="180" y="77" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">ROI Cropping &amp; Undistortion</text><text x="180" y="97" fill="#c084fc" font-size="11" text-anchor="middle">Isolate fabric web boundary</text><rect width="280" height="60" x="370" y="50" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" rx="8"/><text x="510" y="77" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Adaptive Contrast (CLAHE)</text><text x="510" y="97" fill="#c084fc" font-size="11" text-anchor="middle">Enhance warp/weft thread variations</text><rect width="460" height="70" x="700" y="45" fill="url(#purpleGrad)" stroke="#c084fc" stroke-width="2" rx="8"/><text x="930" y="73" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">YOLO AI Defect Detection Backbone</text><text x="930" y="95" fill="#f3e8ff" font-size="11" text-anchor="middle">Hole • Stain • Warp Defect • Weft Defect • Float • Oil Spot</text><path stroke="#c084fc" stroke-width="2" marker-end="url(#arrP)" d="M 320 80 L 360 80"/><path stroke="#c084fc" stroke-width="2" marker-end="url(#arrP)" d="M 650 80 L 690 80"/><rect width="500" height="40" x="350" y="130" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="600" y="155" fill="#93c5fd" font-size="12" text-anchor="middle">Confidence Score ≥ Threshold θ? → Filter False Positives</text></g><path stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrP)" d="M 700 695 L 700 735"/><g filter="url(#shadow2)" transform="translate(100, 740)"><rect width="1200" height="200" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="12"/><text x="25" y="28" fill="#38bdf8" font-size="14" font-weight="bold">STAGE 3: MULTI-FRAME TRACKING &amp; DUPLICATE REDUCTION</text><rect width="320" height="110" x="40" y="55" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8"/><text x="200" y="85" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Multi-Frame Tracker</text><text x="200" y="108" fill="#94a3b8" font-size="11" text-anchor="middle">Kalman Filter Motion Modeling</text><text x="200" y="128" fill="#94a3b8" font-size="11" text-anchor="middle">IoU Matching Across Consecutive Frames</text><text x="200" y="148" fill="#38bdf8" font-size="11" text-anchor="middle">Window: Δt (Fabric Movement Span)</text><path stroke="#38bdf8" stroke-width="2" marker-end="url(#arrB)" d="M 360 110 L 410 110"/><rect width="360" height="110" x="420" y="55" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8"/><text x="600" y="85" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Track State Management</text><text x="600" y="108" fill="#4ade80" font-size="11" text-anchor="middle">• Matched Track → Update Trajectory &amp; Score</text><text x="600" y="128" fill="#38bdf8" font-size="11" text-anchor="middle">• New Appearance → Assign New Track ID</text><text x="600" y="148" fill="#94a3b8" font-size="11" text-anchor="middle">• Lost Track → Terminate after K frames</text><path stroke="#38bdf8" stroke-width="2" marker-end="url(#arrB)" d="M 780 110 L 830 110"/><rect width="320" height="110" x="840" y="55" fill="url(#blueGrad)" stroke="#38bdf8" stroke-width="2" rx="8"/><text x="1000" y="85" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Duplicate Reduction Gate</text><text x="1000" y="108" fill="#bae6fd" font-size="11" text-anchor="middle">Spatial-Temporal Suppression</text><text x="1000" y="130" fill="#fef08a" font-size="11" font-weight="bold" text-anchor="middle">Result: Single Valid Record</text><text x="1000" y="150" fill="#bae6fd" font-size="10" text-anchor="middle">Eliminates repeated defect logging</text></g><path stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrG)" d="M 700 940 L 700 980"/><g filter="url(#shadow2)" transform="translate(100, 985)"><rect width="1200" height="190" fill="#0f172a" stroke="#4ade80" stroke-width="2" rx="12"/><text x="25" y="28" fill="#4ade80" font-size="14" font-weight="bold">STAGE 4: METROLOGY &amp; PHYSICAL COORDINATE ESTIMATION</text><rect width="530" height="110" x="40" y="55" fill="url(#greenGrad)" stroke="#4ade80" stroke-width="1.5" rx="8"/><text x="305" y="85" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Longitudinal Position (Y in meters)</text><text x="305" y="110" fill="#bbf7d0" font-size="12" text-anchor="middle">Y = Cumulative Encoder Pulses × (π × D / PPR)</text><text x="305" y="132" fill="#86efac" font-size="11" text-anchor="middle">Hardware Synchronized with Physical Fabric Movement</text><text x="305" y="150" fill="#dcfce7" font-size="10" text-anchor="middle">Precision: ± 2mm along roll length</text><rect width="530" height="110" x="630" y="55" fill="url(#greenGrad)" stroke="#4ade80" stroke-width="1.5" rx="8"/><text x="895" y="85" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Lateral Position (X in centimeters)</text><text x="895" y="110" fill="#bbf7d0" font-size="12" text-anchor="middle">X = BoundingBox_Center_X × Ground_Resolution (cm/px)</text><text x="895" y="132" fill="#86efac" font-size="11" text-anchor="middle">Camera-to-Fabric Geometric Calibration Engine</text><text x="895" y="150" fill="#dcfce7" font-size="10" text-anchor="middle">Corrects perspective warp &amp; barrel distortion</text></g><path stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrG)" d="M 700 1175 L 700 1215"/><g filter="url(#shadow2)" transform="translate(300, 1220)"><rect width="800" height="75" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="12"/><text x="400" y="32" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Consolidated Defect Record Payload Ready for Local DB &amp; Sync</text><text x="400" y="55" fill="#f8fafc" font-size="12" text-anchor="middle">{ Track_ID: 104, Class: &quot;HOLE&quot;, Confidence: 0.94, X: 42.5cm, Y: 18.2m, Image_Snippet: &quot;blob...&quot; }</text></g></svg>