ont-size="11">PK image_id : UUID</text><text x="14" y="70" fill="#000" font-size="11">FK defect_id : UUID</text><text x="14" y="92" fill="#000" font-size="11">local_file_path : VARCHAR(255)</text><text x="14" y="114" fill="#000" font-size="11">cloud_storage_url : VARCHAR(255)</text><text x="14" y="136" fill="#000" font-size="11">is_uploaded : BOOLEAN</text><text x="14" y="158" fill="#000" font-size="11">captured_at : TIMESTAMP</text></g><g transform="translate(60, 720)"><rect width="260" height="195" fill="#fff" stroke="#000" stroke-width="1.5"/><rect width="260" height="28" fill="#f3f4f6" stroke="#000" stroke-width="1"/><text x="130" y="19" fill="#000" font-size="12" font-weight="bold" text-anchor="middle">INVENTORY_RECORDS</text><text x="14" y="48" fill="#000" font-size="11">PK inventory_id : UUID</text><text x="14" y="70" fill="#000" font-size="11">FK roll_id : UUID</text><text x="14" y="92" fill="#000" font-size="11">warehouse_bay : VARCHAR(20)</text><text x="14" y="114" fill="#000" font-size="11">rack_number : VARCHAR(20)</text><text x="14" y="136" fill="#000" font-size="11">stock_status : VARCHAR(20)</text><text x="14" y="158" fill="#000" font-size="11">last_updated : TIMESTAMP</text></g><g transform="translate(420, 720)"><rect width="270" height="195" fill="#fff" stroke="#000" stroke-width="1.5"/><rect width="270" height="28" fill="#f3f4f6" stroke="#000" stroke-width="1"/><text x="135" y="19" fill="#000" font-size="12" font-weight="bold" text-anchor="middle">SYNC_OUTBOX</text><text x="14" y="48" fill="#000" font-size="11">PK queue_id : UUID</text><text x="14" y="70" fill="#000" font-size="11">FK defect_id : UUID</text><text x="14" y="92" fill="#000" font-size="11">entity_type : VARCHAR(30)</text><text x="14" y="114" fill="#000" font-size="11">payload_json : JSONB</text><text x="14" y="136" fill="#000" font-size="11">sync_status : VARCHAR(20)</text><text x="14" y="158" fill="#000" font-size="11">retry_count : INT</text><text x="14" y="180" fill="#000" font-siz