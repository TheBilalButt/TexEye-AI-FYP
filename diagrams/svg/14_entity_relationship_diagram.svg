<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1550 1400" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="hdr14" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <filter id="sh14" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/></filter>
  </defs>

  <!-- Title -->
  <g transform="translate(100, 30)" filter="url(#sh14)">
    <rect width="1350" height="70" rx="12" fill="url(#hdr14)" stroke="#334155" stroke-width="1.5"/>
    <text x="675" y="32" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">TexEye AI &#8212; Entity Relationship Diagram (ERD &amp; Schema)</text>
    <text x="675" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">PostgreSQL / SQLite Compatible &#8226; Relational Integrity &#8226; Defect Tracking, Uninspected Sections &amp; Offline Sync Queue</text>
  </g>

  <!-- ENTITY 1: users (Top Left) -->
  <g transform="translate(60, 130)" filter="url(#sh14)">
    <rect width="320" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="320" height="35" rx="8" fill="#1e3a8a"/>
    <text x="160" y="23" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">users (System Users &amp; RBAC)</text>
    <g transform="translate(15, 55)" fill="#f8fafc" font-size="11">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK </tspan><tspan fill="#ffffff" font-weight="bold">id</tspan> : uuid</text>
      <text y="20">username : varchar(50) [UNIQUE]</text>
      <text y="40">password_hash : varchar(255)</text>
      <text y="60">full_name : varchar(100)</text>
      <text y="80">email : varchar(100)</text>
      <text y="100">role : varchar(30) [ENUM]</text>
      <text y="120" fill="#94a3b8">  (OPERATOR, INSPECTOR, PROD_MGR,</text>
      <text y="136" fill="#94a3b8">   INV_MGR, SYSTEM_ADMIN)</text>
      <text y="156">is_active : boolean</text>
      <text y="172">created_at : timestamp</text>
    </g>
  </g>

  <!-- ENTITY 2: fabric_rolls (Top Center) -->
  <g transform="translate(420, 130)" filter="url(#sh14)">
    <rect width="330" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="330" height="35" rx="8" fill="#1e3a8a"/>
    <text x="165" y="23" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">fabric_rolls (Physical Rolls)</text>
    <g transform="translate(15, 55)" fill="#f8fafc" font-size="11">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK </tspan><tspan fill="#ffffff" font-weight="bold">id</tspan> : uuid</text>
      <text y="20"><tspan fill="#38bdf8" font-weight="bold">UK </tspan>roll_code_qr : varchar(64)</text>
      <text y="40">batch_number : varchar(50)</text>
      <text y="60">fabric_type : varchar(50)</text>
      <text y="80">total_length_m : decimal(10,2)</text>
      <text y="100">width_cm : decimal(10,2)</text>
      <text y="120">inspection_status : varchar(30)</text>
      <text y="136" fill="#94a3b8">  (PENDING, IN_PROGRESS, DONE)</text>
      <text y="156">final_grade : varchar(20)</text>
      <text y="172">created_at : timestamp</text>
    </g>
  </g>

  <!-- ENTITY 3: inspection_sessions (Top Right) -->
  <g transform="translate(800, 130)" filter="url(#sh14)">
    <rect width="340" height="250" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="340" height="35" rx="8" fill="#1e3a8a"/>
    <text x="170" y="23" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">inspection_sessions (Runs)</text>
    <g transform="translate(15, 55)" fill="#f8fafc" font-size="11">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK </tspan><tspan fill="#ffffff" font-weight="bold">id</tspan> : uuid</text>
      <text y="20"><tspan fill="#a855f7" font-weight="bold">FK </tspan>roll_id : uuid &#8594; fabric_rolls.id</text>
      <text y="40"><tspan fill="#a855f7" font-weight="bold">FK </tspan>operator_id : uuid &#8594; users.id</text>
      <text y="60"><tspan fill="#a855f7" font-weight="bold">FK </tspan>inspector_id : uuid &#8594; users.id</text>
      <text y="80">edge_device_id : varchar(50)</text>
      <text y="100">start_time : timestamp</text>
      <text y="120">end_time : timestamp</text>
      <text y="140">total_inspected_length_m : decimal</text>
      <text y="160" fill="#fca5a5" font-weight="bold">total_uninspected_length_m : decimal</text>
      <text y="180">status : varchar(30)</text>
    </g>
  </g>

  <!-- ENTITY 4: uninspected_sections (Far Right Top) -->
  <g transform="translate(1180, 130)" filter="url(#sh14)">
    <rect width="320" height="250" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect width="320" height="35" rx="8" fill="#7f1d1d"/>
    <text x="160" y="23" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">uninspected_sections</text>
    <g transform="translate(15, 55)" fill="#f8fafc" font-size="11">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK </tspan><tspan fill="#ffffff" font-weight="bold">id</tspan> : uuid</text>
      <text y="20"><tspan fill="#a855f7" font-weight="bold">FK </tspan>session_id : uuid</text>
      <text y="40"><tspan fill="#a855f7" font-weight="bold">FK </tspan>roll_id : uuid</text>
      <text y="60" fill="#fca5a5">start_position_m : decimal(10,2)</text>
      <text y="80" fill="#fca5a5">end_position_m : decimal(10,2)</text>
      <text y="100">failure_reason : varchar(50)</text>
      <text y="120" fill="#94a3b8">  (CAMERA_DISCONNECTED,</text>
      <text y="136" fill="#94a3b8">   POOR_IMAGE_QUALITY,</text>
      <text y="152" fill="#94a3b8">   LIGHTING_ANOMALY,</text>
      <text y="168" fill="#94a3b8">   DROPPED_FRAMES)</text>
      <text y="188">severity_warning : varchar(20)</text>
      <text y="204">logged_at : timestamp</text>
    </g>
  </g>

  <!-- ENTITY 5: defect_records (Center Mid) -->
  <g transform="translate(800, 430)" filter="url(#sh14)">
    <rect width="340" height="340" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <rect width="340" height="35" rx="8" fill="#581c87"/>
    <text x="170" y="23" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">defect_records (AI Detection Log)</text>
    <g transform="translate(15, 55)" fill="#f8fafc" font-size="11">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK </tspan><tspan fill="#ffffff" font-weight="bold">id</tspan> : uuid</text>
      <text y="20"><tspan fill="#a855f7" font-weight="bold">FK </tspan>session_id : uuid</text>
      <text y="40"><tspan fill="#a855f7" font-weight="bold">FK </tspan>roll_id : uuid</text>
      <text y="60">defect_class : varchar(40)</text>
      <text y="80">confidence_score : decimal(5,4)</text>
      <text y="100" fill="#38bdf8" font-weight="bold">position_x_cm : decimal(8,2)</text>
      <text y="120" fill="#fbbf24" font-weight="bold">position_y_m : decimal(10,2)</text>
      <text y="140">bounding_box : json [ymin, xmin...]</text>
      <text y="160">image_path_local : varchar(255)</text>
      <text y="180">image_url_cloud : varchar(255)</text>
      <text y="200">is_verified : boolean</text>
      <text y="220">corrected_class : varchar(40)</text>
      <text y="240"><tspan fill="#a855f7" font-weight="bold">FK </tspan>corrected_by : uuid &#8594; users.id</text>
      <text y="260" fill="#4ade80" font-weight="bold">penalty_points : integer (1..4)</text>
      <text y="280">created_at : timestamp</text>
    </g>
  </g>

  <!-- ENTITY 6: roll_grading (Mid Left) -->
  <g transform="translate(420, 430)" filter="url(#sh14)">
    <rect width="330" height="230" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <rect width="330" height="35" rx="8" fill="#14532d"/>
    <text x="165" y="23" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">roll_grading (4-Point Standard)</text>
    <g transform="translate(15, 55)" fill="#f8fafc" font-size="11">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK </tspan><tspan fill="#ffffff" font-weight="bold">id</tspan> : uuid</text>
      <text y="20"><tspan fill="#a855f7" font-weight="bold">FK </tspan>roll_id : uuid</text>
      <text y="40"><tspan fill="#a855f7" font-weight="bold">FK </tspan>session_id : uuid</text>
      <text y="60">grading_standard : varchar(30)</text>
      <text y="80">total_defect_points : integer</text>
      <text y="100" fill="#4ade80" font-weight="bold">points_per_100_sqm : decimal(8,2)</text>
      <text y="120" fill="#fde68a" font-weight="bold">final_grade : varchar(20)</text>
      <text y="136" fill="#94a3b8">  (GRADE_A, GRADE_B, GRADE_C, REJECT)</text>
      <text y="156"><tspan fill="#a855f7" font-weight="bold">FK </tspan>graded_by : uuid &#8594; users.id</text>
      <text y="172">graded_at : timestamp</text>
    </g>
  </g>

  <!-- ENTITY 7: inventory_records (Far Left Mid) -->
  <g transform="translate(60, 430)" filter="url(#sh14)">
    <rect width="320" height="230" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <rect width="320" height="35" rx="8" fill="#14532d"/>
    <text x="160" y="23" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">inventory_records (Warehouse)</text>
    <g transform="translate(15, 55)" fill="#f8fafc" font-size="11">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK </tspan><tspan fill="#ffffff" font-weight="bold">id</tspan> : uuid</text>
      <text y="20"><tspan fill="#a855f7" font-weight="bold">FK </tspan>roll_id : uuid &#8594; fabric_rolls.id</text>
      <text y="40">warehouse_zone : varchar(30)</text>
      <text y="60">shelf_location : varchar(30)</text>
      <text y="80">stock_status : varchar(30)</text>
      <text y="96" fill="#94a3b8">  (IN_INSPECTION, IN_STOCK,</text>
      <text y="112" fill="#94a3b8">   DISPATCHED, QUARANTINED)</text>
      <text y="132">is_scrap : boolean</text>
      <text y="152">scrap_reason : text</text>
      <text y="172"><tspan fill="#a855f7" font-weight="bold">FK </tspan>updated_by : uuid &#8594; users.id</text>
      <text y="188">last_updated : timestamp</text>
    </g>
  </g>

  <!-- ENTITY 8: alerts (Far Right Mid) -->
  <g transform="translate(1180, 430)" filter="url(#sh14)">
    <rect width="320" height="230" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect width="320" height="35" rx="8" fill="#7f1d1d"/>
    <text x="160" y="23" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">alerts (Floor &amp; App Alarms)</text>
    <g transform="translate(15, 55)" fill="#f8fafc" font-size="11">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK </tspan><tspan fill="#ffffff" font-weight="bold">id</tspan> : uuid</text>
      <text y="20"><tspan fill="#a855f7" font-weight="bold">FK </tspan>session_id : uuid</text>
      <text y="40"><tspan fill="#a855f7" font-weight="bold">FK </tspan>roll_id : uuid</text>
      <text y="60">alert_type : varchar(40)</text>
      <text y="80">severity : varchar(20)</text>
      <text y="100">message : text</text>
      <text y="120">timestamp : timestamp</text>
      <text y="140"><tspan fill="#a855f7" font-weight="bold">FK </tspan>acknowledged_by : uuid</text>
      <text y="160">acknowledged_at : timestamp</text>
    </g>
  </g>

  <!-- ENTITY 9: offline_sync_queue (Bottom Center) -->
  <g transform="translate(420, 720)" filter="url(#sh14)">
    <rect width="330" height="230" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="330" height="35" rx="8" fill="#78350f"/>
    <text x="165" y="23" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">offline_sync_queue (Outbox)</text>
    <g transform="translate(15, 55)" fill="#f8fafc" font-size="11">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK </tspan><tspan fill="#ffffff" font-weight="bold">id</tspan> : uuid</text>
      <text y="20">entity_type : varchar(30)</text>
      <text y="40">entity_id : uuid</text>
      <text y="60">operation : varchar(10) (INSERT, UPDATE)</text>
      <text y="80">payload_json : json</text>
      <text y="100">sync_status : varchar(20)</text>
      <text y="116" fill="#fde68a">  (PENDING, SYNCED, FAILED)</text>
      <text y="136">retry_count : integer</text>
      <text y="156">last_attempt : timestamp</text>
      <text y="172">created_at : timestamp</text>
    </g>
  </g>

  <!-- Relationships Lines -->
  <!-- rolls -> sessions (1:N) -->
  <path d="M 750 200 L 800 200" stroke="#38bdf8" stroke-width="2"/>
  <text x="765" y="190" fill="#38bdf8" font-size="10" font-weight="bold">1 : N</text>

  <!-- sessions -> defects (1:N) -->
  <path d="M 970 380 L 970 430" stroke="#c084fc" stroke-width="2"/>
  <text x="980" y="410" fill="#c084fc" font-size="10" font-weight="bold">1 : N</text>

  <!-- sessions -> uninspected (1:N) -->
  <path d="M 1140 200 L 1180 200" stroke="#ef4444" stroke-width="2"/>
  <text x="1145" y="190" fill="#ef4444" font-size="10" font-weight="bold">1 : N</text>

  <!-- rolls -> grading (1:1) -->
  <path d="M 585 360 L 585 430" stroke="#4ade80" stroke-width="2"/>
  <text x="595" y="400" fill="#4ade80" font-size="10" font-weight="bold">1 : 1</text>

  <!-- rolls -> inventory (1:1) -->
  <path d="M 420 250 L 300 250 L 300 430" stroke="#4ade80" stroke-width="2"/>
  <text x="310" y="340" fill="#4ade80" font-size="10" font-weight="bold">1 : 1</text>

  <!-- sessions -> alerts (1:N) -->
  <path d="M 1140 330 L 1180 440" stroke="#ef4444" stroke-width="1.5"/>
  <text x="1140" y="400" fill="#ef4444" font-size="10" font-weight="bold">1 : N</text>

</svg>



