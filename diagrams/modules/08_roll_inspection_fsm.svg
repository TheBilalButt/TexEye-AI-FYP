<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;">
  <defs>
    <marker id="fsm-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#0f172a"/>
    </marker>
    <marker id="fsm-arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="fsm-arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="20" y="10" width="800" height="38" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="5"/>
  <text x="420" y="27" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Figure 5.10: Finite State Machine (FSM) — Roll Inspection Run Lifecycle</text>
  <text x="420" y="40" font-size="9" fill="#64748b" text-anchor="middle">Safety Invariant Guarding, Pause/Resume Mechanics, Hardware Gating &amp; Defect Alarm Recovery</text>

  <!-- Initial State (Solid Circle) -->
  <circle cx="420" cy="70" r="8" fill="#0f172a"/>
  
  <!-- Transition: Start -> INITIALIZING -->
  <line x1="420" y1="78" x2="420" y2="105" stroke="#0f172a" stroke-width="1.3" marker-end="url(#fsm-arr)"/>
  <rect x="435" y="83" width="70" height="16" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
  <text x="470" y="94" font-size="7.5" font-weight="bold" fill="#0f172a" text-anchor="middle">scan_qr</text>

  <!-- State 1: INITIALIZING -->
  <rect x="290" y="105" width="260" height="42" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.4"/>
  <rect x="290" y="105" width="260" height="18" rx="5" fill="#f1f5f9"/>
  <text x="420" y="118" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">INITIALIZING</text>
  <text x="420" y="137" font-size="8" fill="#334155" text-anchor="middle">entry / Zero encoder; POST /session/start</text>

  <!-- Transition: INITIALIZING -> RUNNING -->
  <line x1="420" y1="147" x2="420" y2="175" stroke="#0f172a" stroke-width="1.3" marker-end="url(#fsm-arr)"/>
  <rect x="435" y="153" width="80" height="16" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
  <text x="475" y="164" font-size="7.5" font-weight="bold" fill="#0f172a" text-anchor="middle">sensors_ok</text>

  <!-- State 2: RUNNING (Center Core) -->
  <rect x="270" y="175" width="300" height="52" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="270" y="175" width="300" height="20" rx="5" fill="#f1f5f9"/>
  <text x="420" y="189" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">RUNNING</text>
  <text x="420" y="209" font-size="8" fill="#334155" text-anchor="middle">do / Ingest 30fps frames &amp; count optical pulses</text>
  <text x="420" y="221" font-size="8" fill="#334155" text-anchor="middle">infer YOLO defect bboxes &amp; Kalman track (X, Y)</text>

  <!-- ==================== LEFT BRANCH: PAUSE & RESUME ==================== -->
  <!-- Transition: RUNNING -> PAUSED (Leaves left of RUNNING, goes down into PAUSED) -->
  <path d="M 270 190 L 140 190 L 140 255" fill="none" stroke="#0f172a" stroke-width="1.3" marker-end="url(#fsm-arr)"/>
  <rect x="155" y="182" width="95" height="16" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
  <text x="202" y="193" font-size="7.5" font-weight="bold" fill="#0f172a" text-anchor="middle">operator_pause</text>

  <!-- State 3: PAUSED (Left Box) -->
  <rect x="25" y="255" width="225" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.4"/>
  <rect x="25" y="255" width="225" height="18" rx="5" fill="#f8fafc"/>
  <text x="137" y="268" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">PAUSED</text>
  <text x="137" y="286" font-size="8" fill="#334155" text-anchor="middle">do / Freeze displacement counter</text>
  <text x="137" y="296" font-size="7.5" fill="#64748b" text-anchor="middle">Camera buffer suspended</text>

  <!-- Transition: PAUSED -> RUNNING (Leaves top right of PAUSED, enters bottom left of RUNNING) -->
  <path d="M 220 255 L 220 215 L 270 215" fill="none" stroke="#16a34a" stroke-width="1.3" marker-end="url(#fsm-arr-green)"/>
  <rect x="175" y="225" width="90" height="16" fill="#f0fdf4" stroke="#86efac" rx="3"/>
  <text x="220" y="236" font-size="7.5" font-weight="bold" fill="#15803d" text-anchor="middle">operator_resume</text>

  <!-- ==================== RIGHT BRANCH: SENSOR FAULT & RECOVERY ==================== -->
  <!-- Transition: RUNNING -> UNINSPECTED_FAULT (Leaves right of RUNNING, goes down into UNINSPECTED_FAULT) -->
  <path d="M 570 190 L 700 190 L 700 255" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#fsm-arr-red)"/>
  <rect x="585" y="182" width="130" height="16" fill="#fff1f2" stroke="#fca5a5" rx="3"/>
  <text x="650" y="193" font-size="7.5" font-weight="bold" fill="#9f1239" text-anchor="middle">sensor_fault [lux&lt;800|blur]</text>

  <!-- State 4: UNINSPECTED_FAULT (Right Box) -->
  <rect x="585" y="255" width="235" height="52" rx="6" fill="#fff1f2" stroke="#dc2626" stroke-width="1.4"/>
  <rect x="585" y="255" width="235" height="18" rx="5" fill="#fee2e2"/>
  <text x="702" y="268" font-size="9" font-weight="bold" fill="#991b1b" text-anchor="middle">UNINSPECTED_FAULT</text>
  <text x="702" y="286" font-size="8" fill="#be123c" text-anchor="middle">entry / Actuate Amber stack light &amp; buzzer</text>
  <text x="702" y="298" font-size="8" fill="#be123c" text-anchor="middle">do / Suspend AI; record span [Y1, Y2]</text>

  <!-- Transition: UNINSPECTED_FAULT -> RUNNING (Leaves top left of FAULT, enters bottom right of RUNNING) -->
  <path d="M 620 255 L 620 215 L 570 215" fill="none" stroke="#16a34a" stroke-width="1.3" marker-end="url(#fsm-arr-green)"/>
  <rect x="575" y="225" width="95" height="16" fill="#f0fdf4" stroke="#86efac" rx="3"/>
  <text x="622" y="236" font-size="7.5" font-weight="bold" fill="#15803d" text-anchor="middle">sensors_recovered</text>

  <!-- ==================== CENTER BOTTOM: CRITICAL DEFECT ALARM ==================== -->
  <!-- Transition: RUNNING -> ALARM_ACTIVE -->
  <line x1="420" y1="227" x2="420" y2="265" stroke="#dc2626" stroke-width="1.4" marker-end="url(#fsm-arr-red)"/>
  <rect x="340" y="238" width="160" height="16" fill="#fff1f2" stroke="#fca5a5" rx="3"/>
  <text x="420" y="249" font-size="7.5" font-weight="bold" fill="#9f1239" text-anchor="middle">critical_defect [hole&gt;25mm]</text>

  <!-- State 5: ALARM_ACTIVE (Center Box) -->
  <rect x="290" y="265" width="260" height="45" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <rect x="290" y="265" width="260" height="18" rx="5" fill="#fee2e2"/>
  <text x="420" y="278" font-size="9" font-weight="bold" fill="#991b1b" text-anchor="middle">ALARM_ACTIVE</text>
  <text x="420" y="296" font-size="8" fill="#334155" text-anchor="middle">entry / Actuate Red light &amp; audible buzzer</text>
  <text x="420" y="306" font-size="7.5" fill="#64748b" text-anchor="middle">push WebSocket haptic alert to mobile app</text>

  <!-- Transition: ALARM_ACTIVE -> Bullseye -->
  <line x1="420" y1="310" x2="420" y2="340" stroke="#0f172a" stroke-width="1.3" marker-end="url(#fsm-arr)"/>
  <rect x="435" y="318" width="80" height="16" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
  <text x="475" y="329" font-size="7.5" font-weight="bold" fill="#0f172a" text-anchor="middle">operator_ack</text>

  <!-- Terminal State (Bullseye) -->
  <circle cx="420" cy="355" r="9" fill="none" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="420" cy="355" r="5" fill="#0f172a"/>
</svg>
