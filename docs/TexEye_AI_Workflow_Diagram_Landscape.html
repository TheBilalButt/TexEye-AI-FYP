<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TexEye AI - System Workflow Diagram (A4 Landscape)</title>
  <style>
    @page {
      size: A4 landscape;
      margin: 8mm 10mm 8mm 10mm;
    }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    svg {
      width: 100%;
      max-height: 185mm;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" style="background:#ffffff; font-family:Arial, sans-serif;">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#000000"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#555555"/>
    </marker>
  </defs>

  <!-- Title & Header -->
  <rect x="20" y="15" width="1160" height="45" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="6"/>
  <text x="600" y="38" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">TexEye AI — Complete End-to-End System Workflow Diagram</text>
  <text x="600" y="52" font-size="11" fill="#475569" text-anchor="middle">Paper-Reproduction Blueprint for FYP Supervisor Presentation | COMSATS University Islamabad</text>

  <!-- ==================== SWIMLANE CONTAINERS ==================== -->
  
  <!-- 1. Frontend & User Layer (Top) -->
  <rect x="20" y="70" width="1160" height="150" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" rx="6"/>
  <rect x="25" y="75" width="190" height="24" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="120" y="91" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">1. USER &amp; FRONTEND LAYER</text>

  <!-- 2. Hardware Sensing & Reliability (Middle-Top) -->
  <rect x="20" y="235" width="1160" height="165" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" rx="6"/>
  <rect x="25" y="240" width="220" height="24" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="135" y="256" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">2. HARDWARE &amp; SENSING LAYER</text>

  <!-- 3. Edge AI & Local Buffer (Middle-Bottom) -->
  <rect x="20" y="415" width="1160" height="185" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" rx="6"/>
  <rect x="25" y="420" width="240" height="24" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="145" y="436" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">3. EDGE AI &amp; LOCAL BUFFER LAYER</text>

  <!-- 4. Central Backend & Database (Bottom) -->
  <rect x="20" y="615" width="1160" height="215" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" rx="6"/>
  <rect x="25" y="620" width="240" height="24" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="145" y="636" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">4. CENTRAL BACKEND &amp; DATABASE</text>

  <!-- ==================== BOXES & PROCESSES ==================== -->

  <!-- STEP 1: Operator QR Scan (Frontend) -->
  <rect x="45" y="115" width="170" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.4" rx="5"/>
  <text x="130" y="137" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Floor Operator</text>
  <text x="130" y="152" font-size="9.5" fill="#334155" text-anchor="middle">Mobile Floor App</text>
  <text x="130" y="166" font-size="8.5" fill="#64748b" text-anchor="middle">Scan Roll QR &amp; Start Session</text>

  <!-- STEP 2: Physical Fabric Loading & Sensing (Hardware) -->
  <rect x="45" y="280" width="170" height="65" fill="#f1f5f9" stroke="#000000" stroke-width="1.4" rx="5"/>
  <text x="130" y="301" font-size="10.5" font-weight="bold" fill="#000000" text-anchor="middle">Fabric Movement &amp; Sensing</text>
  <text x="130" y="316" font-size="9" fill="#334155" text-anchor="middle">&bull; Industrial Camera (Frames)</text>
  <text x="130" y="330" font-size="9" fill="#334155" text-anchor="middle">&bull; Rotary Encoder (Pulses/Dist)</text>

  <!-- STEP 3: Reliability Gate Decision (Diamond) -->
  <polygon points="310,312 375,275 440,312 375,349" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="375" y="308" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">Inspection</text>
  <text x="375" y="321" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">Reliable?</text>

  <!-- FAULT BRANCH: Physical Alert & Mark Uninspected -->
  <rect x="520" y="275" width="180" height="70" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4" rx="5"/>
  <text x="610" y="296" font-size="10" font-weight="bold" fill="#9f1239" text-anchor="middle">1. Trigger Hardware Relay</text>
  <text x="610" y="310" font-size="8.5" fill="#be123c" text-anchor="middle">Amber/Red Light &amp; Buzzer</text>
  <text x="610" y="324" font-size="10" font-weight="bold" fill="#9f1239" text-anchor="middle">2. Mark Section UNINSPECTED</text>
  <text x="610" y="337" font-size="8" fill="#e11d48" text-anchor="middle">(Interval [L1, L2] Flagged)</text>

  <!-- STEP 4: AI Defect Detection (Edge AI) -->
  <rect x="290" y="450" width="170" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.4" rx="5"/>
  <text x="375" y="471" font-size="10.5" font-weight="bold" fill="#000000" text-anchor="middle">AI Vision Detection</text>
  <text x="375" y="486" font-size="9" fill="#334155" text-anchor="middle">&bull; YOLO Defect Bounding Box</text>
  <text x="375" y="499" font-size="9" fill="#334155" text-anchor="middle">&bull; Defect Class (Hole, Stain...)</text>

  <!-- STEP 5: Metric Coordinate Mapping & Tracking -->
  <rect x="520" y="450" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.4" rx="5"/>
  <text x="610" y="471" font-size="10.5" font-weight="bold" fill="#000000" text-anchor="middle">Location &amp; Deduplication</text>
  <text x="610" y="486" font-size="9" fill="#334155" text-anchor="middle">&bull; Calculate (X_cm, Y_m) via Pulses</text>
  <text x="610" y="499" font-size="9" fill="#334155" text-anchor="middle">&bull; Multi-Frame Tracker (No Dups)</text>

  <!-- STEP 6: Edge Local Buffer (SQLite) -->
  <rect x="760" y="445" width="180" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5" rx="5"/>
  <text x="850" y="468" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Local SQLite Storage</text>
  <text x="850" y="483" font-size="9" fill="#334155" text-anchor="middle">&bull; Zero Delay / Offline-First</text>
  <text x="850" y="496" font-size="9" fill="#334155" text-anchor="middle">&bull; Roll Header &amp; Defect Records</text>
  <text x="850" y="508" font-size="8.5" fill="#64748b" text-anchor="middle">&bull; High-Res JPEG Defect Crops</text>

  <!-- Real-time Mobile Push Alert (from Detection) -->
  <rect x="360" y="115" width="170" height="65" fill="#f8fafc" stroke="#000000" stroke-width="1.2" rx="5"/>
  <text x="445" y="137" font-size="10.5" font-weight="bold" fill="#000000" text-anchor="middle">Mobile Live Floor View</text>
  <text x="445" y="152" font-size="9" fill="#334155" text-anchor="middle">&bull; Instant Defect Vibration/Alert</text>
  <text x="445" y="165" font-size="9" fill="#334155" text-anchor="middle">&bull; Review &amp; Correct Defect Tag</text>

  <!-- Decision: Network Available? -->
  <polygon points="995,480 1055,445 1115,480 1055,515" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="1055" y="476" font-size="9.5" font-weight="bold" fill="#000000" text-anchor="middle">Network</text>
  <text x="1055" y="489" font-size="9.5" font-weight="bold" fill="#000000" text-anchor="middle">Online?</text>

  <!-- Offline Outbox Queue -->
  <rect x="980" y="360" width="150" height="45" fill="#fffbeb" stroke="#d97706" stroke-width="1.2" rx="4"/>
  <text x="1055" y="379" font-size="9.5" font-weight="bold" fill="#92400e" text-anchor="middle">Offline Queue (Outbox)</text>
  <text x="1055" y="393" font-size="8.5" fill="#b45309" text-anchor="middle">Auto-sync when reconnected</text>

  <!-- Central Backend API Server -->
  <rect x="760" y="660" width="180" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.4" rx="5"/>
  <text x="850" y="683" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Central FastAPI Backend</text>
  <text x="850" y="698" font-size="9" fill="#334155" text-anchor="middle">&bull; Ingest HTTPS REST Batches</text>
  <text x="850" y="711" font-size="9" fill="#334155" text-anchor="middle">&bull; WebSocket Broadcast &amp; Auth</text>

  <!-- Central Database & MinIO Store -->
  <rect x="490" y="660" width="200" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.4" rx="5"/>
  <text x="590" y="682" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Central Enterprise DB</text>
  <text x="590" y="697" font-size="9" fill="#334155" text-anchor="middle">&bull; PostgreSQL (Rolls, Defects, Audit)</text>
  <text x="590" y="710" font-size="9" fill="#334155" text-anchor="middle">&bull; Image Storage (Defect Crops)</text>

  <!-- Smart Operations & ASTM 4-Point Engine -->
  <rect x="250" y="660" width="180" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.4" rx="5"/>
  <text x="340" y="681" font-size="10.5" font-weight="bold" fill="#000000" text-anchor="middle">Smart Operations Module</text>
  <text x="340" y="696" font-size="9" fill="#334155" text-anchor="middle">&bull; ASTM D5430 4-Point Grading</text>
  <text x="340" y="709" font-size="9" fill="#334155" text-anchor="middle">&bull; Grade Assignment (A, B, Scrap)</text>

  <!-- Web Dashboard Workstation (Frontend) -->
  <rect x="760" y="115" width="220" height="65" fill="#ffffff" stroke="#000000" stroke-width="1.4" rx="5"/>
  <text x="870" y="136" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Quality Manager / Inspector</text>
  <text x="870" y="151" font-size="9.5" fill="#334155" text-anchor="middle">Web Management Dashboard</text>
  <text x="870" y="165" font-size="8.5" fill="#64748b" text-anchor="middle">2D Defect Map &bull; Crop Gallery &bull; Audit</text>

  <!-- Final PDF Certificate -->
  <rect x="1015" y="115" width="145" height="65" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4" rx="5"/>
  <text x="1087" y="137" font-size="10.5" font-weight="bold" fill="#15803d" text-anchor="middle">Final Result</text>
  <text x="1087" y="151" font-size="9" fill="#166534" text-anchor="middle">PDF Quality Certificate</text>
  <text x="1087" y="165" font-size="8" fill="#15803d" text-anchor="middle">Verified ASTM Scorecard</text>

  <!-- ==================== CONNECTING ARROWS & LABELS ==================== -->

  <!-- Flow 1: Operator -> Sensing (Start Session) -->
  <line x1="130" y1="180" x2="130" y2="280" stroke="#000000" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="138" y="225" font-size="8" font-weight="bold" fill="#000000">1. Start Session</text>

  <!-- Flow 2: Sensing -> Reliability Decision -->
  <line x1="215" y1="312" x2="310" y2="312" stroke="#000000" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="262" y="304" font-size="8" font-weight="bold" fill="#000000" text-anchor="middle">Raw Data</text>

  <!-- Flow 3A: Reliability Decision -> FAULT [NO] -->
  <line x1="440" y1="312" x2="520" y2="312" stroke="#e11d48" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="475" y="304" font-size="9" font-weight="bold" fill="#e11d48" text-anchor="middle">[NO: Blur/Lux/Disconnect]</text>

  <!-- Flow 3B: Reliability Decision -> AI Detection [YES] -->
  <line x1="375" y1="349" x2="375" y2="450" stroke="#000000" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="382" y="395" font-size="9" font-weight="bold" fill="#000000">[YES: Reliable]</text>

  <!-- Fault Path -> Local Storage -->
  <path d="M 700 312 L 850 312 L 850 445" fill="none" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="770" y="305" font-size="8" font-weight="bold" fill="#e11d48">Save Uninspected Span [L1, L2]</text>

  <!-- Flow 4: AI Detection -> Metric Tracking -->
  <line x1="460" y1="480" x2="520" y2="480" stroke="#000000" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="490" y="472" font-size="8" font-weight="bold" fill="#000000" text-anchor="middle">Flaw BBox</text>

  <!-- Mobile Push Alert from Defect Detection -->
  <path d="M 375 450 L 375 200 L 445 200 L 445 180" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr)"/>
  <text x="410" y="215" font-size="8" font-weight="bold" fill="#2563eb" text-anchor="middle">Live Defect Push</text>

  <!-- Flow 5: Metric Tracking -> Local SQLite Buffer -->
  <line x1="700" y1="480" x2="760" y2="480" stroke="#000000" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="730" y="472" font-size="8" font-weight="bold" fill="#000000" text-anchor="middle">(X, Y) Recs</text>

  <!-- Flow 6: Local Buffer -> Network Decision -->
  <line x1="940" y1="480" x2="995" y2="480" stroke="#000000" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Offline Branch: Network Decision -> Queue [NO] -->
  <line x1="1055" y1="445" x2="1055" y2="405" stroke="#d97706" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="1063" y="428" font-size="8.5" font-weight="bold" fill="#d97706">[NO: Offline]</text>

  <!-- Queue -> Sync when restored -->
  <path d="M 1130 382 L 1150 382 L 1150 560 L 1055 560 L 1055 515" fill="none" stroke="#d97706" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr)"/>
  <text x="1152" y="470" font-size="7.5" fill="#d97706" text-anchor="middle" transform="rotate(90, 1152, 470)">When Link Restored</text>

  <!-- Online Branch: Network Decision -> Central Backend [YES] -->
  <path d="M 1055 515 L 1055 692 L 940 692" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="1025" y="605" font-size="8.5" font-weight="bold" fill="#000000">[YES: Online Sync (HTTPS REST / WSS)]</text>

  <!-- Flow 7: Central Backend -> Enterprise Database -->
  <line x1="760" y1="692" x2="690" y2="692" stroke="#000000" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="725" y="684" font-size="8" font-weight="bold" fill="#000000" text-anchor="middle">Save Batches</text>

  <!-- Flow 8: Database -> ASTM 4-Point Engine -->
  <line x1="490" y1="692" x2="430" y2="692" stroke="#000000" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="460" y="684" font-size="8" font-weight="bold" fill="#000000" text-anchor="middle">Compute Grade</text>

  <!-- Flow 9: Backend -> Web Dashboard -->
  <path d="M 850 660 L 850 180" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="860" y="225" font-size="8" font-weight="bold" fill="#000000">Load 2D Map &amp; Audit Data</text>

  <!-- Flow 10: Web Dashboard -> PDF Certificate Export -->
  <line x1="980" y1="147" x2="1015" y2="147" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="997" y="140" font-size="8" font-weight="bold" fill="#16a34a" text-anchor="middle">Export</text>

  <!-- Bottom Legend / Note -->
  <rect x="45" y="755" width="1115" height="55" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="55" y="774" font-size="9.5" font-weight="bold" fill="#0f172a">Supervisor Hand-Drawing Guide (A4 Paper Representation):</text>
  <text x="55" y="790" font-size="8.5" fill="#334155">&bull; 4 Tiers: [Top: User &amp; Screens] &rarr; [Upper Mid: Camera/Encoder &amp; Quality Check] &rarr; [Lower Mid: AI Detection &amp; Local Buffer] &rarr; [Bottom: Cloud Backend &amp; Grading]</text>
  <text x="55" y="802" font-size="8.5" fill="#334155">&bull; Key Decisions: 1. Is camera/light data reliable? (If No, warn &amp; mark uninspected). 2. Is internet up? (If No, buffer locally in SQLite; line never stops!).</text>
</svg>

  </div>
</body>
</html>
